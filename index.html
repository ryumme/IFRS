{
code: "IAS 37", slug: "ias37", topic: "oblig",
title: "Provisions, Contingent Liabilities and Contingent Assets",
titleEn: "Резервы, условные обязательства и условные активы",
tags: ["provision", "contingent liability", "restructuring", "onerous contract", "warranties"],
one: "Draws the line between 'provide', 'disclose' and 'say nothing' using three tests: obligation, probable outflow, reliable estimate.",
why: [
 {p:"Provisions were the favourite tool for managing profit: build a big one in a good year, release it in a bad one. IAS 37 imposed hard conditions to make profit banks impossible."},
 {p:"The standard works as a decision tree. Is there an obligation from a past event? Is an outflow probable (more likely than not)? Can it be estimated reliably? Three yeses → provision. Otherwise → disclosure or nothing."}
],
rules: [
 {h:"Three criteria for a provision", p:"(1) A present **obligation** (legal or constructive) from a past event; (2) an outflow of resources is **probable** — more likely than not; (3) the amount can be **estimated reliably**."},
 {h:"Constructive obligation", p:"Arises where an established pattern of practice or a public statement has created a valid expectation in others. A shop that has accepted returns for years without being obliged to has created one."},
 {h:"Measurement", p:"The **best estimate** of the expenditure required to settle. For a large population of similar items (warranties) use expected value. For a single event use the most likely outcome. Discount where material; the unwinding of the discount is a finance cost."},
 {h:"Contingent liability", p:"A possible obligation confirmed by future events, **or** a present obligation where an outflow is not probable or the amount cannot be estimated reliably. **Not recognised** — disclosed only. If the possibility of outflow is remote, not even disclosed."},
 {h:"Contingent asset", p:"Never recognised. Disclosed only where an inflow is **probable**. It is recognised only once it becomes virtually certain — at which point it is no longer contingent."},
 {h:"Restructuring", p:"A provision requires a detailed formal plan and a valid expectation in those affected (announcement or implementation). Only **direct** costs are included: redundancy, contract termination. **Excluded**: retraining and relocating continuing staff, marketing, investment in new systems, future operating losses."},
 {h:"Onerous contract", p:"The unavoidable costs of meeting the obligations exceed the expected benefits. The provision is the **lower** of the net cost of fulfilling and the penalty for exiting. Assets dedicated to the contract are tested for impairment first."},
 {h:"Future operating losses", p:"**No provision** — there is no past event. Next year's losses are not today's obligation."},
 {h:"Reimbursements", p:"An expected insurance recovery is recognised as a separate asset only if receipt is virtually certain, and **capped** at the amount of the provision. Offsetting in the balance sheet is prohibited; in profit or loss the expense may be shown net."}
],
example: [
 {h:"The decision tree in practice"},
 {table:{head:["Situation","Obligation?","Probability","Outcome"],rows:[
  ["Litigation: lawyers assess loss as probable, $40m","Yes","> 50%","**Provision of $40m**"],
  ["Litigation: loss possible but not probable","Possible","< 50%","Disclose as a contingent liability"],
  ["Litigation: chance of loss is remote","—","Remote","Do nothing"],
  ["Entity plans to close a loss-making plant in June; no announcement","No","—","Nothing — future losses are not provided for"],
  ["Entity is suing someone; a $25m win is probable","Contingent asset","Probable","Disclose only"],
  ["Case won, judgment final, cash on its way","Asset","Virtually certain","**Recognise asset and income**"]
 ]}},
 {h:"A warranty provision: expected value"},
 {p:"200,000 units were sold. Experience: 85% need no repair, 12% need a minor repair ($1,200), 3% need a major repair ($9,000)."},
 {table:{head:["Outcome","Share","Cost per unit","Expected cost"],rows:[
  ["No defect","85%","0","0"],
  ["Minor repair","12%","1,200","$144"],
  ["Major repair","3%","9,000","$270"],
  ["**Expected value per unit**","","","**$414**"],
  ["**Provision**","","200,000 × 414","**$82.8m**"]
 ],note:"For a large population you use a weighted expected value, not the most likely outcome — which here would give a provision of nil."}},
 {h:"An onerous contract"},
 {p:"An entity leases a warehouse it no longer needs: remaining payments $24m, a sublet would bring in at most $9m. The contract can be terminated for a penalty of $18m."},
 {table:{head:["Option","Net cost"],rows:[
  ["Fulfil the contract","24 − 9 = $15m"],
  ["Terminate","$18m"],
  ["**Provision = lower**","**$15m**"]
 ],note:"Note: if the warehouse is leased under IFRS 16, the liability is already on the balance sheet and the right-of-use asset is tested for impairment under IAS 36 instead of raising a provision."}}
],
pitfalls: [
 "Providing for future operating losses or for the future repair of your own equipment — there is no past event.",
 "Recognising a contingent asset even when the win looks certain. Until it is virtually certain, disclosure only.",
 "Including retraining and relocation of continuing staff in a restructuring provision.",
 "Netting a provision against an expected insurance recovery in the balance sheet.",
 "Using the most likely outcome where a population approach is needed (warranties), and vice versa."
],
quiz: [
 {q:"An entity has contaminated land. There is no clean-up law in that country, but the entity publishes an environmental policy and has always cleaned up after itself. Clean-up would cost $70m. Is a provision required?",
  a:"Yes, a provision of $70m",
  e:"There is no legal obligation, but there is a constructive one: a published policy and consistent past conduct have created a valid expectation in the community and regulators. The past event is the contamination itself. Outflow is probable and the amount can be estimated. All three criteria are met."},
 {q:"The board approved a detailed restructuring plan on 15 December; it was announced to employees on 10 February. The reporting date is 31 December. The provision at 31.12 is:",
  opts:["Recognised in full","Recognised at half the amount","Not recognised, but disclosed as a non-adjusting event","Recognised only for redundancy costs"],
  a:2, e:"A board decision alone is not enough: the plan must raise a valid expectation in those affected, through announcement or implementation. At 31 December it had not, so there is no obligation."},
 {q:"A decommissioning obligation ten years away is estimated at $50m (future amount) and the discount rate is 7%. What happens to the provision over the next year?",
  a:"It is recognised at present value and then increased by a finance charge",
  e:"The provision is recognised at 50/(1.07)^10 = $25.4m, with the same amount capitalised into the cost of the asset under IAS 16. A year later it grows to 25.4 × 1.07 = $27.2m, and the $1.8m difference is a finance cost — the unwinding of the discount, not an additional provision."}
]
},

{
code: "IAS 12", slug: "ias12", topic: "oblig",
title: "Income Taxes",
titleEn: "Налоги на прибыль",
tags: ["deferred tax", "temporary differences", "tax base", "DTA", "DTL", "current tax"],
one: "Reconciles the accounting and tax views of the world: wherever they differ in timing, deferred tax appears.",
why: [
 {p:"Accounting says the machine lasts ten years. The tax authority says write it off in five. The profits differ, but over ten years the tax is the same. Deferred tax records that difference as an asset or a liability so the tax charge matches accounting profit."},
 {p:"The method is the **balance sheet approach**: compare the carrying amount of an asset or liability with its tax base. A temporary difference × the tax rate gives the deferred tax liability or asset."}
],
rules: [
 {h:"Tax base of an asset", p:"The amount deductible for tax in future periods. For a machine, its written-down value for tax. If the economic benefits are not taxable, the tax base equals the carrying amount."},
 {h:"Tax base of a liability", p:"Carrying amount less any amount deductible for tax in future. A provision deductible only when paid has a tax base of nil."},
 {h:"Taxable temporary difference", p:"The carrying amount of an asset **exceeds** the tax base (or a liability's is lower). Future taxable profit will be higher → **deferred tax liability (DTL)**."},
 {h:"Deductible temporary difference", p:"The carrying amount of an asset is **below** the tax base (or a liability's is higher). Future taxable profit will be lower → **deferred tax asset (DTA)**."},
 {h:"Recognising a DTA", p:"Only to the extent that future taxable profit is **probable**. Tax losses carried forward give rise to a DTA only with convincing evidence of future profits."},
 {h:"Rate", p:"Use the rate expected to apply when the asset is realised or the liability settled, based on rates enacted or substantively enacted. Discounting deferred tax is **prohibited**."},
 {h:"Permanent differences", p:"Fines, non-deductible entertaining, exempt dividends — these create **no** deferred tax. They only change the effective rate."},
 {h:"Where it goes", p:"Deferred tax follows its transaction. A difference arising from a revaluation → the DTL is recognised in **OCI**. From depreciation → profit or loss. From a transaction with owners → equity."},
 {h:"Recognition exemptions", p:"Goodwill on initial recognition; the initial recognition of an asset or liability in a transaction that is not a business combination and affects neither accounting nor taxable profit (since 2023 this exemption no longer covers leases and decommissioning obligations, for which deferred tax is recognised)."},
 {h:"Offsetting", p:"DTAs and DTLs are offset where there is a legally enforceable right to offset current tax and they relate to the same tax authority."}
],
example: [
 {h:"The basic calculation"},
 {table:{head:["Item","Carrying amount","Tax base","Difference","Type"],rows:[
  ["Equipment","800","560","240","Taxable → DTL"],
  ["Warranty provision","(90)","0","90","Deductible → DTA"],
  ["Receivables (allowance not tax deductible)","430","480","50","Deductible → DTA"],
  ["Revaluation of building (within carrying amount)","+150","0","150","Taxable → DTL (in OCI)"],
  ["Traffic fines expensed","—","—","—","Permanent — no effect"]
 ],note:"At a 20% rate: DTL = (240 + 150) × 20% = 78, of which 30 is recognised in OCI. DTA = (90 + 50) × 20% = 28. The net DTL presented is 50."}},
 {h:"Reconciling the tax charge"},
 {p:"Accounting profit 1,000. Rate 20%. Fines of 40 (non-deductible) and an exempt dividend of 60. Taxable profit per the return is 900."},
 {table:{head:["Item","Amount"],rows:[
  ["Current tax: 900 × 20%","180"],
  ["Movement in deferred tax (DTL up by 16)","16"],
  ["**Tax expense in profit or loss**","**196**"],
  ["Check: 1,000 × 20% = 200; + 40×20% fines = 208; − 60×20% dividend = **196**","✔"]
 ],note:"The effective rate is 196/1,000 = 19.6%. The gap from 20% is explained purely by permanent differences — temporary differences never move the effective rate."}},
 {je:{title:"Entries",lines:[["Dr","Income tax expense (P&L)","166"],["Dr","Income tax (OCI)","30"],["Cr","Current tax payable","180"],["Cr","Deferred tax liability","16"]],note:"The part of the deferred tax relating to the revaluation goes to OCI, alongside the revaluation itself."}},
 {h:"A tax loss"},
 {p:"An entity has a $500m tax loss carried forward indefinitely. Its business plan shows profits of $120m a year for three years and uncertainty thereafter."},
 {p:"The DTA is not recognised on all $500m but only to the extent supported by convincing evidence: $360m × 20% = **$72m**. The remainder is disclosed as an unrecognised deferred tax asset."}
],
pitfalls: [
 "Discounting deferred tax — an express prohibition.",
 "Recognising a DTA with no prospect of taxable profit.",
 "Creating deferred tax on permanent differences.",
 "Taking deferred tax on a revaluation through profit or loss instead of OCI.",
 "Using the current rate when legislation has already enacted a different future rate.",
 "Forgetting that a provision deductible only on payment has a tax base of nil."
],
quiz: [
 {q:"Carrying amount of equipment 400, tax base 250, rate 20%. What appears in the statement of financial position?",
  a:"A DTL of 30",
  e:"The carrying amount exceeds the tax base by 150 — a taxable temporary difference. Less will remain deductible in future than has already been charged in the accounts, so future tax will be higher: DTL = 150 × 20% = 30."},
 {q:"An entity accrued $80m for unused holiday pay; the tax authority allows the deduction only on payment. Rate 20%. Treatment:",
  opts:["DTL 16","DTA 16","A permanent difference — no deferred tax","DTA 80"],
  a:1, e:"The tax base of the liability is 80 − 80 = 0. The carrying amount of the liability (80) exceeds the tax base (0) — a deductible temporary difference, since future taxable profit will be reduced by 80. DTA = 16, provided future taxable profits are probable."},
 {q:"A $200m revaluation of a building is recognised in OCI. The rate is 20% and the tax base is unchanged. How is the deferred tax recognised?",
  a:"A DTL of $40m, recognised in other comprehensive income",
  e:"Deferred tax always follows the transaction that created the difference. The revaluation went through OCI, so the related DTL is recognised in OCI. The revaluation surplus therefore holds $160m net rather than $200m, and nothing passes through profit or loss."}
]
},

/* ─────────────── REVENUE AND FINANCIAL INSTRUMENTS ─────────────── */
{
code: "IFRS 15", slug: "ifrs15", topic: "revfin",
title: "Revenue from Contracts with Customers",
titleEn: "Выручка по договорам с покупателями",
tags: ["revenue", "five steps", "performance obligation", "control", "variable consideration", "agent"],
one: "Five steps from contract to revenue: recognise when the customer obtains control, at the amount the entity actually expects to be entitled to.",
why: [
 {p:"Revenue used to be recognised on the 'transfer of risks and rewards' — a vague test applied differently across industries. IFRS 15 replaced it with **control** and a single five-step model for everyone, from selling bread to building a power station."},
 {p:"The second big idea is that a contract must be broken into separate promises. Selling a phone with a two-year airtime plan is two promises, and revenue on them is recognised at different times."}
],
rules: [
 {h:"Step 1. Identify the contract", p:"The parties have approved it, rights and payment terms are identifiable, it has commercial substance, and collection is **probable**. If the customer's ability to pay is doubtful there is no contract under IFRS 15."},
 {h:"Step 2. Identify performance obligations", p:"A good or service is **distinct** if the customer can benefit from it on its own and the promise is separable from the others in the contract. Installing off-the-shelf software is a separate obligation; deep customer-specific integration is not."},
 {h:"Step 3. Determine the transaction price", p:"The consideration expected, taking account of variable consideration (expected value or most likely amount — whichever predicts better), the constraint on variable consideration, a significant financing component, non-cash consideration and consideration payable to the customer."},
 {h:"The constraint", p:"Variable consideration is included only to the extent that it is **highly probable** that no significant reversal of cumulative revenue will occur."},
 {h:"Step 4. Allocate the price", p:"In proportion to **stand-alone selling prices**. Where there is none, estimate it (adjusted market assessment, cost plus margin, residual approach in narrow cases). A discount is normally allocated proportionately across all obligations."},
 {h:"Step 5. Recognise revenue", p:"When control transfers. **Over time** if one of three criteria is met: the customer simultaneously receives and consumes the benefits; the entity creates or enhances an asset the customer controls; the asset has no alternative use and there is an enforceable right to payment for work completed. Otherwise **at a point in time**."},
 {h:"Principal or agent", p:"A principal controls the good before transfer and recognises **gross** revenue. An agent merely arranges the transfer and recognises the **commission**. Indicators of a principal: responsibility for fulfilment, inventory risk, discretion over pricing."},
 {h:"Contract assets and liabilities", p:"A **contract asset** is a right to consideration conditional on something other than the passage of time. A **receivable** is an unconditional right. A **contract liability** is consideration received (or due) before performance."},
 {h:"Contract costs", p:"Incremental costs of obtaining a contract (a sales commission) are capitalised if recovery is expected; a practical expedient allows immediate expensing where the amortisation period is a year or less. Costs to fulfil are capitalised where they relate to the contract, generate resources and are expected to be recovered."},
 {h:"Warranties", p:"An assurance that the product meets its specification → a provision under IAS 37. A warranty that is an **additional service** (extended, separately purchasable) → a separate performance obligation under IFRS 15."}
],
example: [
 {h:"Allocating the price: handset and airtime"},
 {p:"A network sells a bundle: handset plus 24 months of service for $48,000. Sold separately the handset is $30,000 and the service $1,250 a month ($30,000 over 24 months). The stand-alone prices total $60,000, so there is a $12,000 discount."},
 {table:{head:["Obligation","Stand-alone price","Share","Allocated price","Recognised"],rows:[
  ["Handset","30,000","50%","**24,000**","On handover"],
  ["Airtime","30,000","50%","**24,000**","Evenly over 24 months — $1,000 each"],
  ["Total","60,000","","48,000",""]
 ],note:"On handing over the handset: revenue 24,000 and a contract asset of 24,000 (the right to consideration is conditional on providing the service). Each month part of the contract asset converts into a receivable."}},
 {h:"Variable consideration and the constraint"},
 {p:"A contractor has a $500m contract plus a $60m bonus for early completion. Of ten similar projects, the bonus was earned on four."},
 {p:"A 40% likelihood is **not** highly probable, so under the constraint the bonus is **excluded**. The transaction price is $500m. If the project runs ahead of schedule mid-way and the likelihood rises, the transaction price is reassessed."},
 {h:"Principal or agent"},
 {table:{head:["Indicator","Marketplace","Retailer"],rows:[
  ["Controls the goods before transfer","No","Yes"],
  ["Bears inventory risk","No","Yes"],
  ["Sets the price","No — the seller does","Yes"],
  ["Responsible to the customer for the goods","Limited","Full"],
  ["**Revenue on a $10,000 sale at 15% commission**","**1,500 (agent)**","**10,000 (principal)**"]
 ],note:"A 6.7-fold difference in revenue for identical profit. That is why the classification matters so much for valuations based on revenue multiples."}},
 {h:"Recognition over time"},
 {p:"An entity is building on the customer's land. Costs incurred to date are $180m of an expected $600m; the contract price is $750m."},
 {table:{head:["Measure","Calculation","Amount"],rows:[
  ["Progress (cost basis)","180 / 600","30%"],
  ["Revenue for the period","750 × 30%","$225m"],
  ["Cost of sales","","($180m)"],
  ["**Profit**","","**$45m**"]
 ],note:"The asset is built on the customer's land, so the customer controls the asset as it is created — recognition over time. Building on the entity's own land for later sale would be recognised at a point in time."}}
],
pitfalls: [
 "Recognising revenue on dispatch when control has not passed (goods on consignment, for instance).",
 "Including bonuses and penalties in the transaction price where a significant reversal is not highly improbable.",
 "Reporting gross revenue while acting as an agent — the classic revenue inflation at platforms.",
 "Recognising extended warranty revenue up front rather than over the period of cover.",
 "Ignoring a significant financing component where payment is deferred beyond a year: part of the consideration is interest, not revenue.",
 "Confusing a contract asset with a receivable: a receivable is unconditional."
],
quiz: [
 {q:"An entity sold equipment for $900k and undertook to service it for three years. Stand-alone prices: equipment $850k, servicing $150k. How much revenue is recognised on delivery of the equipment?",
  a:"$765k",
  e:"Stand-alone prices total $1,000k, so there is a $100k discount allocated proportionately. Equipment: 900 × 850/1,000 = $765k. Servicing: 900 × 150/1,000 = $135k, recognised at $45k a year. Recognising the full $900k up front is wrong."},
 {q:"Which is NOT a criterion for recognising revenue over time?",
  opts:["The customer simultaneously receives and consumes the benefits","The entity creates an asset the customer controls as it is created","The contract lasts more than 12 months","The asset has no alternative use and there is an enforceable right to payment for work completed"],
  a:2, e:"Duration decides nothing. A three-year contract to build a standard machine that could be sold to anyone is recognised at a point in time. A three-day office clean is recognised over time."},
 {q:"An entity received $100m in advance for software to be delivered in eight months. What appears in the statement of financial position at the reporting date?",
  a:"A contract liability of $100m",
  e:"Cash has been received and the obligation is unperformed — a contract liability (what used to be called deferred income). No revenue is recognised until the customer obtains control of the software. Because the gap is under twelve months there is no significant financing component: IFRS 15 permits the consideration to be left unadjusted where payment and transfer are within a year of each other."}
]
},

{
code: "IFRS 9", slug: "ifrs9", topic: "revfin",
title: "Financial Instruments",
titleEn: "Финансовые инструменты",
tags: ["amortised cost", "FVOCI", "FVTPL", "expected credit losses", "effective interest", "SPPI"],
one: "Classifies financial assets on two tests (business model and cash flow characteristics) and requires losses to be provided for in advance, not after the event.",
why: [
 {p:"The 2008 crisis showed that the old incurred-loss model recognised losses far too late — only once the borrower had already stopped paying. IFRS 9 introduced the **expected credit loss** model: a loss allowance exists from the day the loan is made."},
 {p:"The other half of the reform is classification. The four vague IAS 39 categories were replaced by three clear ones, determined by two tests."}
],
rules: [
 {h:"Test 1. Business model", p:"Hold to collect contractual cash flows; hold to collect and sell; other (trading)."},
 {h:"Test 2. SPPI", p:"Are the cash flows **solely payments of principal and interest**? An ordinary loan, yes. A convertible bond in the holder's hands, no — there is an equity option."},
 {h:"Three categories for debt assets", p:"**Amortised cost**: hold to collect + SPPI. **FVOCI**: hold to collect and sell + SPPI. **FVTPL**: everything else, including anything that fails SPPI."},
 {h:"Equity instruments", p:"Default is **FVTPL**. There is an irrevocable election at initial recognition to present movements in **FVOCI** — but then the gain on sale will **never** reach profit or loss, though dividends still do."},
 {h:"Transaction costs", p:"Included in the initial carrying amount in every category **except FVTPL**, where they are expensed immediately."},
 {h:"Amortised cost and the effective rate", p:"The effective interest rate discounts the future cash flows to the carrying amount at recognition. Interest income = carrying amount × effective rate, not nominal × coupon."},
 {h:"Three stages of expected credit losses", p:"**Stage 1**: no significant increase in credit risk → 12-month ECL, interest on the gross amount. **Stage 2**: significant increase → lifetime ECL, interest still on the gross amount. **Stage 3**: credit-impaired → lifetime ECL, interest on the **net** amount."},
 {h:"Simplified approach", p:"For trade receivables, contract assets and lease receivables the allowance is **always** lifetime ECL, with no stage tracking. In practice, a provision matrix by ageing."},
 {h:"Liabilities", p:"Amortised cost by default. FVTPL for held-for-trading and by designation. Where designated at FVTPL, the change attributable to **own credit risk** is presented in OCI."},
 {h:"Modification and derecognition", p:"A substantial modification (the 10% present value test) derecognises the old liability and recognises a new one, with the difference in profit or loss. A non-substantial modification means recalculating the carrying amount at the original effective rate, with the difference in profit or loss."}
],
example: [
 {h:"Amortised cost: a bond bought at a discount"},
 {p:"A bond is purchased at 924 with a face value of 1,000, a 5% coupon and redemption in three years. The effective rate is 8%."},
 {table:{head:["Year","Opening","Interest income at 8%","Coupon received","Closing"],rows:[
  ["1","924","74","(50)","948"],
  ["2","948","76","(50)","974"],
  ["3","974","76","(50) + (1,000)","0"]
 ],note:"Profit or loss carries 74–76 each year, not 50. The purchase discount is part of the interest income, spread over the life of the instrument."}},
 {h:"Classification by example"},
 {table:{head:["Instrument","Business model","SPPI","Category"],rows:[
  ["A loan made, held to maturity","Hold to collect","Yes","**Amortised cost**"],
  ["A bond portfolio managed for liquidity (held and sold)","Hold to collect and sell","Yes","**FVOCI** — movements in OCI, recycled on sale"],
  ["A bond whose return is linked to the oil price","Any","**No**","**FVTPL**"],
  ["Shares held for speculation","Trading","n/a","**FVTPL**"],
  ["A strategic shareholding designated FVOCI","—","n/a","**FVOCI** — gain on sale goes to retained earnings, never to profit"]
 ]}},
 {h:"A provision matrix for receivables"},
 {table:{head:["Ageing","Balance","ECL rate","Allowance"],rows:[
  ["Not past due","5,000","0.4%","20"],
  ["1–30 days","1,200","2%","24"],
  ["31–90 days","600","10%","60"],
  ["91–180 days","300","30%","90"],
  ["Over 180 days","150","70%","105"],
  ["**Total**","**7,250**","","**299**"]
 ],note:"The rates are built from historical loss experience adjusted for forward-looking conditions (macroeconomic and sector outlook). There is an allowance even against balances that are not past due — that is the essence of the expected loss model."}}
],
pitfalls: [
 "Recognising interest income at the coupon rate rather than the effective rate.",
 "Capitalising transaction costs on FVTPL instruments.",
 "Waiting for an arrears trigger before providing against receivables.",
 "Believing that a gain on selling shares designated FVOCI will one day reach profit or loss. It never will.",
 "Moving an asset from stage 3 back to stage 1 without a genuine improvement in credit quality.",
 "Accruing interest on the gross amount of a credit-impaired (stage 3) asset — the base there is net."
],
quiz: [
 {q:"An entity acquired bonds for $950k (including $10k of transaction costs), intends to hold them to maturity, and the cash flows pass SPPI. Category and initial measurement:",
  a:"Amortised cost, $950k",
  e:"A hold-to-collect business model plus a passed SPPI test gives amortised cost. Transaction costs are included in the initial carrying amount (unlike FVTPL) and are absorbed automatically through the effective interest rate, which will be slightly lower than if the asset had been recognised at 940."},
 {q:"A financial asset is in stage 3 (credit-impaired). How is interest income calculated?",
  opts:["On the gross carrying amount","On the net carrying amount (after the loss allowance)","No interest is recognised","On the original cost"],
  a:1, e:"In stage 3 the effective rate is applied to amortised cost net of the loss allowance. The logic is simple: recognising a full return on an amount the borrower is unlikely to repay would not be a faithful representation."},
 {q:"An entity sold shares previously designated as FVOCI at a $40m gain over cost. What is the effect on profit or loss?",
  a:"None",
  e:"The FVOCI election for equity instruments is irrevocable and means giving up recycling for good. On disposal, the cumulative fair value movements in OCI are transferred directly to retained earnings within equity. The only thing this investment ever contributes to profit or loss is dividend income."}
]
},

{
code: "IAS 32", slug: "ias32", topic: "revfin",
title: "Financial Instruments: Presentation",
titleEn: "Финансовые инструменты: представление",
tags: ["liability or equity", "preference shares", "convertible bonds", "treasury shares", "fixed for fixed"],
one: "Answers one question: is the instrument issued debt or equity? The answer depends not on its name but on whether there is an obligation to pay.",
why: [
 {p:"The classification changes everything: gearing, covenants, valuation. So issuers invent instruments that look like equity but behave like debt."},
 {p:"IAS 32 cuts through that with one test: if the issuer has a **contractual obligation** to deliver cash or another financial asset and cannot avoid it, the instrument is a liability, whatever it is called."}
],
rules: [
 {h:"Financial liability", p:"A contractual obligation to deliver cash or another financial asset, or to exchange on potentially unfavourable terms. Plus certain contracts settled in the entity's own equity instruments."},
 {h:"Equity instrument", p:"A contract evidencing a **residual interest** in the assets after deducting all liabilities. The defining feature is that there is **no obligation to pay**."},
 {h:"The fixed-for-fixed test", p:"Settlement in own shares is equity only if a **fixed number** of shares is delivered for a **fixed amount** of cash. An obligation to deliver $10m worth of shares (with the number set by the share price) is a liability, not equity."},
 {h:"Preference shares", p:"Mandatory redemption on a fixed date or a mandatory dividend → **liability**, and the dividends are a **finance cost**. Redemption at the issuer's option with a discretionary dividend → equity."},
 {h:"Compound instruments", p:"A convertible bond is split: the **liability** component is the present value of the cash flows at the market rate for similar non-convertible debt; the **equity** component is the residual of the proceeds. The equity component is **never remeasured**."},
 {h:"Treasury shares", p:"Deducted from equity. No gain or loss on transactions in own shares is recognised in profit or loss — an entity cannot make money trading in itself."},
 {h:"Issue costs", p:"Costs of issuing equity instruments are deducted from equity (net of tax). Costs of issuing debt reduce the carrying amount of the liability."},
 {h:"Offsetting", p:"A financial asset and liability are offset only where there is a **legally enforceable right** of set-off and an intention to settle net or simultaneously."}
],
example: [
 {h:"Classifying instruments"},
 {table:{head:["Instrument","Classification","Why"],rows:[
  ["Ordinary shares","Equity","No obligation to pay"],
  ["A bond issue","Liability","Obligation to repay principal and interest"],
  ["Preference shares redeemable in five years","**Liability**","Obligation to deliver cash at a fixed date"],
  ["Preference shares, non-cumulative, redeemable at the issuer's option","Equity","No obligation"],
  ["An obligation to deliver $5m worth of shares","**Liability**","The number of shares is not fixed — fixed-for-fixed fails"],
  ["An option over 1,000 shares at $400","Equity","Fixed number for a fixed amount"]
 ]}},
 {h:"Splitting a convertible bond"},
 {p:"$10m of 4% three-year bonds convertible into shares were issued. The market rate for equivalent non-convertible debt is 9%. The coupon is $400k a year."},
 {table:{head:["Component","Calculation","$k"],rows:[
  ["PV of coupons: 400 × 2.5313 (3-year annuity at 9%)","","1,012.5"],
  ["PV of principal: 10,000 × 0.7722","","7,722.0"],
  ["**Liability component**","","**8,734.5**"],
  ["Proceeds received","","10,000.0"],
  ["**Equity component (residual)**","","**1,265.5**"]
 ]}},
 {je:{title:"Entry on issue",lines:[["Dr","Cash","10,000"],["Cr","Bond liability","8,734.5"],["Cr","Equity — conversion option","1,265.5"]],note:"The liability is then carried at amortised cost: the year-one finance cost is 9% of 8,734.5 = $786k, not the $400k coupon. The equity component stays at 1,265.5 for ever."}},
 {h:"Why it matters"},
 {p:"Naive accounting — 'we received $10m, so recognise a $10m loan' — would halve the reported finance cost and overstate gearing. IAS 32 forces the split: part of what the investor paid was for the right to become a shareholder, and that is not debt."}
],
pitfalls: [
 "Classifying an instrument by its name rather than by the substance of the obligation.",
 "Presenting dividends on liability-classified preference shares as a distribution rather than a finance cost.",
 "Remeasuring the equity component of a convertible bond when the share price moves.",
 "Recognising a gain in profit or loss on reselling treasury shares.",
 "Forgetting the fixed-for-fixed test: an obligation to deliver shares worth a fixed amount of cash is debt."
],
quiz: [
 {q:"An entity issued preference shares with a mandatory 8% annual dividend and mandatory redemption in six years. Classification, and where do the dividends go?",
  a:"A financial liability; the dividends are a finance cost in profit or loss",
  e:"Mandatory redemption creates an unconditional obligation to deliver cash, and the mandatory dividend creates an obligation to pay annually. This is debt despite the word 'shares'. The payments are therefore an interest expense reducing profit, not a distribution of it."},
 {q:"An entity bought back its own shares for $50m and sold them a year later for $62m. The $12m gain is recognised:",
  opts:["In profit or loss","In other comprehensive income","Directly in equity","As a reduction of issue costs"],
  a:2, e:"Transactions in an entity's own equity instruments are transactions with owners. Recognising a gain from trading in your own shares in profit or loss is expressly prohibited — otherwise an entity could 'earn' simply by dealing in itself."},
 {q:"What makes settlement in own shares equity rather than a liability?",
  opts:["Settlement occurs within 12 months","A fixed number of shares for a fixed amount of cash","The shares are listed","The holder decides when to settle"],
  a:1, e:"The fixed-for-fixed test. If the number of shares floats with the share price, the entity is in substance obliged to deliver a fixed value — debt dressed up in shares."}
]
},

{
code: "IAS 21", slug: "ias21", topic: "revfin",
title: "The Effects of Changes in Foreign Exchange Rates",
titleEn: "Влияние изменений валютных курсов",
tags: ["functional currency", "monetary items", "exchange differences", "translation", "foreign operation"],
one: "Splits items into monetary and non-monetary: the first are retranslated at the closing rate, the second stay at the historical rate.",
why: [
 {p:"An entity buys a machine in dollars, pays six months later, and reports in roubles. What is the machine worth? And the payable? IAS 21 answers: the machine stays for ever at the rate on the purchase date, while the payable lives at the current rate."},
 {p:"The logic is simple. A monetary item is a **fixed number of currency units** that will actually be received or paid, so its reporting-currency amount moves with the rate. A non-monetary item is a thing, fixed in amount at the moment it was acquired."}
],
rules: [
 {h:"Functional currency", p:"The currency of the **primary economic environment** in which the entity operates. The main indicators are the currency of selling prices and the currency of the main costs. It is determined, not chosen."},
 {h:"Presentation currency", p:"The currency in which the statements are presented. It can be anything and may differ from the functional currency."},
 {h:"Initial recognition", p:"A foreign currency transaction is translated at the **rate on the date of the transaction** (an average rate is acceptable where rates are not volatile)."},
 {h:"At the reporting date — monetary items", p:"Cash, receivables, payables and loans → **closing rate**. Exchange differences go to **profit or loss**."},
 {h:"At the reporting date — non-monetary at historical cost", p:"PPE, inventories, prepayments and intangibles → **historical rate**. Not retranslated; no exchange differences arise."},
 {h:"Non-monetary items at fair value", p:"Translated at the rate on the **date fair value was determined**. The difference follows the remeasurement itself: OCI (IAS 16) or profit or loss (IAS 40)."},
 {h:"Translating a foreign operation", p:"Assets and liabilities → **closing rate**. Income and expenses → transaction-date rates (in practice, average). Equity → historical rates. The resulting difference goes to **OCI** and accumulates in a translation reserve."},
 {h:"Disposal of a foreign operation", p:"The accumulated translation reserve in OCI is **reclassified to profit or loss** when control is lost."},
 {h:"Goodwill on a foreign subsidiary", p:"Treated as an asset of the foreign operation and translated at the closing rate."}
],
example: [
 {h:"Buying equipment in a foreign currency"},
 {p:"On 1 October 2025 equipment was bought for $100,000 on credit until 31 March 2026. Rates: 1 October 90, 31 December 97, 31 March 94 (local currency per $)."},
 {table:{head:["Date","Item","Calculation","Amount"],rows:[
  ["01.10","Property, plant and equipment","100,000 × 90","9,000,000"],
  ["01.10","Trade payable","100,000 × 90","9,000,000"],
  ["31.12","PPE (non-monetary) — not retranslated","—","9,000,000"],
  ["31.12","Payable (monetary) — closing rate","100,000 × 97","9,700,000"],
  ["31.12","**Exchange loss in profit or loss**","","**(700,000)**"],
  ["31.03","Settled","100,000 × 94","9,400,000"],
  ["31.03","**Exchange gain in 2026 profit**","9,700,000 − 9,400,000","**+300,000**"]
 ],note:"Depreciation is always based on 9,000,000 — the historical amount in the functional currency. Exchange rates never touch it again."}},
 {h:"Translating a foreign subsidiary"},
 {p:"A subsidiary's functional currency is the tenge; the group presents in roubles. Rates: 0.19 at the start of the year, 0.21 at the end, 0.20 average."},
 {table:{head:["Item","Tenge m","Rate","Roubles m"],rows:[
  ["Assets at year end","4,000","0.21 (closing)","840.0"],
  ["Liabilities at year end","(1,500)","0.21 (closing)","(315.0)"],
  ["**Net assets**","**2,500**","","**525.0**"],
  ["Revenue","3,200","0.20 (average)","640.0"],
  ["Profit for the year","400","0.20 (average)","80.0"],
  ["Share capital","1,000","0.19 (historical)","190.0"]
 ],note:"The difference between translated net assets and the sum of equity at historical rates plus profit at the average rate is the translation difference. It goes to OCI and never touches profit until the subsidiary is sold."}}
],
pitfalls: [
 "Retranslating PPE and inventories at the closing rate. They are non-monetary and stay at historical rates.",
 "Taking the exchange difference on a payable through OCI — it belongs in profit or loss.",
 "Confusing the translation reserve of a foreign operation (OCI) with ordinary exchange differences (profit or loss).",
 "Treating functional currency as a management choice. It is determined by facts.",
 "Forgetting to translate goodwill on a foreign subsidiary at the closing rate — it is part of that operation's net assets."
],
quiz: [
 {q:"Which item is NOT retranslated at the closing rate?",
  opts:["A euro bank account","A dollar payable to a supplier","Inventories purchased in a foreign currency","A foreign currency loan received"],
  a:2, e:"Inventories are a non-monetary item carried at historical cost. Their amount in the functional currency was fixed at the purchase-date rate. The IAS 2 net realisable value test must still be performed in the functional currency, where rates can matter."},
 {q:"An entity received a $50,000 advance from a customer. The rate was 91 on receipt and 98 at the reporting date. What exchange difference is recognised?",
  a:"None — zero",
  e:"An advance received for goods is a non-monetary liability: the entity will deliver goods, not cash. It stays at 91 (4,550,000) and is not remeasured; that is the amount that will become revenue on delivery. A refundable cash advance would be monetary."},
 {q:"A group sold a foreign subsidiary. The translation reserve in OCI stands at $180m. What happens to it?",
  opts:["It stays in equity for ever","It is transferred to retained earnings","It is reclassified to profit or loss as part of the disposal result","It is written off against goodwill"],
  a:2, e:"The foreign operation translation reserve is a classic reclassifiable item of OCI. On loss of control the accumulated amount is recycled into profit or loss and forms part of the gain or loss on disposal."}
]
},

{
code: "IFRS 10", slug: "ifrs10", topic: "group",
title: "Consolidated Financial Statements",
titleEn: "Консолидированная финансовая отчётность",
tags: ["control", "consolidation", "NCI", "intra-group", "unrealised profit"],
one: "Control — not a 50% shareholding — decides who is consolidated; consolidation adds everything line by line and strikes out intra-group dealings.",
why: [
 {p:"A group is economically one business and legally dozens of entities. Consolidated statements present the group as if it were a single company: the assets it controls and the liabilities it answers for."},
 {p:"The big change in IFRS 10 was a single definition of control based on three elements rather than a formal percentage. An entity with 40% of the votes may have to be consolidated; one with 55% may not."}
],
rules: [
 {h:"Three elements of control", p:"(1) **Power** over the investee — existing rights to direct the relevant activities; (2) **exposure** to variable returns; (3) the **ability to use that power** to affect those returns. All three, simultaneously."},
 {h:"De facto control", p:"Possible below 50%: the largest holding where the rest is dispersed, agreements with other shareholders, currently exercisable potential voting rights."},
 {h:"Mechanics", p:"Add assets and liabilities **100% line by line** (even at 60% ownership), cancel the parent's investment against the subsidiary's equity, and present the non-controlling interest (NCI) separately within equity."},
 {h:"Intra-group items", p:"Intra-group sales, receivables and payables, loans and interest are **eliminated in full**. A group cannot trade with itself."},
 {h:"Unrealised profit", p:"Profit on intra-group sales still sitting in inventory or PPE at the reporting date is eliminated. Where the seller is the **subsidiary** (upstream), the adjustment is shared between the group and the NCI."},
 {h:"Year of acquisition", p:"The subsidiary's results are included **from the date of acquisition**, not from the start of the year. Net assets at acquisition are the basis for goodwill."},
 {h:"Uniform policies and dates", p:"All group entities are brought onto uniform accounting policies; reporting dates may differ by no more than three months, with adjustments for significant events in between."},
 {h:"Loss of control", p:"The subsidiary's assets and liabilities are derecognised, any retained interest is remeasured to fair value, and the result goes to profit or loss. A change in interest **without** loss of control is a transaction with owners: only equity is adjusted, with no gain or loss."}
],
example: [
 {h:"Eliminating unrealised profit"},
 {p:"A parent owns 80% of a subsidiary. The subsidiary sold goods to the parent for $500k at a mark-up of 25% on cost. At the reporting date 60% of those goods are still in the buyer's inventory."},
 {table:{head:["Step","Calculation","Amount"],rows:[
  ["Profit in the whole consignment","500 × 25/125","100"],
  ["Still in inventory","100 × 60%","**60 — eliminate**"],
  ["Adjustment to inventory","","(60)"],
  ["Adjustment to the seller's profit (the subsidiary)","","(60)"],
  ["NCI share (upstream)","60 × 20%","(12)"],
  ["Group share","60 × 80%","(48)"]
 ],note:"Note the phrase 'mark-up on cost': divide by 125, not 100. A margin of 25% on selling price would give a profit of 125."}},

 ]}},

{
code: "IFRS 3", slug: "ifrs3", topic: "group",
title: "Business Combinations",
titleEn: "Объединения бизнеса",
tags: ["goodwill", "NCI", "fair value", "contingent consideration", "acquisition method", "bargain purchase"],
one: "How to compute goodwill: consideration transferred plus non-controlling interest less the fair value of the identifiable net assets acquired.",
why: [
 {p:"An acquirer almost always pays more than the identifiable assets are worth. The difference is goodwill: reputation, the team, the customer base, synergies. It is an asset that cannot be sold separately, so it is not amortised but tested for impairment annually."},
 {p:"IFRS 3 requires the **acquisition method**: every asset and liability acquired is remeasured to fair value at the acquisition date. Everything afterwards — depreciation, impairment, NCI — flows from those remeasured amounts."}
],
rules: [
 {h:"The goodwill formula", p:"**Goodwill = consideration transferred + NCI + fair value of any previously held interest − fair value of identifiable net assets.**"},
 {h:"Two ways to measure NCI", p:"**At fair value** (full goodwill — including the NCI's share) or **at the proportionate share of net assets** (partial goodwill — group share only). The choice is made transaction by transaction."},
 {h:"Consideration", p:"Cash, shares issued at fair value and **contingent consideration** at its acquisition-date fair value. It does **not** include transaction costs."},
 {h:"Transaction costs", p:"Legal, valuation and advisory fees → **expense of the period**. Share issue costs → a deduction from equity. Never part of goodwill."},
 {h:"Contingent consideration", p:"Measured at fair value at the acquisition date. Subsequent changes: if it is a **liability**, remeasured through profit or loss; if **equity**, not remeasured. Goodwill may be adjusted only within the measurement period and only for new information about conditions **at the acquisition date**."},
 {h:"What is included in net assets", p:"All identifiable assets and liabilities at fair value, including intangibles the acquiree never recognised (brands, customer relationships) and **contingent liabilities** where fair value can be measured reliably."},
 {h:"What is excluded", p:"Future restructuring costs of the acquiree (no obligation exists at the acquisition date) and the acquiree's own internally generated goodwill as a separate item."},
 {h:"Bargain purchase", p:"Where net assets exceed the consideration, all measurements are reviewed first and the difference is then recognised **as income in profit or loss** immediately. Negative goodwill never appears in the balance sheet."},
 {h:"Measurement period", p:"For up to twelve months after acquisition, provisional amounts may be adjusted for new information about circumstances existing at the acquisition date."}
],
example: [
 {h:"Goodwill under both methods"},
 {p:"Nord acquired 80% of Vega for $900m in cash plus contingent consideration with a fair value of $60m. Legal fees were $15m. The fair value of Vega's identifiable net assets is $1,000m. The fair value of the 20% NCI is $230m."},
 {table:{head:["Component","Full goodwill","Proportionate share"],rows:[
  ["Cash consideration","900","900"],
  ["Contingent consideration","60","60"],
  ["NCI","230 (fair value)","200 (1,000 × 20%)"],
  ["Less net assets","(1,000)","(1,000)"],
  ["**Goodwill**","**190**","**160**"]
 ],note:"The $30m difference is the NCI's share of goodwill. The $15m of legal fees appears nowhere in this calculation — it is expensed."}},
 {h:"Identifying assets the seller never had"},
 {table:{head:["Item","Vega's carrying amount","Fair value","Comment"],rows:[
  ["Property, plant and equipment","620","750","Uplift of 130"],
  ["Trade mark","0","120","Internally generated — never recognised, now it is"],
  ["Contractual customer relationships","0","80","Identifiable under IFRS 3"],
  ["Contingent liability on a claim","0","(40)","Recognised even if outflow is not probable, provided fair value is reliable"],
  ["Other net assets","90","90",""],
  ["**Total**","**710**","**1,000**",""]
 ],note:"$290m of uplift reduces goodwill by the same amount — but unlike goodwill these assets will be depreciated and amortised, lowering group profit in future."}},
 {h:"The effect on later periods"},
 {p:"The trade mark (10-year life) and customer relationships (8-year life) add amortisation to the consolidated profit or loss of 120/10 + 80/8 = **$22m a year**. None of this appears in Vega's own accounts — it exists only at group level. The same applies to the $130m PPE uplift over its remaining life."},
 {h:"Contingent consideration a year later"},
 {p:"The contingent consideration (a liability) is remeasured to a fair value of $95m. The $35m difference is an **expense in profit or loss**; goodwill is untouched. Goodwill is frozen at the acquisition date."}
],
pitfalls: [
 "Including transaction costs in the cost of the acquisition — they belong in expenses.",
 "Failing to identify intangibles the acquiree never recognised: goodwill is overstated and so is future profit.",
 "Providing for the restructuring of the acquired business as part of the liabilities assumed.",
 "Adjusting goodwill for later changes in the fair value of contingent consideration.",
 "Showing negative goodwill in the balance sheet instead of recognising income.",
 "Forgetting the extra depreciation on fair value uplifts when consolidating later years."
],
quiz: [
 {q:"Consideration 500, NCI (25%) at a fair value of 160, fair value of net assets 600. Goodwill under the full goodwill method:",
  a:"$60m",
  e:"500 + 160 − 600 = 60. For comparison, under the proportionate method the NCI would be 600 × 25% = 150 and goodwill 50. The 10 difference is the NCI's share of goodwill."},
 {q:"Which cost forms part of the consideration for the goodwill calculation?",
  opts:["Investment bank fees for advising on the deal","The fair value of shares issued as consideration","Costs of registering the share issue","Due diligence costs"],
  a:1, e:"Shares issued as consideration are included at their acquisition-date fair value. Everything else listed is either an expense of the period (adviser and due diligence fees) or a deduction from equity (registration of the issue)."},
 {q:"Fair value of net assets 820, consideration for 70% is 500, NCI (30%) measured at the proportionate share. What is recognised?",
  a:"A bargain purchase gain of $74m in profit or loss",
  e:"NCI = 820 × 30% = 246. Applying the formula: 500 + 246 − 820 = (74). A negative figure means a bargain purchase. Reassess first whether everything has been identified and measured correctly, then recognise the $74m as income in the period of acquisition. Negative goodwill is never carried in the balance sheet."}
]
},

{
code: "Consolidated SOFP", short: "Cons SOFP", slug: "cons-sofp", topic: "group",
title: "Consolidated Statement of Financial Position",
titleEn: "Консолидированный отчёт о финансовом положении",
tags: ["consolidation workings", "net assets", "goodwill", "NCI", "group reserves", "cash in transit"],
one: "Four standard workings turn two sets of accounts into one: net assets, goodwill, non-controlling interest and group retained earnings.",
why: [
 {p:"Everything in IFRS 3 and IFRS 10 comes down to a mechanical routine. Do it in the same order every time and the statement balances; improvise and it will not."},
 {p:"The discipline that saves you is the **net assets working**: two columns, at acquisition and at the reporting date. Goodwill comes out of the first column, NCI and group reserves out of both."}
],
rules: [
 {h:"W1 — Group structure", p:"Who owns what percentage, from what date, and what the NCI percentage is. Half of all errors are settled here."},
 {h:"W2 — Net assets of the subsidiary", p:"Two columns: **at acquisition** and **at the reporting date**. Rows: share capital, retained earnings, fair value adjustments, extra depreciation on those adjustments, unrealised profit on upstream sales. The difference between the columns is the post-acquisition movement."},
 {h:"W3 — Goodwill", p:"Consideration + NCI at acquisition − net assets at acquisition (the first column of W2). Then deduct any cumulative impairment."},
 {h:"W4 — Non-controlling interest", p:"NCI at acquisition (fair value or proportionate share) + NCI% × the post-acquisition movement in W2 − the NCI's share of goodwill impairment (full goodwill method only)."},
 {h:"W5 — Group retained earnings", p:"100% of the parent's retained earnings + parent% × the post-acquisition movement in W2 − goodwill impairment (the group's share) − unrealised profit on downstream sales."},
 {h:"Adding up", p:"Assets and liabilities are added **100% + 100%**, after cancelling intra-group balances. Share capital and share premium are the **parent's only**."},
 {h:"Intra-group balances", p:"Receivable and payable are cancelled. If they disagree, the difference is **cash in transit** (add to the parent's cash) or **goods in transit** (add to inventory at cost) — adjust first, then cancel."},
 {h:"Fair value adjustments", p:"Carried in W2 in both columns: at acquisition at the full uplift, at the reporting date net of the extra depreciation charged since."}
],
example: [
 {h:"The workings, end to end"},
 {p:"P acquired 80% of S on 1 January 2024 for $900m when S's retained earnings were $260m and share capital $200m. S's land was undervalued by $100m (no depreciation). NCI is measured at the proportionate share. At 31 December 2025 S's retained earnings are $460m. Goodwill is impaired by $50m in total. P's retained earnings are $1,900m. S sold goods to P at a profit of $30m, all still in P's inventory."},
 {table:{head:["W2 — Net assets of S","At acquisition","At reporting date"],rows:[
  ["Share capital","200","200"],
  ["Retained earnings","260","460"],
  ["Fair value adjustment — land","100","100"],
  ["Unrealised profit (upstream)","—","(30)"],
  ["**Net assets**","**560**","**730**"],
  ["Post-acquisition movement","","**170**"]
 ]}},
 {table:{head:["W3 — Goodwill","$m"],rows:[
  ["Consideration transferred","900"],
  ["NCI at acquisition: 560 × 20%","112"],
  ["Less net assets at acquisition","(560)"],
  ["Goodwill at acquisition","452"],
  ["Cumulative impairment","(50)"],
  ["**Goodwill in the statement**","**402**"]
 ]}},
 {table:{head:["W4 — Non-controlling interest","$m"],rows:[
  ["NCI at acquisition","112"],
  ["NCI share of post-acquisition movement: 170 × 20%","34"],
  ["Goodwill impairment attributable to NCI (proportionate method: none)","—"],
  ["**NCI in equity**","**146**"]
 ],note:"Under the full goodwill method the NCI would start at its fair value and would also absorb its share of the impairment."}},
 {table:{head:["W5 — Group retained earnings","$m"],rows:[
  ["P's own retained earnings","1,900"],
  ["P's share of the post-acquisition movement: 170 × 80%","136"],
  ["Goodwill impairment (group share)","(50)"],
  ["**Group retained earnings**","**1,986**"]
 ],note:"The unrealised profit was already deducted inside W2 because the subsidiary was the seller, so it is not deducted again here. Had the parent been the seller, the $30m would be deducted in W5 instead."}},
 {h:"Goods and cash in transit"},
 {p:"P's records show $70m payable to S; S shows $85m receivable from P. The $15m difference is goods dispatched by S that P has not yet recorded."},
 {table:{head:["Step","Entry"],rows:[
  ["Record the goods at P","Dr Inventory 15 / Cr Payable to S 15"],
  ["Now both balances are 85","Cancel: Dr Payable 85 / Cr Receivable 85"],
  ["If the goods carry unrealised profit","Eliminate it in W2 as an upstream sale"]
 ],note:"Never cancel mismatched balances directly — the statement will not balance. Adjust the item in transit first."}}
],
pitfalls: [
 "Adding the subsidiary's share capital into group equity. Only the parent's share capital and premium appear.",
 "Consolidating assets in proportion to the holding rather than 100%.",
 "Deducting unrealised profit twice — once in W2 for an upstream sale and again in W5.",
 "Using the reporting-date net assets in the goodwill calculation instead of those at acquisition.",
 "Cancelling intra-group balances that disagree, without first recording goods or cash in transit.",
 "Forgetting the extra depreciation on fair value uplifts in the reporting-date column of W2."
],
quiz: [
 {q:"P owns 75% of S. S's net assets were 400 at acquisition and 640 at the reporting date. NCI was measured at the proportionate share. What is the NCI figure in the consolidated statement of financial position?",
  a:"160",
  e:"NCI at acquisition = 400 × 25% = 100. Post-acquisition movement = 640 − 400 = 240, of which the NCI takes 25% = 60. Total NCI = 100 + 60 = 160 — which is simply 640 × 25%, the shortcut that works whenever NCI is measured proportionately and there is no goodwill impairment."},
 {q:"Which item is NOT included in group retained earnings?",
  opts:["100% of the parent's retained earnings","The parent's share of the subsidiary's post-acquisition profits","100% of the subsidiary's retained earnings","Goodwill impairment attributable to the group"],
  a:2, e:"Only the post-acquisition portion, and only the parent's share, is added. The subsidiary's pre-acquisition retained earnings were paid for in the consideration and are cancelled inside the goodwill calculation."},
 {q:"P's books show a $70m payable to S while S shows an $85m receivable from P, the difference being goods in transit. What is the consolidation adjustment?",
  a:"Increase inventory by 15 and the payable by 15, then cancel 85 against 85",
  e:"The goods have left S (so S has correctly derecognised them and raised a receivable) but have not reached P's records. Recognise them at P — Dr Inventory 15 / Cr Payable 15 — so both sides read 85 and can be cancelled. Any unrealised profit inside those goods is then eliminated as an upstream sale."}
]
},

{
code: "Consolidated P&L", short: "Cons P&L", slug: "cons-pl", topic: "group",
title: "Consolidated Statement of Profit or Loss",
titleEn: "Консолидированный отчёт о прибыли или убытке",
tags: ["consolidation", "intra-group trading", "mid-year acquisition", "NCI share", "attribution"],
one: "Add every line in full, strike out intra-group trading, then split the bottom line between the owners of the parent and the non-controlling interest.",
why: [
 {p:"The statement of financial position shows a position at a date; profit or loss shows a period. So the key question shifts from 'how much of the subsidiary do we own' to '**for how long** did we own it'."},
 {p:"The other discipline is that eliminating intra-group trading does not change group profit by a cent — it only shrinks revenue and cost of sales by the same amount. What does change profit is the unrealised profit in closing inventory."}
],
rules: [
 {h:"Add in full", p:"Every line from revenue to tax is added 100% + 100%, regardless of the ownership percentage — time-apportioned in the year of acquisition."},
 {h:"Mid-year acquisition", p:"Include the subsidiary's results only **from the date of acquisition**: multiply by months owned / 12 if income accrues evenly, or use actual results for the period."},
 {h:"Intra-group trading", p:"Deduct the same amount from both revenue and cost of sales. Group profit is unchanged; revenue falls, which matters for margin analysis."},
 {h:"Unrealised profit in closing inventory", p:"Added to cost of sales, which does reduce group profit. Charged to the seller's column: the parent's for a downstream sale, the subsidiary's (and hence partly the NCI) for an upstream sale."},
 {h:"Fair value adjustments", p:"Extra depreciation and amortisation on acquisition-date uplifts is charged in the group statement — usually to cost of sales or administrative expenses — and reduces the subsidiary's profit for the NCI split."},
 {h:"Intra-group interest, dividends and management charges", p:"Eliminated in full. Dividends received from the subsidiary never appear in group profit — the subsidiary's own profit is already consolidated."},
 {h:"Goodwill impairment", p:"Charged as an expense (usually administrative or a separate line). Under the full goodwill method the NCI bears its share; under the proportionate method it does not."},
 {h:"Attribution", p:"Below profit for the year: **owners of the parent** and **non-controlling interest**. The NCI share = NCI% × the subsidiary's profit after all consolidation adjustments affecting it."}
],
example: [
 {h:"Building the statement"},
 {p:"P acquired 60% of S on 1 July 2025; the reporting period is the calendar year. S's profit accrues evenly. During the second half of the year S sold goods to P for $400m at a margin of 25% on selling price, and 40% of them remain in P's inventory. Fair value uplift on S's plant: $120m, remaining life 10 years."},
 {table:{head:["","P","S (6 months)","Adjustments","Group"],rows:[
  ["Revenue","6,000","1,400","(400)","7,000"],
  ["Cost of sales","(4,100)","(950)","+400 − 40 − 6","(4,696)"],
  ["**Gross profit**","**1,900**","**450**","","**2,304**"],
  ["Operating expenses","(700)","(180)","—","(880)"],
  ["**Profit before tax**","**1,200**","**270**","","**1,424**"],
  ["Tax","(240)","(54)","—","(294)"],
  ["**Profit for the year**","**960**","**216**","","**1,130**"]
 ],note:"The 400 is removed from both revenue and cost of sales. The 40 is unrealised profit (400 × 25% × 40%). The 6 is extra depreciation: 120/10 × 6/12."}},
 {h:"Splitting the bottom line"},
 {table:{head:["Attribution","Calculation","$m"],rows:[
  ["S's profit for the six months","","216"],
  ["Less unrealised profit (S was the seller — upstream)","","(40)"],
  ["Less extra depreciation on the fair value uplift","","(6)"],
  ["**S's adjusted profit**","","**170**"],
  ["**Non-controlling interest**","170 × 40%","**68**"],
  ["**Owners of the parent**","1,130 − 68","**1,062**"]
 ],note:"Both adjustments reduce the subsidiary's profit, so the NCI shares in them. Had the parent been the seller, the 40 would have been charged wholly against the owners of the parent."}},
 {h:"Why eliminating trading does not change profit"},
 {p:"S sold at 400 and recorded 400 of revenue; P recorded 400 of purchases. If P has sold all the goods on, the group has simply bought from itself and sold to the outside world once. Removing 400 from revenue and 400 from cost of sales leaves profit untouched — but group revenue is 400 lower, and a revenue-based margin would otherwise be overstated."},
 {h:"Dividends inside the group"},
 {p:"S paid a $100m dividend, of which P received $60m and recorded it as income. In the consolidated statement that $60m is removed: S's entire profit is already included line by line, so counting the dividend as well would double count. The $40m paid to the other shareholders reduces the NCI in the statement of financial position."}
],
pitfalls: [
 "Consolidating a full year of a subsidiary acquired mid-year.",
 "Leaving dividends received from the subsidiary in group income.",
 "Charging unrealised profit on an upstream sale entirely to the owners of the parent.",
 "Forgetting the extra depreciation on fair value uplifts, which both reduces group profit and lowers the NCI share.",
 "Netting intra-group sales against revenue only, forgetting the matching entry in cost of sales.",
 "Calculating the NCI share from the subsidiary's own reported profit instead of its profit after consolidation adjustments."
],
quiz: [
 {q:"P owns 70% of S. S's profit for the year is $300m. Unrealised profit on sales from S to P is $20m and extra depreciation on fair value uplifts is $10m. What is the non-controlling interest in profit?",
  a:"$81m",
  e:"Adjusted subsidiary profit = 300 − 20 − 10 = $270m. NCI = 270 × 30% = $81m. Both adjustments relate to the subsidiary — the unrealised profit because S was the seller, the depreciation because it arises on S's assets — so both reduce the NCI's share."},
 {q:"S sold goods to P for $500m; P sold all of them on to third parties before the year end. The effect of eliminating this trading on group profit is:",
  opts:["A $500m reduction","A reduction equal to S's margin","Nil","An increase in the NCI share"],
  a:2, e:"Revenue falls by 500 and cost of sales falls by 500, so profit is unchanged. There is no unrealised profit because none of the goods remain in the group. The only visible effect is lower group revenue — which is exactly the point, since the group has sold to outsiders once, not twice."},
 {q:"A subsidiary was acquired on 1 October and the group reports to 31 December. How is the subsidiary's revenue for the calendar year of $2,400m reflected in group revenue?",
  a:"$600m — three months from the date of acquisition",
  e:"Only post-acquisition results are consolidated. Assuming revenue accrues evenly, 2,400 × 3/12 = $600m. The pre-acquisition nine months belong to the previous owners and are reflected instead in the net assets acquired, which feed into the goodwill calculation."}
]

{
code: "Group disposals", short: "Disposals", slug: "disposals", topic: "group",
title: "Group Disposals",
