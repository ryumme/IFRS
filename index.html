, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --surface-2:#EDF0E8; --surface-3:#E4E9DD;
  --ink:#141814; --ink-2:#5B6357; --ink-3:#848C7E;
  --line:#DEE3D7; --line-strong:#C7CFBC;
  --accent:#0E6B4A; --accent-ink:#0B5239; --accent-soft:#E1EFE6;
  --warn:#A8431C; --warn-soft:#F8EAE2;
  --ok:#0E6B4A; --ok-soft:#E1EFE6;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,24,20,.05), 0 8px 24px -16px rgba(20,24,20,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E110F; --surface:#161A17; --surface-2:#1D231E; --surface-3:#242B25;
    --ink:#E9EDE5; --ink-2:#9BA593; --ink-3:#77816F;
    --line:#293026; --line-strong:#3A4436;
    --accent:#52BE8D; --accent-ink:#7FD3AA; --accent-soft:#12251C;
    --warn:#E28459; --warn-soft:#2A1C15;
    --ok:#52BE8D; --ok-soft:#12251C;
    --on-accent:#0B140F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E110F; --surface:#161A17; --surface-2:#1D231E; --surface-3:#242B25;
  --ink:#E9EDE5; --ink-2:#9BA593; --ink-3:#77816F;
  --line:#293026; --line-strong:#3A4436;
  --accent:#52BE8D; --accent-ink:#7FD3AA; --accent-soft:#12251C;
  --warn:#E28459; --warn-soft:#2A1C15;
  --ok:#52BE8D; --ok-soft:#12251C;
  --on-accent:#0B140F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Golos Text","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Literata,Georgia,"Times New Roman",serif; text-wrap:balance; margin:0}
a{color:var(--accent-ink)}
button{font:inherit; color:inherit; cursor:pointer}
table{border-collapse:collapse}

/* ── шапка ── */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1220px; margin:0 auto; padding:10px 16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand b{font-family:Literata,serif; font-size:19px; font-weight:700; letter-spacing:-.01em; white-space:nowrap}
.brand span{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:2px}
.seg button{
  border:0; background:transparent; padding:5px 13px; border-radius:7px;
  font-size:13.5px; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow); font-weight:600}
.seg.lang button{padding:5px 10px; font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.04em}
.icon-btn{
  border:1px solid var(--line); background:var(--surface); border-radius:9px;
  width:34px; height:34px; display:grid; place-items:center; font-size:15px;
}
.icon-btn:hover{border-color:var(--line-strong)}
.meter{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
.meter-bar{width:74px; height:5px; border-radius:99px; background:var(--surface-3); overflow:hidden}
.meter-bar i{display:block; height:100%; background:var(--accent); width:0%}
.meter b{font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600}

/* ── каркас ── */
.shell{max-width:1220px; margin:0 auto; padding:0 16px; display:grid; grid-template-columns:292px minmax(0,1fr); gap:34px; align-items:start}
.rail{position:sticky; top:calc(env(safe-area-inset-top,0px) + 62px); padding-block:18px 28px; max-height:calc(100vh - 80px); overflow-y:auto; overscroll-behavior:contain}

.searchwrap{position:relative; margin-bottom:6px}
.searchwrap input{
  width:100%; font:inherit; font-size:14.5px; padding:9px 34px 9px 12px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:10px;
}
.searchwrap input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.searchwrap kbd{
  position:absolute; right:9px; top:50%; transform:translateY(-50%);
  font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3);
  border:1px solid var(--line); border-radius:5px; padding:1px 5px; pointer-events:none;
}
.hint{font-size:12px; color:var(--ink-3); padding:2px 2px 10px}

.grp{margin-top:16px}
.grp h4{
  font-family:"Golos Text",sans-serif; font-size:10.5px; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  padding:0 2px 7px; border-bottom:1px solid var(--line); margin-bottom:5px;
}
.item{
  display:grid; grid-template-columns:auto 1fr; gap:3px 9px; align-items:baseline;
  width:100%; text-align:left; border:0; background:transparent;
  padding:7px 9px; border-radius:9px; line-height:1.3;
}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item[aria-current="true"] .item-code{color:var(--accent-ink)}
.item-code{
  font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:500;
  color:var(--ink-2); white-space:nowrap;
}
.item-title{font-size:13.5px; color:var(--ink); grid-column:2}
.item-dot{grid-column:1; justify-self:center; width:6px; height:6px; border-radius:99px; background:var(--accent); opacity:0}
.item.done .item-dot{opacity:1}
.item.done .item-title{color:var(--ink-2)}
.empty{font-size:13px; color:var(--ink-3); padding:14px 4px}

/* ── статья ── */
main{padding-block:26px 90px; min-width:0}
.crumb{display:flex; gap:8px; align-items:center; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:12px}
.back{display:none}

.head{border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:26px}
.code-chip{
  display:inline-block; font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:500;
  background:var(--accent); color:var(--on-accent); padding:3px 9px; border-radius:6px; margin-bottom:11px;
}
.head h1{font-size:clamp(25px,4.4vw,36px); line-height:1.16; font-weight:700; letter-spacing:-.015em}
.head .en{font-size:14px; color:var(--ink-3); margin-top:5px; font-style:italic}
.one{
  margin-top:18px; padding:14px 16px; border-left:3px solid var(--accent);
  background:var(--accent-soft); border-radius:0 10px 10px 0;
  font-family:Literata,serif; font-size:16.5px; line-height:1.5;
}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.tag{font-size:11.5px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); padding:2px 8px; border-radius:99px}

section{margin-bottom:38px; scroll-margin-top:80px}
section > h2{
  font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  font-family:"Golos Text",sans-serif; color:var(--accent-ink); margin-bottom:14px;
}
.prose{max-width:68ch}
.prose p{margin:0 0 13px}
.prose h3{font-size:18px; font-weight:600; margin:24px 0 10px}
.prose ul{margin:0 0 14px; padding-left:20px}
.prose li{margin-bottom:6px}
strong{font-weight:600; color:var(--ink)}

.rules{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.rule{background:var(--surface); padding:14px 16px; display:grid; grid-template-columns:172px minmax(0,1fr); gap:4px 20px}
.rule dt{font-weight:600; font-size:14.5px; overflow-wrap:anywhere; hyphens:auto}
.rule dd{margin:0; color:var(--ink-2); font-size:14.5px}

.tablewrap{overflow-x:auto; margin:0 0 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table{width:100%; font-size:13.5px}
th,td{padding:9px 13px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
thead th{
  font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; background:var(--surface-2); white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
td:not(:first-child){font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; font-size:12.5px}
td.t{font-family:"Golos Text",sans-serif; font-size:13.5px}
.tnote{font-size:12.5px; color:var(--ink-2); padding:10px 13px; background:var(--surface-2); border-top:1px solid var(--line)}

.je{border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:16px; overflow:hidden}

 {q:"In 2025 it emerges that $60m of research expenditure was capitalised in 2023 although IAS 38 required it to be expensed. The 2025 statements present 2024 as the comparative. What is required?",
