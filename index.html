  ORDER.forEach(function(s, i){ rank[s] = i; });

  /* ── строки интерфейса ── */
  var UI = {
    ru: {
      brand:"Гроссбух МСФО", sub:"37 тем", studied:"Изучено",
      reference:"Справочник", trainer:"Тренажёр",
      searchPlaceholder:"Поиск: аренда, гудвил, IFRS 15…",
      hintIdle:"Ищет по названиям, терминам и тексту разборов",
      hintFound:"Найдено: ", hintNone:"Ничего не найдено — попробуйте другое слово",
      emptyHint:"Например: обесценение, EPS, справедливая стоимость, аренда.",
      back:"← Все темы",
      secWhy:"Зачем эта тема", secRules:"Ключевые правила",
      secExample:"Как это выглядит на практике", secPitfalls:"Частые ошибки", secQuiz:"Задачи",
      task:"ЗАДАЧА", of:"/", reveal:"Показать решение",
      answer:"Ответ", explain:"Разбор", entry:"Проводка",
      markOn:"Тема изучена", markOff:"Отметить как изученную",
      prev:"← Предыдущая", next:"Следующая →",
      trHead:"Тренажёр",
      trSub:"Случайные вопросы из всех тем. После ответа откроется разбор.",
      trQ:"Вопрос", trCorrect:"верно", trNext:"Следующий вопрос",
      trResult:"Показать результат", trOpen:"Открыть тему", trAgain:"Ещё 10 вопросов",
      v80:"Отличный результат — этот блок держится.",
      v50:"Неплохо. Просмотрите разборы по темам, где ошиблись.",
      v0:"Пока шатко — вернитесь к справочнику и попробуйте снова."
    },
    en: {
      brand:"IFRS Ledger", sub:"37 topics", studied:"Studied",
      reference:"Reference", trainer:"Practice",
      searchPlaceholder:"Search: lease, goodwill, IFRS 15…",
      hintIdle:"Searches titles, terms and the full text",
      hintFound:"Found: ", hintNone:"Nothing found — try another word",
      emptyHint:"Try: impairment, EPS, fair value, lease.",
      back:"← All topics",
      secWhy:"Why this topic exists", secRules:"Key rules",
      secExample:"How it works in practice", secPitfalls:"Common mistakes", secQuiz:"Practice",
      task:"QUESTION", of:"/", reveal:"Show solution",
      answer:"Answer", explain:"Explanation", entry:"Journal entry",
      markOn:"Topic studied", markOff:"Mark as studied",
      prev:"← Previous", next:"Next →",
      trHead:"Practice",
      trSub:"Random questions from every topic. The explanation opens once you answer.",
      trQ:"Question", trCorrect:"correct", trNext:"Next question",
      trResult:"Show result", trOpen:"Open the topic", trAgain:"Another 10 questions",
      v80:"Strong result — this block is solid.",
      v50:"Not bad. Review the topics you missed.",
      v0:"Shaky so far — go back to the reference and try again."
    }
  };

  var lang = "ru";
  try { var sl = localStorage.getItem("ifrs-lang"); if(sl === "en" || sl === "ru") lang = sl; } catch(e){}
  function t(){ return UI[lang]; }

  /* ── данные ── */
  function byRank(a, b){ return (rank[a.slug] === undefined ? 999 : rank[a.slug]) - (rank[b.slug] === undefined ? 999 : rank[b.slug]); }
  var SETS = {
    ru: { data: (window.DATA_RU || []).slice().sort(byRank), topics: window.TOPICS_RU || [] },
    en: { data: (window.DATA_EN || []).slice().sort(byRank), topics: window.TOPICS_EN || [] }
  };
  function D(){ return SETS[lang].data; }
  function T(){ return SETS[lang].topics; }

  function blocksText(arr){
    var out = [];
    (arr||[]).forEach(function(b){
      if(b.p) out.push(b.p); if(b.h) out.push(b.h);
      if(b.note) out.push(b.note);
      if(b.list) out.push(b.list.join(" "));
      if(b.table){ out.push(b.table.head.join(" ")); b.table.rows.forEach(function(r){ out.push(r.join(" ")); }); if(b.table.note) out.push(b.table.note); }
      if(b.je){ out.push(b.je.title||""); b.je.lines.forEach(function(l){ out.push(l.join(" ")); }); if(b.je.note) out.push(b.je.note); }
    });
    return out.join(" ");
  }
  ["ru","en"].forEach(function(k){
    SETS[k].data.forEach(function(s, i){
      s.i = i;
      s.hay = [s.code, s.title, s.titleEn, s.one, (s.tags||[]).join(" "),
               blocksText(s.why), (s.rules||[]).map(function(r){ return r.h + " " + r.p; }).join(" "),
               blocksText(s.example), (s.pitfalls||[]).join(" "),
               (s.quiz||[]).map(function(q){ return q.q + " " + (q.e||""); }).join(" ")].join(" ").toLowerCase();
    });
  });

  /* ── прогресс и тема оформления ── */
  var store = { done:{}, solved:{} };
  try { var raw = localStorage.getItem("ifrs-progress"); if(raw) store = JSON.parse(raw) || store; } catch(e){}
  if(!store.done) store.done = {}; if(!store.solved) store.solved = {};
  function save(){ try { localStorage.setItem("ifrs-progress", JSON.stringify(store)); } catch(e){} }

  try { var th = localStorage.getItem("ifrs-theme"); if(th) document.documentElement.setAttribute("data-theme", th); } catch(e){}
  $("#themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("ifrs-theme", next); } catch(e){}
  });

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }

  function updMeter(){
    var n = 0; D().forEach(function(s){ if(store.done[s.slug]) n++; });
    $("#meterFill").style.width = Math.round(n / D().length * 100) + "%";
    $("#meterTxt").textContent = n + "/" + D().length;
  }

  /* ── боковой список ── */
  var query = "", active = null;
  function renderNav(){
    var q = query.trim().toLowerCase();
    var list = q ? D().filter(function(s){ return s.hay.indexOf(q) > -1; }) : D();
    $("#searchHint").textContent = q
      ? (list.length ? t().hintFound + list.length : t().hintNone)
      : t().hintIdle;
    if(!list.length){ nav.innerHTML = '<div class="empty">' + esc(t().emptyHint) + "</div>"; return; }
    var html = "";
    T().forEach(function(tp){
      var part = list.filter(function(s){ return s.topic === tp.id; });
      if(!part.length) return;
      html += '<div class="grp"><h4>' + esc(tp.name) + "</h4>";
      part.forEach(function(s){
        html += '<button class="item' + (store.done[s.slug] ? " done" : "") + '" data-slug="' + s.slug + '"' +
                (s.slug === active ? ' aria-current="true"' : "") + '>' +
                '<span class="item-dot"></span>' +
                '<span class="item-code">' + esc(s.short || s.code) + "</span>" +
                '<span class="item-title">' + esc(s.title) + "</span></button>";
      });
      html += "</div>";
    });
    nav.innerHTML = html;
  }

  nav.addEventListener("click", function(e){
    var b = e.target.closest(".item"); if(!b) return;
    location.hash = "#/" + b.dataset.slug;
  });

  var search = $("#search");
  search.addEventListener("input", function(){ query = search.value; renderNav(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "/" && document.activeElement !== search){ e.preventDefault(); search.focus(); search.select(); }
    if(e.key === "Escape" && document.activeElement === search){ search.value = ""; query = ""; renderNav(); search.blur(); }
  });

  /* ── рендер блоков ── */
  function renderBlocks(arr){
    var h = "";
    (arr||[]).forEach(function(b){
      if(b.h) h += "<h3>" + md(b.h) + "</h3>";
      if(b.p) h += "<p>" + md(b.p) + "</p>";
      if(b.list) h += "<ul>" + b.list.map(function(x){ return "<li>" + md(x) + "</li>"; }).join("") + "</ul>";
      if(b.note) h += '<p class="note">' + md(b.note) + "</p>";
      if(b.table){
        h += '<div class="tablewrap"><table><thead><tr>' +
             b.table.head.map(function(c){ return "<th>" + md(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        b.table.rows.forEach(function(r){
          h += "<tr>" + r.map(function(c, i){
            var numeric = i > 0 && /\d/.test(c) && c.length < 30;
            return "<td" + (numeric ? "" : ' class="t"') + ">" + md(c) + "</td>";
          }).join("") + "</tr>";
        });
        h += "</tbody></table>" + (b.table.note ? '<div class="tnote">' + md(b.table.note) + "</div>" : "") + "</div>";
      }
      if(b.je){
        h += '<div class="je"><div class="je-h">' + md(b.je.title || t().entry) + "</div>";
        b.je.lines.forEach(function(l){
          h += '<div class="je-l"><i>' + esc(l[0]) + "</i><span>" + esc(l[1]) + "</span><b>" + esc(l[2]) + "</b></div>";
        });
        h += (b.je.note ? '<div class="tnote">' + md(b.je.note) + "</div>" : "") + "</div>";
      }
    });
    return h;
  }

  function renderQuiz(s){
    return (s.quiz||[]).map(function(q, i){
      var id = s.slug + "-" + i, body;
      if(q.opts){
        body = '<div class="opts">' + q.opts.map(function(o, j){
          return '<button class="opt" data-q="' + id + '" data-i="' + j + '" data-a="' + q.a + '">' +
                 '<span class="lt">' + "ABCD".charAt(j) + "</span><span>" + md(o) + "</span></button>";
        }).join("") + "</div>";
      } else {
        body = '<button class="reveal" data-q="' + id + '">' + esc(t().reveal) + "</button>";
      }
      return '<div class="q" id="q-' + id + '">' +
             '<div class="q-n">' + esc(t().task) + " " + (i+1) + " " + t().of + " " + s.quiz.length + "</div>" +
             '<div class="q-t">' + md(q.q) + "</div>" + body +
             '<div class="ans" id="a-' + id + '" hidden>' +
               (q.opts ? "" : '<span class="lbl">' + esc(t().answer) + '</span><span class="short">' + md(q.a) + "</span>") +
               '<span class="lbl">' + esc(t().explain) + "</span>" + md(q.e) +
             "</div></div>";
    }).join("");
  }

  function markLabel(on){
    return "<span>" + (on ? "✓" : "○") + "</span><span>" + esc(on ? t().markOn : t().markOff) + "</span>";
  }

  function renderStandard(s){
    var prev = D()[s.i - 1], next = D()[s.i + 1];
    var topic = T().filter(function(x){ return x.id === s.topic; })[0] || {name:""};
    main.innerHTML =
      '<div class="crumb"><button class="back" id="backBtn">' + esc(t().back) + "</button><span>" + esc(topic.name) + "</span></div>" +
      '<div class="head">' +
        '<span class="code-chip">' + esc(s.code) + "</span>" +
        "<h1>" + esc(s.title) + "</h1>" +
        '<div class="en">' + esc(s.titleEn) + "</div>" +
        '<div class="one">' + md(s.one) + "</div>" +
        '<div class="tags">' + (s.tags||[]).map(function(x){ return '<span class="tag">' + esc(x) + "</span>"; }).join("") + "</div>" +
      "</div>" +
      "<section><h2>" + esc(t().secWhy) + '</h2><div class="prose">' + renderBlocks(s.why) + "</div></section>" +
      "<section><h2>" + esc(t().secRules) + '</h2><div class="rules">' +
        (s.rules||[]).map(function(r){ return '<dl class="rule"><dt>' + md(r.h) + "</dt><dd>" + md(r.p) + "</dd></dl>"; }).join("") +
      "</div></section>" +
      "<section><h2>" + esc(t().secExample) + '</h2><div class="prose">' + renderBlocks(s.example) + "</div></section>" +
      "<section><h2>" + esc(t().secPitfalls) + '</h2><ul class="pitfalls">' +
        (s.pitfalls||[]).map(function(p){ return "<li>" + md(p) + "</li>"; }).join("") +
      "</ul></section>" +
      "<section><h2>" + esc(t().secQuiz) + "</h2>" + renderQuiz(s) +
        '<button class="markbtn" id="markBtn" aria-pressed="' + (store.done[s.slug] ? "true" : "false") + '">' +
        markLabel(!!store.done[s.slug]) + "</button>" +
      "</section>" +
      '<div class="pager">' +
        '<button id="prevBtn"' + (prev ? "" : " disabled") + '><span class="dir">' + esc(t().prev) + '</span><span class="nm">' +
          (prev ? esc(prev.code + " · " + prev.title) : "—") + "</span></button>" +
        '<button id="nextBtn"' + (next ? "" : " disabled") + '><span class="dir">' + esc(t().next) + '</span><span class="nm">' +
          (next ? esc(next.code + " · " + next.title) : "—") + "</span></button>" +
      "</div>";

    var b;
    if((b = document.getElementById("prevBtn")) && prev) b.onclick = function(){ location.hash = "#/" + prev.slug; };
    if((b = document.getElementById("nextBtn")) && next) b.onclick = function(){ location.hash = "#/" + next.slug; };
    document.getElementById("backBtn").onclick = function(){ document.body.dataset.view = "list"; };
    document.getElementById("markBtn").onclick = function(){
      store.done[s.slug] = !store.done[s.slug]; save(); updMeter(); renderNav();
      this.setAttribute("aria-pressed", store.done[s.slug] ? "true" : "false");
      this.innerHTML = markLabel(!!store.done[s.slug]);
    };
  }

  main.addEventListener("click", function(e){
    var opt = e.target.closest(".opt");
    if(opt && !opt.disabled && opt.dataset.q){
      var wrap = opt.parentNode, correct = +opt.dataset.a, picked = +opt.dataset.i;
      Array.prototype.forEach.call(wrap.children, function(el, j){
        el.disabled = true;
        if(j === correct) el.classList.add("right");
        else if(j === picked) el.classList.add("wrong");
      });
      document.getElementById("a-" + opt.dataset.q).hidden = false;
      store.solved[opt.dataset.q] = picked === correct; save();
      return;
    }
    var rev = e.target.closest(".reveal");
    if(rev){ document.getElementById("a-" + rev.dataset.q).hidden = false; rev.remove(); }
  });

  /* ── тренажёр ── */
  var tr = null;
  function buildPool(){
    var pool = [];
    D().forEach(function(s){ (s.quiz||[]).forEach(function(q, i){ if(q.opts) pool.push({ s:s, q:q }); }); });
    return pool;
  }
  function startTrainer(){
    var bag = buildPool();
    for(var i = bag.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var x = bag[i]; bag[i] = bag[j]; bag[j] = x; }
    tr = { items: bag.slice(0, 10), idx: 0, score: 0 };
    renderTrainer();
  }
  function scoreLine(){
    return t().trQ + " " + (tr.idx + 1) + " / " + tr.items.length + " · " + t().trCorrect + " " + tr.score;
  }
  function renderTrainer(){
    document.body.dataset.view = "detail";
    if(tr.idx >= tr.items.length){
      var pct = Math.round(tr.score / tr.items.length * 100);
      var verdict = pct >= 80 ? t().v80 : pct >= 50 ? t().v50 : t().v0;
      main.innerHTML = '<div class="trainer"><div class="tr-done">' +
        '<span class="big">' + tr.score + " / " + tr.items.length + "</span>" +
        "<p>" + esc(verdict) + "</p>" +
        '<button class="btn" id="againBtn">' + esc(t().trAgain) + "</button></div></div>";
      document.getElementById("againBtn").onclick = startTrainer;
      return;
    }
    var it = tr.items[tr.idx];
    main.innerHTML = '<div class="trainer">' +
      '<div class="tr-head"><h1>' + esc(t().trHead) + '</h1><span class="score">' + esc(scoreLine()) + "</span></div>" +
      '<p class="tr-sub">' + esc(t().trSub) + "</p>" +
      '<div class="tr-from">' + esc(it.s.code) + " · " + esc(it.s.title) + "</div>" +
      '<div class="q"><div class="q-t">' + md(it.q.q) + "</div>" +
      '<div class="opts" id="trOpts">' + it.q.opts.map(function(o, j){
        return '<button class="opt" data-i="' + j + '"><span class="lt">' + "ABCD".charAt(j) + "</span><span>" + md(o) + "</span></button>";
      }).join("") + "</div>" +
      '<div class="ans" id="trAns" hidden><span class="lbl">' + esc(t().explain) + "</span>" + md(it.q.e) + "</div>" +
      '<div class="tr-actions" id="trActions" hidden>' +
        '<button class="btn" id="trNext">' + esc(tr.idx + 1 < tr.items.length ? t().trNext : t().trResult) + "</button>" +
        '<button class="btn ghost" id="trOpen">' + esc(t().trOpen) + "</button>" +
      "</div></div></div>";

    document.getElementById("trOpts").addEventListener("click", function(e){
      var opt = e.target.closest(".opt"); if(!opt || opt.disabled) return;
      var picked = +opt.dataset.i, correct = it.q.a;
      Array.prototype.forEach.call(this.children, function(el, j){
        el.disabled = true;
        if(j === correct) el.classList.add("right");
        else if(j === picked) el.classList.add("wrong");
      });
      if(picked === correct) tr.score++;
      document.getElementById("trAns").hidden = false;
      document.getElementById("trActions").hidden = false;
      document.querySelector(".score").textContent = scoreLine();
    });
    document.getElementById("trNext").onclick = function(){ tr.idx++; renderTrainer(); };
    document.getElementById("trOpen").onclick = function(){ var sl = it.s.slug; setMode("ref"); location.hash = "#/" + sl; };
  }

  /* ── режимы, язык, маршрутизация ── */
  var mode = "ref";
  function applyChrome(){
    var u = t();
    document.documentElement.lang = lang;
    document.title = u.brand;
    $("#brandName").textContent = u.brand;
    $("#brandSub").textContent = D().length + " " + u.sub.replace(/^\d+\s*/, "");
    $("#meterLbl").textContent = u.studied;
    $("#mReference").textContent = u.reference;
    $("#mTrainer").textContent = u.trainer;
    $("#search").placeholder = u.searchPlaceholder;
    $("#lRu").setAttribute("aria-pressed", lang === "ru" ? "true" : "false");
    $("#lEn").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
  }
  function setMode(m){
    mode = m;
    $("#mReference").setAttribute("aria-pressed", m === "ref" ? "true" : "false");
    $("#mTrainer").setAttribute("aria-pressed", m === "trainer" ? "true" : "false");
    if(m === "trainer") startTrainer(); else route();
  }
  $("#mReference").onclick = function(){ setMode("ref"); };
  $("#mTrainer").onclick = function(){ setMode("trainer"); };

  function setLang(next){
    if(next === lang) return;
    lang = next;
    try { localStorage.setItem("ifrs-lang", lang); } catch(e){}
    applyChrome();
    updMeter();
    if(mode === "trainer") startTrainer(); else route();
  }
  $("#lRu").onclick = function(){ setLang("ru"); };
  $("#lEn").onclick = function(){ setLang("en"); };

  function route(){
    if(mode === "trainer") return;
    var slug = (location.hash || "").replace(/^#\/?/, "");
    var s = D().filter(function(x){ return x.slug === slug; })[0] || D()[0];
    active = s.slug;
    renderStandard(s);
    renderNav();
    if(window.innerWidth <= 900 && slug) document.body.dataset.view = "detail";
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function(){ if(mode !== "ref") setMode("ref"); else route(); });

  document.body.dataset.view = (window.innerWidth <= 900 && !location.hash) ? "list" : "detail";
  applyChrome();
  updMeter();
  route();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () { /* оффлайн-кэш недоступен — приложение всё равно работает */ });
  });
}
</script>

</body>
