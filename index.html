  e:"This is a material prior period error. The error itself was made in 2023, a period no longer presented, so its effect goes into opening retained earnings at the start of the earliest period presented (1 January 2024). The amortisation charged on that fictitious asset in 2024 must also be removed from the comparatives, and the nature of the error and the correction to each affected line must be disclosed."},
 {q:"A change in accounting policy may be applied prospectively when:",
  opts:["Management decides so","Retrospective restatement is impracticable","The effect is immaterial to investors","The entity is adopting IFRS for the first time"],
  a:1, e:"The only general exception is impracticability: the entity has made every reasonable effort but the effect cannot be determined. It then applies the policy from the earliest date practicable and discloses why."}
]
},

{
code: "IAS 10", slug: "ias10", topic: "basis",
title: "Events after the Reporting Period",
titleEn: "События после отчётного периода",
tags: ["adjusting", "non-adjusting", "authorisation date", "dividends", "customer insolvency"],
one: "Splits everything that happens between the reporting date and authorisation into two kinds: change the numbers, or just tell the story.",
why: [
 {p:"Months pass between 31 December and the signing of the accounts. In that time a customer goes bankrupt, a warehouse burns down, the board declares a dividend. Which of those belongs in the numbers for the year just ended?"},
 {p:"There is a single, very simple test: **did the condition exist at the reporting date?** If it did, the event merely confirms what was already there and the numbers are adjusted. If the condition arose afterwards, the numbers must be left alone — otherwise the statements stop describing a specific date."}
],
rules: [
 {h:"Adjusting events", p:"They confirm conditions that existed at the reporting date. The amounts in the statements **are restated**."},
 {h:"Non-adjusting events", p:"They indicate conditions arising after the reporting date. Amounts are unchanged; if material, the nature and an estimate of the financial effect are disclosed."},
 {h:"Dividends", p:"Dividends declared after the reporting date are **never** a liability at that date. Disclosure only. This is an explicit rule in IAS 10."},
 {h:"Going concern is the exception", p:"If it becomes clear after the reporting date that the entity will not continue, the statements **may not** be prepared on a going concern basis. That overturns the whole basis of preparation, not just a number."},
 {h:"Date of authorisation", p:"The entity discloses the date the statements were authorised for issue and who gave that authorisation. That date closes the window."}
],
example: [
 {h:"Five events dissected"},
 {p:"Reporting date 31.12.2025; the statements were authorised on 20.03.2026. Between those dates:"},
 {table:{head:["Event","Type","Action"],rows:[
  ["12.02.2026 a major customer is declared insolvent; the $40m receivable arose in October 2025","Adjusting","Recognise the $40m impairment in 2025 — the customer was already insolvent at 31.12"],
  ["05.02.2026 remaining inventory sold $8m below cost","Adjusting","Write inventory down to net realisable value at 31.12.2025 (IAS 2)"],
  ["28.01.2026 the court rules against the entity: $25m on a claim arising from a 2024 event","Adjusting","Recognise a $25m provision at 31.12.2025 (IAS 37: the ruling confirmed the obligation)"],
  ["10.03.2026 fire destroys a $120m warehouse","Non-adjusting","Do not change the numbers; disclose the nature and amount"],
  ["15.03.2026 the board declares a $90m dividend","Non-adjusting","No liability; disclose"]
 ]}},
 {h:"Why the fire is not an adjustment"},
 {p:"At 31.12.2025 the warehouse existed and was worth $120m. The statements describe the position **at that date**, and at that date they are correct. A fire in March is an event of the following year and will reduce assets in the 2026 accounts."},
 {note:"The one thing that can change that conclusion is a fire severe enough to destroy the business as a going concern. Then the whole basis of preparation for 2025 changes."}
],
pitfalls: [
 "Accruing dividends declared after the reporting date — a very common error.",
 "Assuming customer insolvency is automatically adjusting. If the receivable arose after the reporting date, the condition did not exist at 31.12.",
 "Adjusting for a fall in share prices or market prices after the reporting date: that is always non-adjusting.",
 "Omitting the date of authorisation and the body that gave it."
],
quiz: [
 {q:"Reporting date 31 December. In January the entity settled a lawsuit for $30m; the claim was filed in August of the prior year. A $18m provision was recognised at 31 December. What is required?",
  opts:["Nothing, disclose only","Increase the provision to $30m in the year just ended","Recognise a $12m expense in the following year","Reverse the provision in full"],
  a:1, e:"The settlement confirms an obligation that existed at the reporting date (the claim was filed in August). Adjusting event: the provision is increased to $30m and the further $12m expense falls in the year just ended."},
 {q:"After the reporting date the entity issued $500m of shares and acquired a subsidiary. The effect on the statements for the year just ended:",
  opts:["Recognise in the statement of financial position at the reporting date","Restate earnings per share","Leave the numbers; disclose the nature and financial effect","Recognise the investment at fair value"],
  a:2, e:"The conditions arose after the reporting date — non-adjusting. A material business combination after the reporting date is specifically named in the standard as requiring disclosure."},
 {q:"On 25 December the entity decided to close a division; the plan was approved and announced to employees on 20 January. Is a restructuring provision recognised at 31 December?",
  a:"No",
  e:"IAS 37 requires two things for a restructuring provision: a detailed formal plan and a valid expectation raised in those affected (announcement or implementation). At 31 December there was only an internal decision. The announcement on 20 January is a non-adjusting event: the obligation arose after the reporting date, so no provision — but disclosure is required."}
]
},

{
code: "IAS 7", slug: "ias7", topic: "basis",
title: "Statement of Cash Flows",
titleEn: "Отчёт о движении денежных средств",
tags: ["cash flow", "operating", "investing", "financing", "indirect method", "cash equivalents"],
one: "Shows where the cash actually came from and went, split three ways — and here profit is not the point.",
why: [
 {p:"Profit is a judgement: it depends on depreciation, provisions and estimates. Cash is a fact. The statement of cash flows answers the question a lender cares about most: can this business generate cash itself, or does the profit exist only on paper?"},
 {p:"The classic warning light is rising profit alongside negative operating cash flow for several periods running. Usually it means revenue is being recognised while the cash sits in receivables and inventory."}
],
rules: [
 {h:"Three sections", p:"**Operating** — the principal revenue-producing activities. **Investing** — acquisition and disposal of long-term assets and investments. **Financing** — changes in the size and composition of equity and borrowings."},
 {h:"Cash equivalents", p:"Short-term, highly liquid investments readily convertible to known amounts of cash and subject to an insignificant risk of changes in value. The practical guide is a maturity of three months or less from acquisition. Equity investments do not qualify."},
 {h:"Indirect method", p:"Start from profit before tax → strip out non-cash items (depreciation, impairment, gain or loss on disposal) → strip out items belonging to other sections (interest, investment income) → adjust for movements in working capital → deduct interest and tax paid."},
 {h:"Interest and dividends", p:"For a non-financial entity the standard allows a choice but demands consistency. Typically: **interest paid** — operating or financing; **interest and dividends received** — operating or investing; **dividends paid** — financing or operating."},
 {h:"Non-cash transactions", p:"Acquiring an asset in exchange for shares, converting a loan into equity, recognising a right-of-use asset under IFRS 16 — these are **excluded** from the statement and disclosed instead. Otherwise the statement stops reporting cash."},
 {h:"Required reconciliation", p:"Changes in liabilities arising from financing activities must be disclosed, separating cash and non-cash movements between opening and closing balances."}
],
example: [
 {h:"Operating cash flow, indirect method"},
 {table:{head:["Item","$m"],rows:[
  ["Profit before tax","820"],
  ["Depreciation","310"],
  ["Goodwill impairment","45"],
  ["Gain on disposal of equipment","(28)"],
  ["Finance costs","96"],
  ["**Operating profit before working capital changes**","**1,243**"],
  ["Increase in inventories","(180)"],
  ["Increase in trade receivables","(240)"],
  ["Increase in trade payables","75"],
  ["**Cash generated from operations**","**898**"],
  ["Interest paid","(90)"],
  ["Income taxes paid","(165)"],
  ["**Net cash from operating activities**","**643**"]
 ]}},
 {h:"Why the gain on disposal is deducted"},
 {p:"Equipment with a carrying amount of 92 was sold for 120. Profit contains +28. But the whole 120 is an **investing** inflow. Leaving the +28 in the operating section would count that cash twice. So the gain is stripped out of operating and the full 120 goes into investing."},
 {h:"Deriving tax paid"},
 {table:{head:["Income tax T-account","$m"],rows:[
  ["Opening balance (liability)","110"],
  ["Charge for the year (P&L)","190"],
  ["Closing balance (liability)","(135)"],
  ["**Paid = 110 + 190 − 135**","**165**"]
 ],note:"The same trick works for interest, dividends and purchases of PPE: open a T-account and solve for the missing figure."}}
],
pitfalls: [
 "Presenting depreciation as a 'source of cash'. It is only the removal of a non-cash charge, not an inflow.",
 "Putting interest and tax charged, rather than paid, into the statement.",
 "Showing the recognition of a right-of-use asset under IFRS 16 as a cash outflow — no cash moves.",
 "Classifying a bank overdraft as financing when it is an integral part of cash management: it then forms part of cash and cash equivalents.",
 "Forgetting that an increase in a working capital asset is an outflow, while an increase in a liability is an inflow."
],
quiz: [
 {q:"PPE: opening 1,400, closing 1,760, depreciation for the year 210, equipment with a carrying amount of 90 disposed of. How much was spent acquiring PPE?",
  a:"$660m",
  e:"T-account: 1,400 + additions − 210 (depreciation) − 90 (disposal) = 1,760. Additions = 1,760 − 1,400 + 210 + 90 = 660, an investing outflow (assuming it was all paid in cash; any payables for PPE must be dealt with separately)."},
 {q:"An entity converted a $300m bond into ordinary shares. How is this presented in the statement of cash flows?",
  opts:["A $300m financing inflow and a $300m financing outflow","A $300m financing inflow","Not at all — disclosed as a non-cash transaction","A $300m investing outflow"],
  a:2, e:"Not a single dollar of cash moved. Investing and financing transactions that do not require cash are excluded from the statement and disclosed separately, so readers still see the change in capital structure."},
 {q:"Where may dividends received from an associate (equity accounted) be presented?",
  opts:["Operating only","Financing only","Operating or investing, applied consistently as a policy choice","Not presented"],
  a:2, e:"IAS 7 permits dividends received to be classified as operating (part of the returns from activities) or investing (a return on an investment). The requirement is to disclose the choice and apply it consistently."}
]
},

{
code: "IFRS 13", slug: "ifrs13", topic: "basis",
title: "Fair Value Measurement",
titleEn: "Оценка справедливой стоимости",
tags: ["fair value", "hierarchy", "level 1", "level 3", "principal market", "highest and best use"],
one: "One recipe for fair value across every standard: the price to sell in an orderly transaction between market participants at the measurement date.",
why: [
 {p:"Before IFRS 13 each standard described fair value in its own words. Now there is one definition, and the standards only say **when** to use it."},
 {p:"The crucial detail is that it is an **exit price**: what the asset could be sold for, not what you would pay for it. And it is always the market's view, never yours: the intentions of the particular entity are irrelevant."}
],
rules: [
 {h:"Definition", p:"The price that would be received to sell an asset or paid to transfer a liability in an **orderly transaction** between market participants at the measurement date."},
 {h:"Principal market", p:"Measurement uses prices in the principal market (greatest volume and level of activity for the asset), or the most advantageous market if there is none. The price is **not** adjusted for transaction costs, but is adjusted for transport costs where location is a characteristic of the asset."},
 {h:"Highest and best use", p:"For non-financial assets, fair value reflects the highest and best use by a market participant — even if the entity itself uses the asset differently."},
 {h:"The three-level hierarchy", p:"**Level 1**: quoted prices in active markets for identical assets (used without adjustment). **Level 2**: observable inputs other than Level 1 (prices for similar assets, rates, yield curves). **Level 3**: unobservable inputs — the entity's own model."},
 {h:"Three valuation approaches", p:"Market (comparable transactions), income (discounting future flows), cost (current replacement cost). Choose the one with the most observable inputs."},
 {h:"Inputs rank, not techniques", p:"The hierarchy ranks **inputs**, not methods. A DCF built on observable rates can be Level 2; the same model built on the entity's own forecasts is Level 3."}
],
example: [
 {h:"Choosing the market"},
 {p:"An entity holds shares traded on two exchanges. Transaction costs are the broker's commission."},
 {table:{head:["Exchange","Price","Transaction costs","Net proceeds","Volume"],rows:[
  ["Exchange A","102","4","98","High — principal market"],
  ["Exchange B","104","8","96","Low"]
 ]}},
 {p:"The principal market is Exchange A because volume is greatest there. Fair value is **102**, not 98 and not 104. Transaction costs are relevant to **choosing** the market but are not deducted from fair value itself."},
 {h:"Highest and best use"},
 {p:"An entity owns land occupied by an old factory building. As an industrial site the complex is worth $300m. As residential development land (consent obtainable, demolition costs $40m) it is worth $520m."},
 {table:{head:["Option","Calculation","Fair value"],rows:[
  ["Continue manufacturing","—","$300m"],
  ["Demolish and sell for development","520 − 40","**$480m**"]
 ],note:"Fair value is $480m even though the entity has no intention of demolishing anything. The measurement reflects market participants' view, not the owner's plans."}}
],
pitfalls: [
 "Deducting transaction costs from fair value. They only affect the choice of the most advantageous market.",
 "Adjusting a Level 1 quoted price for the size of the holding (a blockage factor) — expressly prohibited.",
 "Using the most advantageous market when a principal market exists. The principal market always wins.",
 "Assuming the level is set by the method. The level is set by the lowest-level input that is significant to the measurement."
],
quiz: [
 {q:"An asset is quoted in an active market at $250. The entity's holding would have to be sold at a 6% discount if disposed of in one block. Fair value per unit:",
  opts:["$235","$250","$250 less transaction costs","Determined by a Level 3 model"],
  a:1, e:"IFRS 13 prohibits a blockage factor. A Level 1 quoted price is applied as it stands: $250 per unit multiplied by the number of units."},
 {q:"An entity measures an OTC interest rate swap by discounting, using observable market yield curves and quoted rates. Which level of the hierarchy?",
  opts:["Level 1","Level 2","Level 3","Level 2 or 3 at the entity's choice"],
  a:1, e:"The instrument itself is not quoted (so not Level 1), but all significant inputs are observable in the market — Level 2. It would become Level 3 if the entity's own forecasts were used, for example a non-market credit risk assumption."},
 {q:"Why is fair value called an exit price, and how does that differ from entry price?",
  a:"It is the price to sell the asset to a market participant, not the amount paid to acquire it",
  e:"An exit price is what a seller would receive in an orderly transaction at the measurement date. Entry price may equal it on acquisition but need not: the buyer may have overpaid, received a volume discount, or bought in a different market. Fair value also excludes transaction costs, whereas the IAS 16 cost of an acquired asset includes them."}
]
},

/* ─────────────────────────── ASSETS ─────────────────────────── */
{
code: "IAS 16", slug: "ias16", topic: "assets",
title: "Property, Plant and Equipment",
titleEn: "Основные средства",
tags: ["PPE", "depreciation", "revaluation", "component accounting", "residual value", "capitalisation"],
one: "How a building or machine gets onto the balance sheet, how it is charged to profit thereafter, and what to do when the market price moves.",
why: [
 {p:"Property, plant and equipment is usually the largest line in a manufacturer's balance sheet. Three questions: what goes into initial cost, how that cost is spread over the years, and whether the asset may be carried at market value."},
 {p:"The central fork is the **measurement model after recognition**: cost less accumulated depreciation, or revalued amount. The choice is made for an entire class of assets, not for an individual building."}
],
rules: [
 {h:"What is included in cost", p:"Purchase price (net of discounts) + **all directly attributable costs** of bringing the asset to the location and condition necessary for operation + the initial estimate of dismantling and site restoration costs. Capitalisation stops when the asset is capable of operating as management intended."},
 {h:"What is excluded", p:"Staff training, costs of opening a new facility, administrative overheads, operating losses during the ramp-up phase, costs of relocating an asset already in use."},
 {h:"Depreciation", p:"Begins when the asset is **available for use**, not when it is actually switched on. It continues even while the asset is idle. It ceases at the earlier of classification under IFRS 5 and derecognition."},
 {h:"Component accounting", p:"Significant parts with different useful lives are depreciated separately. An aircraft: airframe 25 years, engines 8 years, interior 5 years."},
 {h:"Annual review", p:"Useful life, residual value and depreciation method are reviewed at least at each reporting date. A change is an accounting estimate under IAS 8 — that is, **prospective**."},
 {h:"Revaluation model", p:"Fair value, applied regularly, to the whole class. An increase goes to OCI and a revaluation surplus. A decrease is an expense, but first absorbs any surplus previously recognised on **that same asset**."},
 {h:"Transfer of the surplus", p:"The revaluation surplus may be transferred to retained earnings — piecemeal (the excess depreciation) or in full on disposal. **Always within equity, never through profit or loss.**"},
 {h:"Subsequent expenditure", p:"Capitalised only if it increases future benefits. Routine repairs and maintenance are expensed. Replacing a major component is capitalised, with simultaneous derecognition of the carrying amount of the part replaced."}
],
example: [
 {h:"Initial cost, line by line"},
 {table:{head:["Item","$m","Capitalise?"],rows:[
  ["Invoice price of the machine","24.0","Yes"],
  ["Supplier discount","(1.5)","Yes, deduct"],
  ["Delivery and insurance in transit","0.9","Yes"],
  ["Installation and commissioning","1.2","Yes"],
  ["Testing costs","0.4","Yes"],
  ["Operator training","0.6","**No** — expense"],
  ["Three-year maintenance contract","1.8","**No** — expense as the service is received"],
  ["Dismantling obligation at end of life (present value)","2.0","Yes"],
  ["**Total initial cost**","**27.0**",""]
 ],note:"Note the testing line: since 2022, proceeds from selling items produced while testing are recognised in profit or loss rather than deducted from the cost of the asset. Only the testing costs themselves are capitalised."}},
 {h:"Revaluation: the full cycle"},
 {p:"A building cost $200m with a 40-year life, straight line. It is revalued after 10 years."},
 {table:{head:["Step","Calculation","Amount"],rows:[
  ["Carrying amount after 10 years","200 − (200/40 × 10)","$150m"],
  ["Fair value","—","$230m"],
  ["Revaluation increase","230 − 150","**$80m → OCI**"],
  ["New depreciation","230 / 30 remaining years","$7.67m per year"],
  ["Depreciation without revaluation","200 / 40","$5.0m per year"],
  ["Annual transfer of surplus","7.67 − 5.0","$2.67m from surplus to retained earnings"]
 ]}},
 {je:{title:"Revaluation entry",lines:[["Dr","Property, plant and equipment","80,000,000"],["Cr","Other comprehensive income — revaluation surplus","80,000,000"]],note:"Profit is untouched. A year later: Dr Depreciation 7.67 / Cr Accumulated depreciation 7.67, and separately Dr Revaluation surplus 2.67 / Cr Retained earnings 2.67."}},
 {h:"And if the price then falls"},
 {p:"Five years later the carrying amount is 230 − 7.67 × 5 = $191.7m while fair value is $150m. The decrease is $41.7m. The remaining surplus on this building is 80 − 2.67 × 5 = $66.7m, so the decrease is **fully absorbed by the surplus** through OCI and nothing reaches profit or loss."}
],
pitfalls: [
 "Capitalising staff training and start-up costs.",
 "Not depreciating idle equipment — the standard does not allow that.",
 "Revaluing one asset out of a class. Revaluation applies to the whole class, otherwise the class becomes a mixture of measurement bases.",
 "Taking a decrease straight to expense without first absorbing the surplus on the same asset — or absorbing a surplus built up on a different asset.",
 "Skipping the transfer of the revaluation surplus: without it, retained earnings never receive the distributable amount."
],
quiz: [
 {q:"An asset cost $60m, ten-year life, residual value $6m. After four years the remaining life is revised to three years and the residual value to $3m. Depreciation in year 5?",
  a:"$11.8m",
  e:"Years 1–4: (60 − 6)/10 = $5.4m a year, accumulated $21.6m. Carrying amount = 60 − 21.6 = $38.4m. New depreciable amount = 38.4 − 3 = $35.4m over three years = $11.8m a year. Under IAS 8 the change is prospective: prior years are not restated."},
 {q:"A $40m revaluation increase on a building is recognised:",
  opts:["In profit or loss","In other comprehensive income, accumulated in a revaluation surplus","Directly in retained earnings","As a reduction in the cost of other assets in the class"],
  a:1, e:"The increase goes to OCI and accumulates in the revaluation surplus within equity. It would reach profit or loss only to the extent that it reverses a decrease on the same asset previously recognised in profit or loss."},
 {q:"An entity replaced the lifts in a building: the new lifts cost $18m and the carrying amount of the old lifts in the records is $3m. The correct treatment is:",
  opts:["Expense the $18m","Capitalise $18m and leave the $3m in the records","Capitalise $18m and write off the $3m to expense","Capitalise $15m"],
  a:2, e:"Replacing a major component is capitalised, and the carrying amount of the part replaced is derecognised. Component accounting is precisely what makes that $3m identifiable."}
]
},

{
code: "IAS 38", slug: "ias38", topic: "assets",
title: "Intangible Assets",
titleEn: "Нематериальные активы",
tags: ["intangibles", "research", "development", "goodwill", "patent", "brand", "capitalisation"],
one: "A strict filter for invisible assets: research is always expensed, development is capitalised once six criteria are met, and an internally generated brand never.",
why: [
 {p:"An intangible asset is easy to assert and hard to verify, so IAS 38 is deliberately conservative. The gateway question is **identifiability**: the item must be separable, or it must arise from contractual or other legal rights."},
 {p:"Identifiability is exactly what separates an intangible from goodwill: goodwill cannot be separated, so it lives under IFRS 3 and is never amortised."}
],
rules: [
 {h:"Definition", p:"An identifiable non-monetary asset without physical substance, controlled by the entity, from which future economic benefits are expected."},
 {h:"Research", p:"**Always an expense.** Searching for new knowledge, evaluating alternatives, searching for applications — the benefits are not yet demonstrable."},
 {h:"Development", p:"Capitalisation is **mandatory** once all six criteria are met (mnemonic PIRATE): **P**robable future benefits; **I**ntention to complete; **R**esources adequate; **A**bility to use or sell; **T**echnical feasibility; **E**xpenditure measurable reliably."},
 {h:"No going back", p:"Expenditure already recognised as an expense **cannot** be capitalised later, even if the criteria are subsequently met. Only costs incurred after the criteria are satisfied may be capitalised."},
 {h:"Internally generated items", p:"Brands, mastheads, customer lists and goodwill generated internally are **not recognised**: their cost cannot be distinguished from the cost of developing the business as a whole."},
 {h:"Acquired in a business combination", p:"Measured at fair value at the acquisition date. A brand bought together with a company is recognised as a separate asset — even though the identical brand, if built internally, would never be recognised."},
 {h:"Finite and indefinite lives", p:"Finite life → amortise over that life. Indefinite life → **not amortised**, but tested for impairment annually and whenever there is an indicator."},
 {h:"Revaluation model", p:"Permitted, but only where an **active market** exists for such intangibles. In practice almost never: brands and patents are unique."}
],
example: [
 {h:"A project through the year"},
 {p:"A pharmaceutical company is developing a drug. Costs by quarter in 2025:"},
 {table:{head:["Period","Stage","Cost","Treatment"],rows:[
  ["Q1","Screening candidate molecules","$120m","Expense — research"],
  ["Q2","Pre-clinical trials, outcome unclear","$200m","Expense — research"],
  ["15 July","Positive results, budget approved, feasibility confirmed","—","All six criteria met"],
  ["Q3 (after 15 July)","Phase III clinical trials","$340m","**Capitalise**"],
  ["Q4","Production set-up and registration","$180m","**Capitalise**"],
  ["Q4","Pre-launch advertising","$90m","Expense — expressly prohibited"]
 ],note:"2025 profit or loss bears $410m of expense; the statement of financial position carries a $520m intangible. The Q1–Q2 costs can never be reinstated as an asset."}},
 {h:"A purchased brand versus an internal one"},
 {table:{head:["Situation","Recognised?","Why"],rows:[
  ["The entity spent 15 years building a brand a valuer says is worth $2bn","No","Internally generated brand — expressly prohibited by IAS 38"],
  ["The entity bought a competitor whose brand has a fair value of $800m","**Yes**","Acquired in a business combination, measured under IFRS 3"],
  ["The purchased brand was then supported with $300m of advertising","No, the asset stays at $800m","Subsequent brand expenditure is an expense"]
 ]}},
 {h:"Amortising a licence"},
 {p:"A 12-year licence cost $96m. The legal term can be renewed for a further 12 years for a nominal fee, the entity intends to renew, and the technology is not becoming obsolete."},
 {p:"Useful life is 24 years (renewal is within the entity's control and costs little). Amortisation is $4m a year. If renewal required significant further outlay or were uncertain, the life would be 12 years and the charge $8m."}
],
pitfalls: [
 "Capitalising all project costs from inception rather than from the date all six criteria are met.",
 "Putting an internally generated brand or customer list on the balance sheet.",
 "Amortising an indefinite-life intangible. Indefinite does not mean infinite — it means an annual impairment test instead of amortisation.",
 "Forgetting that indefinite-life intangibles and intangibles not yet available for use are tested annually regardless of indicators.",
 "Treating goodwill as a species of IAS 38 intangible. Goodwill is scoped out of the standard."
],
quiz: [
 {q:"When MUST development expenditure be capitalised?",
  opts:["When management decides to","When all six IAS 38 criteria are met","When the project is successfully completed","When the cost exceeds a materiality threshold"],
  a:1, e:"Capitalisation is not a choice. Once all six criteria are met the entity must capitalise costs incurred from that point. Before that it must expense them."},
 {q:"An entity acquired a competitor for $3bn. The assets acquired include a trade mark (fair value $400m) and contractual customer relationships (fair value $250m). How are they accounted for?",
  a:"Both are recognised as separate intangible assets at fair value",
  e:"The IAS 38 prohibition applies only to internally generated brands and customer lists. In a business combination, identifiable intangibles are recognised separately from goodwill at fair value: the mark is separable (it could be sold) and the customer relationships arise from contractual rights. That $650m is carved out of what would otherwise sit in goodwill — and unlike goodwill it will be amortised."},
 {q:"$25m spent training staff to use a new system is accounted for as:",
  opts:["Part of the cost of an intangible asset","An expense of the period","A separate indefinite-life intangible","A prepayment released over 5 years"],
  a:1, e:"The entity does not control its employees — they can leave at any time. Control over the future benefits fails, so the definition of an asset is not met. Expense only."}
]
},

{
code: "IAS 36", slug: "ias36", topic: "assets",
title: "Impairment of Assets",
titleEn: "Обесценение активов",
tags: ["impairment", "recoverable amount", "CGU", "value in use", "goodwill", "indicators"],
one: "Stops an asset being carried at more than it can actually deliver: carrying amount is compared with recoverable amount.",
why: [
 {p:"An asset is future economic benefits. If the benefits have shrunk below the number in the balance sheet, the balance sheet is wrong. IAS 36 is the mechanism for checking."},
 {p:"It covers almost all non-current assets: PPE, intangibles, goodwill, investments in subsidiaries and associates, right-of-use assets. It excludes inventories (IAS 2), deferred tax (IAS 12), financial assets (IFRS 9) and assets held for sale (IFRS 5) — each has its own rules."}
],
rules: [
 {h:"Recoverable amount", p:"The **higher** of fair value less costs of disposal and value in use (the present value of future cash flows from the asset). Both need not always be calculated: if one already exceeds the carrying amount, there is no impairment."},
 {h:"When to test", p:"Whenever there is an **indicator**. Regardless of indicators, annually for: goodwill, indefinite-life intangibles and intangibles not yet available for use."},
 {h:"External indicators", p:"A sharp fall in market value, adverse changes in the technological, market, economic or legal environment, rising interest rates, market capitalisation below net assets."},
 {h:"Internal indicators", p:"Physical damage, obsolescence, plans to discontinue or restructure, economic performance worse than expected."},
 {h:"Cash-generating unit (CGU)", p:"Where cash flows of an individual asset cannot be identified, the smallest group of assets generating largely independent inflows is tested. A single machine is not a CGU; the production line or the plant is."},
 {h:"Allocation order within a CGU", p:"First **all of the goodwill** allocated to the CGU. Then the remainder to the other assets pro rata to carrying amount. No asset may be written below the highest of its fair value less costs of disposal, its value in use and zero."},
 {h:"Reversals", p:"Permitted for all assets when estimates change, but **never for goodwill**. A reversal is capped at the carrying amount that would have existed had no impairment been recognised."},
 {h:"Where the loss goes", p:"To profit or loss. Exception: for a revalued asset, the loss first absorbs the revaluation surplus on that asset through OCI, with any excess to profit or loss."}
],
example: [
 {h:"Impairment of a single asset"},
 {table:{head:["Measure","$m"],rows:[
  ["Carrying amount of the line","180"],
  ["Fair value less costs of disposal","142"],
  ["Value in use (present value of cash flows)","156"],
  ["**Recoverable amount** = higher of 142 and 156","**156**"],
  ["**Impairment loss** = 180 − 156","**24**"]
 ],note:"Take the higher of the two: the entity is not obliged to sell if using the asset is worth more."}},
 {h:"Allocating a loss within a CGU"},
 {p:"A plant treated as a CGU is impaired: recoverable amount $640m against a carrying amount of $800m. The loss is $160m."},
 {table:{head:["Asset","Carrying before","Write-down","Carrying after"],rows:[
  ["Goodwill","60","**(60)**","0"],
  ["Building","400","(62.5)","337.5"],
  ["Equipment","240","(37.5)","202.5"],
  ["Inventories (under IAS 2)","100","—","100.0"],
  ["**Total**","**800**","**(160)**",""]
 ],note:"Note that inventories are excluded from the allocation — they are tested under their own standard. The remaining $100m (160 − 60) is split between the building and the equipment pro rata 400:240, giving 62.5 and 37.5."}},
 {h:"The key detail in value in use"},
 {p:"**Include**: cash flows from continuing use of the asset in its current condition and from its eventual disposal. **Exclude**: a future restructuring to which the entity is not yet committed, future enhancements of the asset, income tax payments and finance costs (already in the discount rate)."}
],
pitfalls: [
 "Taking the lower of the two measures of recoverable amount. It is always the higher.",
 "Including the benefit of a planned upgrade in value in use — prohibited.",
 "Reversing an impairment of goodwill — prohibited absolutely.",
 "Discounting post-tax cash flows at a pre-tax rate (or vice versa) — the cash flows and the rate must be on the same basis.",
 "Forgetting that a loss on a revalued asset first consumes the revaluation surplus rather than going straight to profit."
],
quiz: [
 {q:"Carrying amount 500, fair value less costs of disposal 460, value in use 520. The impairment loss is:",
  opts:["40","0","20","60"],
  a:1, e:"Recoverable amount = higher of 460 and 520 = 520, which exceeds the carrying amount of 500, so there is no impairment. Nor is the asset written up: IAS 36 only reduces carrying amounts, never lifts them above historical cost."},
 {q:"A CGU is impaired by 300. Carrying amounts are: goodwill 80, patent 120, equipment 300. What is the carrying amount of the equipment afterwards?",
  a:"142.9",
  e:"All the goodwill goes first — 80. The remaining 220 is allocated between the patent and the equipment pro rata to carrying amount 120 : 300. Patent: 220 × 120/420 = 62.9, leaving 57.1. Equipment: 220 × 300/420 = 157.1, leaving 142.9. Check: 0 + 57.1 + 142.9 = 200 = 500 − 300."},
 {q:"Which asset is tested for impairment annually regardless of indicators?",
  opts:["A building carried under the revaluation model","Goodwill arising in a business combination","Trade receivables","Investment property at fair value"],
  a:1, e:"The mandatory annual test applies to goodwill, indefinite-life intangibles and intangibles not yet available for use. Receivables follow IFRS 9; investment property at fair value is already remeasured every period."}
]
},

{
code: "IAS 2", slug: "ias2", topic: "assets",
title: "Inventories",
titleEn: "Запасы",
tags: ["inventory", "FIFO", "net realisable value", "NRV", "cost", "LIFO prohibited"],
one: "Inventories are carried at the lower of cost and net realisable value; LIFO is prohibited.",
why: [
 {p:"Inventory sits on the border between the balance sheet and profit or loss: whatever does not go into inventory has immediately become cost of sales. Its measurement therefore drives the profit of the period directly."},
 {p:"The 'lower of' rule is prudence in action: an item may not be carried at more than the market will pay for it."}
],
rules: [
 {h:"Cost includes", p:"Costs of purchase (price, duties, transport, less discounts and recoverable taxes), costs of conversion (direct labour plus allocated production overheads) and other costs of bringing inventories to their present location and condition."},
 {h:"Cost excludes", p:"Abnormal waste of materials and labour, storage of finished goods, administrative overheads, selling costs. All are expenses of the period."},
 {h:"Fixed overheads", p:"Allocated on the basis of **normal capacity**. If actual output is below normal, the unallocated portion is expensed rather than inflating unit cost."},
 {h:"Cost formulas", p:"FIFO or weighted average. **LIFO is prohibited.** Items that are not ordinarily interchangeable use specific identification."},
 {h:"Net realisable value (NRV)", p:"Estimated selling price in the ordinary course of business **less** estimated costs of completion and costs to sell. It is not fair value: NRV is entity-specific."},
 {h:"Compare item by item", p:"The 'lower of' test is applied to each item or group of similar items, **not** to inventories as a whole. Otherwise profitable lines mask loss-making ones."},
 {h:"Reversal of a write-down", p:"Permitted where NRV recovers — but never above original cost."}
],
example: [
 {h:"Item by item"},
 {table:{head:["Item","Cost","Selling price","Costs to sell","NRV","Carried at"],rows:[
  ["A","400","520","30","490","**400**"],
  ["B","350","360","40","320","**320**"],
  ["C","280","300","5","295","**280**"],
  ["Total on an item-by-item basis","1,030","","","","**1,000**"],
  ["Wrong: compared in aggregate","1,030","","","1,105","1,030"]
 ],note:"A write-down of 30 on item B. Compared in aggregate, 1,030 < 1,105 and the loss on B would never surface."}},
 {h:"Under-utilised capacity"},
 {p:"Normal capacity is 100,000 units. Fixed production overheads are $40m. Actual output is 70,000 units."},
 {table:{head:["Step","Amount"],rows:[
  ["Absorption rate per unit","40m / 100,000 = $400"],
  ["Absorbed into output","70,000 × 400 = $28m"],
  ["**Expensed in the period**","**$12m**"]
 ],note:"The temptation is to divide $40m by 70,000 and get $571 a unit. The idle-capacity loss would then hide in inventory and only emerge on sale. The standard prohibits it."}},
 {h:"Work in progress and NRV"},
 {p:"A batch in production: cost to date $180k, a further $60k to complete, the finished item sells for $215k and costs $15k to sell."},
 {p:"NRV = 215 − 60 − 15 = **$140k**. Carrying amount = lower of 180 and 140 = $140k. The $40k write-down is an expense of the period."}
],
pitfalls: [
 "Using LIFO — prohibited in IFRS although permitted under US GAAP.",
 "Comparing cost and NRV across the whole inventory portfolio at once.",
 "Including storage of finished goods or abnormal waste in cost.",
 "Confusing NRV with fair value: NRV reflects this entity's own costs and expectations, fair value reflects the market.",
 "Dividing fixed overheads by actual output when capacity is under-utilised."
],
quiz: [
 {q:"A batch cost 900, expected selling price 1,000, costs to complete 150, sales commission 40. Carrying amount:",
  a:"810",
  e:"NRV = 1,000 − 150 − 40 = 810. Lower of 900 and 810 = 810. The write-down of 90 is expensed immediately — you do not wait for the sale."},
 {q:"Which cost is correctly included in the cost of inventories?",
  opts:["Advertising the product","Carriage of raw materials from the supplier","Storing finished goods before dispatch","Accounts department salaries"],
  a:1, e:"Inward carriage is a cost of purchase that brings the inventory to its present location. Advertising and administrative salaries are period costs; so is storage of finished goods, since the goods are already in their required condition."},
 {q:"Last year inventory was written down from 100 to 70 as prices fell. This year prices have recovered and NRV is 115. Carrying amount at the reporting date:",
  opts:["70","100","115","85"],
  a:1, e:"A reversal is allowed but capped at original cost of 100. Income of 30 is recognised as a reduction in cost of sales. IAS 2 never permits inventory to be carried above cost."}
]
},

{
code: "IAS 40", slug: "ias40", topic: "assets",
title: "Investment Property",
titleEn: "Инвестиционная недвижимость",
tags: ["investment property", "fair value model", "rentals", "capital appreciation", "transfers"],
one: "Property held to earn rentals or for capital appreciation — and it may be remeasured to fair value every year straight through profit or loss.",
why: [
 {p:"If a building is part of production it works alongside the rest of the business and IAS 16 logic fits. If it is held as an investment, the logic of a financial asset is closer: its market value matters in its own right."},
 {p:"Hence the defining feature: under the fair value model, IAS 40 takes changes **through profit or loss**, not through OCI as an IAS 16 revaluation would."}
],
rules: [
 {h:"Definition", p:"Land or a building (or part of one) held to earn rentals or for capital appreciation or both — and **not** for use in production, supply of goods, administration, or for sale in the ordinary course of business."},
 {h:"Two models", p:"**Fair value model**: remeasured at each reporting date, changes in profit or loss, **no depreciation**. **Cost model**: as IAS 16, but fair value must still be disclosed."},
 {h:"The choice applies to all", p:"The model applies to all investment property. Moving from fair value to cost is effectively impossible: it is highly unlikely to give more relevant information."},
 {h:"Transfers", p:"Only on a **change in use** evidenced by facts. Management's intention alone is not enough."},
 {h:"IAS 16 → IAS 40 (fair value model)", p:"The difference between carrying amount and fair value at the date of transfer is treated as an **IAS 16 revaluation**: increase to OCI, decrease to profit or loss."},
 {h:"IAS 40 (fair value) → IAS 16", p:"Fair value at the date of transfer becomes deemed cost going forward. No separate gain arises."},
 {h:"Part of a building", p:"Where part is let and part owner-occupied, the parts are accounted for separately if they could be sold separately. If they could not, the whole is investment property only if the owner-occupied portion is **insignificant**."},
 {h:"Lessee's interest", p:"A right-of-use asset under IFRS 16 may be classified as investment property if it meets the definition, and the fair value model may then be applied."}
],
example: [
 {h:"Classification by situation"},
 {table:{head:["Property","Classification","Standard"],rows:[
  ["Office block let to third-party tenants","Investment property","IAS 40"],
  ["The entity's own head office","Property, plant and equipment","IAS 16"],
  ["A building let to a subsidiary (in the parent's separate statements)","Investment property","IAS 40"],
  ["The same building in the group's consolidated statements","PPE — the group occupies it","IAS 16"],
  ["Land held with no determined use","Investment property — held for capital appreciation","IAS 40"],
  ["Apartments a developer is building to sell","Inventories","IAS 2"],
  ["A hotel the entity operates itself","PPE — the services provided are significant","IAS 16"]
 ],note:"The subsidiary line is a favourite exam trap: the classification depends on whose statements you are preparing."}},
 {h:"The fair value model in numbers"},
 {p:"A building was bought on 1 January 2024 for $500m plus $12m of transaction costs. Fair value was $545m at 31 December 2024 and $505m at 31 December 2025."},
 {table:{head:["Date","Carrying amount","Effect on profit"],rows:[
  ["01.01.2024","512 (including transaction costs)","—"],
  ["31.12.2024","545","**+33 profit**"],
  ["31.12.2025","505","**(40) loss**"]
 ],note:"No depreciation is charged at all. Transaction costs are capitalised only on initial recognition; thereafter they dissolve into fair value."}},
 {h:"Transfer from PPE to investment property"},
 {p:"The entity vacated an office (carrying amount $300m) and let it out. Fair value at the date of transfer was $380m."},
 {je:{title:"Entry at the date of transfer",lines:[["Dr","Investment property","380,000,000"],["Cr","Property, plant and equipment","300,000,000"],["Cr","OCI — revaluation surplus","80,000,000"]],note:"Up to the transfer the property is under IAS 16, so the uplift goes to OCI. Every subsequent movement in fair value will go to profit or loss."}}
],
pitfalls: [
 "Putting fair value movements on investment property through OCI. Under IAS 40 they go to profit or loss.",
 "Depreciating property carried under the fair value model.",
 "Classifying a property let to a subsidiary as investment property in the consolidated statements.",
 "Transferring between categories on the strength of management intention alone.",
 "Forgetting that fair value must still be disclosed under the cost model."
],
quiz: [
 {q:"An entity applies the fair value model. A building's value rises from $700m to $760m. The treatment is:",
  opts:["+60 to OCI and a revaluation surplus","+60 to profit or loss","+60 directly to retained earnings","Not recognised until sale"],
  a:1, e:"This is the defining difference from IAS 16: fair value movements on investment property go straight to profit or loss. It is why the reported profit of property companies is so volatile."},
 {q:"A building was held under IAS 16 (carrying amount 240, no revaluation surplus on it). The entity starts letting it out; fair value is 200. How is the transfer recorded under the fair value model?",
  a:"A loss of 40 in profit or loss",
  e:"At the date of transfer the IAS 16 revaluation rules apply. A decrease first absorbs any revaluation surplus on that asset, but there is none, so all 40 is an expense. Had the value risen, the increase would have gone to OCI."},
 {q:"A developer built apartments and decided to let the unsold units on an indefinite basis. Those units:",
  opts:["Stay as inventories under IAS 2","Transfer to investment property under IAS 40","Become PPE under IAS 16","Are classified under IFRS 5"],
  a:1, e:"The commencement of an operating lease is one of the changes in use specifically named in the standard: the property moves from inventories to investment property. Under the fair value model, the difference between carrying amount and fair value at the date of transfer goes to profit or loss."}
]
},

{
code: "IAS 23", slug: "ias23", topic: "assets",
title: "Borrowing Costs",
titleEn: "Затраты по займам",
tags: ["capitalisation of interest", "qualifying asset", "capitalisation rate", "suspension"],
one: "Interest on borrowings taken to build a long-lived asset becomes part of its cost — but only while construction is actually happening.",
why: [
 {p:"If a plant takes three years to build, the interest over those years is as much a cost of creating it as the concrete and the contractor's labour. Expensing it would understate the asset and distort the profit of the construction years."},
 {p:"Capitalisation here is an **obligation**, not an option. A choice exists only for qualifying assets measured at fair value and for inventories manufactured in large quantities on a repetitive basis."}
],
rules: [
 {h:"Qualifying asset", p:"An asset that **necessarily takes a substantial period of time** to get ready for its intended use or sale. Usually a year or more. Mass-produced inventories and assets ready for use on purchase do not qualify."},
 {h:"Commencement", p:"Three conditions together: expenditure on the asset is being incurred, borrowing costs are being incurred, and activities to prepare the asset have begun."},
 {h:"Suspension", p:"Capitalisation is suspended during extended periods in which active development is interrupted. The exception is a delay inherent in the process — waiting for concrete to cure, or a seasonal river flood allowed for in the plan."},
 {h:"Cessation", p:"When substantially all the activities necessary to prepare the asset are complete. Where parts are usable independently, each part has its own date."},
 {h:"Specific borrowings", p:"Capitalise the actual borrowing costs **less** any investment income earned on temporary investment of the unused funds from that borrowing."},
 {h:"General borrowings", p:"Apply a **capitalisation rate** — the weighted average cost of general borrowings — to the expenditure on the asset. The amount capitalised cannot exceed actual borrowing costs for the period."}
],
example: [
 {h:"A specific borrowing"},
 {p:"On 1 April 2025 a $400m loan at 9% was drawn specifically to build a workshop. Construction runs from 1 April to 31 December. Unused funds sat on deposit in April and May and earned $3.5m."},
 {table:{head:["Calculation","Amount"],rows:[
  ["Borrowing costs for nine months: 400 × 9% × 9/12","$27.0m"],
  ["Less investment income","($3.5m)"],
  ["**Capitalised into the cost of the workshop**","**$23.5m**"]
 ]}},
 {h:"General borrowings and the capitalisation rate"},
 {p:"The entity has two general borrowings: $600m at 8% and $400m at 11%. There are no specific borrowings. Spending on a warehouse: $200m on 1 January and $300m on 1 July. Construction runs all year."},
 {table:{head:["Step","Calculation","Result"],rows:[
  ["Capitalisation rate","(600×8% + 400×11%) / 1,000 = (48 + 44)/1,000","**9.2%**"],
  ["Weighted expenditure on the asset","200 × 12/12 + 300 × 6/12","$350m"],
  ["Borrowing costs capitalised","350 × 9.2%","**$32.2m**"],
  ["Check: actual borrowing costs","48 + 44","$92m — cap not breached"]
 ]}},
 {h:"Suspension"},
 {p:"In the same project, work stopped from 1 August to 30 September because of a dispute with the contractor. Those two months are excluded: capitalisation is suspended and the interest is expensed. Had the pause been, say, a technically required curing period, capitalisation would have continued."}
],
pitfalls: [
 "Capitalising interest after the asset is ready for use — even if it has not been switched on.",
 "Forgetting to deduct investment income on a specific borrowing. No such deduction is made for general borrowings.",
 "Treating equipment bought ready to use as a qualifying asset — there is no lengthy preparation.",
 "Applying the capitalisation rate to the full year's expenditure rather than the time-weighted average."
],
quiz: [
 {q:"A $300m loan at 10% was drawn specifically on 1 March. Construction ran from 1 May to 30 November. Idle funds earned $2m in March and April. How much is capitalised?",
  a:"$17.5m",
  e:"Capitalisation starts only on 1 May, when activities began. The period is May to November, seven months: 300 × 10% × 7/12 = $17.5m. Interest for March and April ($5m) is expensed, and the $2m of income for that same window also goes to profit or loss: only income earned during the capitalisation period is deducted."},
 {q:"Which is NOT a qualifying asset under IAS 23?",
  opts:["A ship under construction over two years","A factory building being erected","Wine maturing over three years","A machine purchased ready for use"],
  a:3, e:"An asset ready for its intended use on purchase requires no substantial period of preparation. The other three do — including the wine, which is surprising but fits the definition exactly."},
 {q:"Is capitalisation of borrowing costs on a qualifying asset mandatory?",
  opts:["No, it is an accounting policy choice","Yes, except for assets at fair value and repetitively produced inventories","Yes, without exception","Only above a materiality threshold"],
  a:1, e:"Capitalisation is required. IAS 23 permits an entity not to capitalise only for qualifying assets measured at fair value (biological assets, for instance) and for inventories manufactured in large quantities on a repetitive basis."}
]
},

{
code: "IAS 20", slug: "ias20", topic: "assets",
title: "Government Grants",
titleEn: "Государственные субсидии",
tags: ["grant", "deferred income", "concessional loan", "matching", "repayment"],
one: "A grant is recognised as income in the same periods as the costs it compensates — never all at once and never in equity.",
why: [
 {p:"Governments give money on conditions. So a grant is not recognised until there is **reasonable assurance** of two things: that the entity will comply with the conditions and that the grant will be received."},
 {p:"The second principle is **matching**: a grant towards a machine is spread over the machine's depreciation; a wage subsidy is recognised in the period of those wages."}
],
rules: [
 {h:"Recognition condition", p:"Reasonable assurance that (1) the entity will comply with the conditions and (2) the grant will be received. Receiving the cash does not by itself prove compliance."},
 {h:"Asset-related grants — two methods", p:"**Deferred income**: the grant is a liability released to profit over the asset's depreciation. **Deduction from the asset**: the grant reduces the carrying amount and the effect comes through lower depreciation. Annual profit is identical; the balance sheet and disclosures differ."},
 {h:"Income-related grants", p:"Recognised in profit or loss in the period of the related costs. They may be shown as other income or deducted from the related expense."},
 {h:"Compensation for past costs", p:"A grant receivable as compensation for costs already incurred, or for immediate financial support with no future related costs, is recognised in profit or loss **in the period it becomes receivable**."},
 {h:"Never in equity", p:"IAS 20 expressly forbids crediting a grant directly to equity. It is not a transaction with an owner."},
 {h:"Concessional government loan", p:"Accounted for under IFRS 9: recognised at fair value using a market rate. The difference between the proceeds and that fair value is a government grant under IAS 20."},
 {h:"Repayment of a grant", p:"Treated as a change in estimate (prospectively). Under the deferred income method it first reduces the remaining deferred income, with any excess expensed. Under the deduction method it increases the carrying amount of the asset, and the cumulative extra depreciation is expensed immediately."}
],
example: [
 {h:"Two methods, the same numbers"},
 {p:"On 1 January a grant of $60m was received towards equipment costing $300m with a five-year life and straight-line depreciation."},
 {table:{head:["","Deferred income method","Deduction from asset"],rows:[
  ["PPE at 1 January","300","240"],
  ["Liability (deferred income)","60","—"],
  ["Depreciation for the year","60","48"],
  ["Grant income for the year","12","—"],
  ["**Net effect on profit**","**(48)**","**(48)**"],
  ["Net assets at 31 December","240 − 48 = 192","240 − 48 = 192"]
 ],note:"Profit and net assets are identical. What differs is the balance sheet total and the lines presented: the first method shows both the asset and the liability in full."}},
 {je:{title:"Deferred income method, year one",lines:[["Dr","Cash","60,000,000"],["Cr","Deferred income (grant)","60,000,000"],["Dr","Deferred income","12,000,000"],["Cr","Other income","12,000,000"]],note:"Deferred income is split between non-current (48) and current (12)."}},
 {h:"A concessional loan"},
 {p:"The government lent $100m at 2% for five years; the market rate for this entity is 10%. The present value of the liability at the market rate is $69.7m."},
 {table:{head:["Component","Amount"],rows:[
  ["Cash received","$100m"],
  ["Fair value of the liability (IFRS 9)","$69.7m"],
  ["**Government grant (IAS 20)**","**$30.3m**"]
 ],note:"The $30.3m is recognised under IAS 20 against the conditions for which the loan was given. The liability is then measured at amortised cost using the 10% effective rate."}}
],
pitfalls: [
 "Recognising the whole grant as income when the cash arrives.",
 "Crediting the grant directly to equity — an express prohibition.",
 "Missing the grant element inside a concessional government loan.",
 "Accounting for a repayment retrospectively. It is a change in estimate and therefore prospective."
],
quiz: [
 {q:"A $45m grant relates to a $225m asset with a nine-year life, using the deferred income method. What appears as the current portion of deferred income one year after receipt?",
  a:"$5m",
  e:"Annual release = 45/9 = $5m. A year later $40m of deferred income remains, of which $5m will be recognised within the next twelve months (current) and $35m thereafter (non-current)."},
 {q:"An entity received $20m as compensation for retraining costs already incurred last year, with no future obligations. Recognition:",
  opts:["Evenly over five years","In full in profit or loss when it becomes receivable","In equity","As a reduction in the cost of PPE"],
  a:1, e:"The grant compensates costs already incurred and relates to no future costs. There is nothing to match it against, so it is recognised immediately once receivable — and disclosed separately if material."},
 {q:"Compared with the deferred income method, deducting the grant from the cost of the asset means:",
  opts:["Higher profit","Lower profit","The same profit but a smaller balance sheet total","Higher depreciation"],
  a:2, e:"The net effect on profit is identical: lower depreciation instead of full depreciation plus grant income. But the asset and the liability are shown net, so the balance sheet total is smaller — which visibly affects return on assets."}
]
},

{
code: "IAS 41", slug: "ias41", topic: "assets",
title: "Agriculture",
titleEn: "Сельское хозяйство",
tags: ["biological assets", "agricultural produce", "fair value less costs to sell", "bearer plants", "harvest"],
one: "Living plants and animals are carried at fair value less costs to sell, with every change going through profit or loss — before harvest, not after.",
why: [
 {p:"A calf grows into a cow and a seedling becomes a tree without anyone buying or selling anything. Historical cost cannot describe that: the value changes through biological transformation, not through transactions."},
 {p:"IAS 41 therefore abandons cost for living assets and measures them at fair value less costs to sell at every reporting date, taking the movement straight to profit or loss."}
],
rules: [
 {h:"Biological asset", p:"A living animal or plant: dairy cattle, sheep, growing crops, fish in a farm, vines and trees in a plantation before they become bearer plants."},
 {h:"Agricultural produce", p:"The harvested product of a biological asset: milk, wool, picked apples, felled logs, harvested grain."},
 {h:"Measurement of biological assets", p:"**Fair value less costs to sell** at initial recognition and at each reporting date. Gains and losses go to **profit or loss**. If fair value cannot be measured reliably on initial recognition (rare), cost less depreciation and impairment is used until it can."},
 {h:"Measurement of produce", p:"At the **point of harvest**, at fair value less costs to sell. That amount then becomes the cost for IAS 2, and the produce continues under IAS 2 thereafter."},
 {h:"Bearer plants are not here", p:"A bearer plant — an apple tree, a grape vine — is used to grow produce over many periods and is accounted for under **IAS 16** as PPE. The fruit growing on it is still a biological asset under IAS 41."},
 {h:"Two components of the gain", p:"The change in fair value is disclosed split between the **physical change** (growth, birth, death) and the **price change**. Growth is the operating story; price is the market's."},
 {h:"Government grants", p:"An unconditional grant relating to a biological asset at fair value less costs to sell is recognised in profit or loss when receivable — not under the IAS 20 matching approach. A conditional grant is recognised when the conditions are met."}
],
example: [
 {h:"A dairy herd through the year"},
 {p:"At 1 January a herd of 200 dairy cows had a fair value less costs to sell of $1.8m. During the year 30 calves were born. At 31 December the herd (230 animals) has a fair value less costs to sell of $2.15m. No animals were bought or sold."},
 {table:{head:["Component","Calculation","$"],rows:[
  ["Fair value less costs to sell at 31 December","230 animals","2,150,000"],
  ["Fair value less costs to sell at 1 January","200 animals","(1,800,000)"],
  ["**Gain recognised in profit or loss**","","**350,000**"],
  ["of which physical change (births and growth)","","240,000"],
  ["of which price change","","110,000"]
 ],note:"Nothing was sold, yet $350,000 of profit is recognised. That is the point of the standard: biological transformation is the economic event, not the sale."}},
 {je:{title:"Year-end entry for the herd",lines:[["Dr","Biological assets","350,000"],["Cr","Gain on biological assets (P&L)","350,000"]],note:"No depreciation is charged on a biological asset measured at fair value less costs to sell."}},
 {h:"Where IAS 41 stops and IAS 2 starts"},
 {p:"Milk is drawn on 20 December. Its fair value less costs to sell at that moment is $40,000."},
 {table:{head:["Stage","Standard","Measurement"],rows:[
  ["Cows in the field","IAS 41","Fair value less costs to sell, movements to profit"],
  ["Milk at the moment of milking","IAS 41","Fair value less costs to sell — $40,000, gain to profit"],
  ["Milk in the tank afterwards","**IAS 2**","Deemed cost $40,000, then lower of cost and NRV"],
  ["Cheese made from the milk","IAS 2","$40,000 plus conversion costs"]
 ],note:"The point of harvest is the handover from IAS 41 to IAS 2. After it, no more fair value gains arise."}},
 {h:"An orchard"},
 {table:{head:["Item","Classification","Standard"],rows:[
  ["Apple trees in the orchard","Bearer plant","IAS 16 — cost or revaluation, depreciated"],
  ["Apples growing on the trees","Biological asset","IAS 41 — fair value less costs to sell"],
  ["Apples once picked","Agricultural produce, then inventory","IAS 41 at harvest, then IAS 2"],
  ["Trees grown to be cut and sold as timber","Biological asset","IAS 41 — they are not bearer plants"]
 ]}}
],
pitfalls: [
 "Depreciating a biological asset measured at fair value less costs to sell.",
 "Carrying an apple tree under IAS 41. Since the 2014 amendment, bearer plants are PPE under IAS 16 — but their fruit is still IAS 41.",
 "Continuing to remeasure produce at fair value after harvest. At harvest it becomes inventory and IAS 2 takes over.",
 "Deferring a grant on a biological asset at fair value over the asset's life; an unconditional grant is recognised in profit when receivable.",
 "Deducting costs to sell twice — once inside fair value and again as costs to sell."
],
quiz: [
 {q:"A plantation of timber trees grown to be felled and sold is accounted for under:",
  opts:["IAS 16 as a bearer plant","IAS 41 as a biological asset","IAS 2 as inventory","IAS 40 as investment property"],
  a:1, e:"A bearer plant is held to produce *produce* over several periods, like an apple tree. Trees grown to be cut down and sold as timber are themselves the product, so they remain biological assets at fair value less costs to sell until felled."},
 {q:"At harvest, wool has a fair value less costs to sell of $80,000; the entity sells it two months later for $95,000. What is recognised at harvest and on sale?",
  a:"$80,000 gain at harvest; $15,000 profit on sale",
  e:"At harvest the produce is measured at fair value less costs to sell ($80,000) with the gain in profit or loss, and that amount becomes deemed cost under IAS 2. The later sale at $95,000 generates ordinary revenue with a cost of sales of $80,000, so a further $15,000 of margin. The economic result is split between the farming activity and the trading activity."},
 {q:"How is the change in fair value of a herd disclosed?",
  opts:["As a single net figure only","Split between physical change and price change","Split between realised and unrealised","Not disclosed separately from revenue"],
  a:1, e:"IAS 41 encourages, and in practice preparers provide, the split between physical change (growth, births, deaths) and price change. It separates what the farm did from what the market did — two very different stories inside one number."}
]
},

{
code: "IFRS 5", slug: "ifrs5", topic: "assets",
title: "Assets Held for Sale and Discontinued Operations",
titleEn: "Внеоборотные активы для продажи и прекращённая деятельность",
tags: ["held for sale", "discontinued operation", "depreciation ceases", "disposal group"],
one: "An asset about to be sold stops being depreciated and moves to its own line in current assets at the lower of two measures.",
why: [
 {p:"A reader must be able to tell apart the business that will keep generating cash and the part being wound down. Otherwise forecasts are built on mixed data."},
 {p:"So IFRS 5 does two things: it moves such assets to separate lines in the statement of financial position, and it shows the result of a discontinued operation as a **single line** below profit from continuing operations."}
],
rules: [
 {h:"Classification criteria", p:"The carrying amount will be recovered **principally through sale** rather than use. Both are needed: the asset is available for immediate sale in its present condition, and the sale is **highly probable** (management is committed, an active search has begun, the price is reasonable, and the sale is expected within twelve months)."},
 {h:"Measurement", p:"The **lower** of carrying amount and fair value less costs to sell. Any loss goes to profit or loss."},
 {h:"Depreciation ceases", p:"From the date of classification. That holds even if the asset continues to be used until it is sold."},
 {h:"Presentation in the statement of financial position", p:"A separate line within **current assets** (and a separate line for the liabilities of a disposal group). Offsetting is prohibited. Comparative statements of financial position are **not** restated."},
 {h:"Discontinued operation", p:"A component disposed of or classified as held for sale that represents a **separate major line of business** or geographical area, or is a subsidiary acquired exclusively with a view to resale."},
 {h:"Presentation in profit or loss", p:"A single line: post-tax profit or loss of the discontinued operation, including any remeasurement and disposal gain or loss. Comparative profit or loss **is** restated so the prior year shows it separately too."},
 {h:"Excluded from IFRS 5 measurement", p:"Deferred tax, employee benefit assets, IFRS 9 financial instruments, investment property at fair value and biological assets at fair value continue under their own standards."},
 {h:"If the sale falls through", p:"The asset returns to its previous category at the **lower** of the carrying amount it would have had without the classification (with depreciation caught up) and its recoverable amount at the date of the decision not to sell."}
],
example: [
 {h:"Classification and measurement"},
 {p:"On 1 September 2025 the board approved a plan to sell a building, a broker was engaged, the price is at market, and the sale is expected in March 2026. At 1 September: cost $400m, accumulated depreciation $160m, useful life 20 years. Fair value less costs to sell is $226m."},
 {table:{head:["Step","Calculation","Amount"],rows:[
  ["Carrying amount at 1 September","400 − 160","240"],
  ["Fair value less costs to sell","—","226"],
  ["IFRS 5 measurement = lower","—","**226**"],
  ["Impairment loss","240 − 226","**(14) to profit or loss**"],
  ["Depreciation from 1 September to 31 December","—","**0**"],
  ["In the statement of financial position at 31.12.2025","Current assets, separate line","226"]
 ],note:"Without classification, September to December would have carried 400/20 × 4/12 = $6.7m of depreciation. None is charged."}},
 {h:"A discontinued operation in profit or loss"},
 {p:"The group sold its entire retail division — a separate major line of business."},
 {table:{head:["Statement of profit or loss","2025","2024 (restated)"],rows:[
  ["Revenue (continuing operations)","8,400","7,900"],
  ["Cost of sales and expenses","(7,100)","(6,800)"],
  ["**Profit from continuing operations**","**1,300**","**1,100**"],
  ["Profit for the year from discontinued operations (post-tax)","185","240"],
  ["**Profit for the year**","**1,485**","**1,340**"]
 ],note:"The comparative profit or loss is restated so the division is shown separately for 2024 as well. The comparative statement of financial position is NOT restated — those assets stay in their normal lines."}}
],
pitfalls: [
 "Continuing to depreciate an asset classified as held for sale.",
 "Restating the comparative statement of financial position. Only profit or loss is restated.",
 "Classifying an asset that can only be sold once refurbishment is complete: it is not available for immediate sale.",
 "Calling the sale of one workshop or machine a discontinued operation — it must be a separate major line of business or geographical area.",
 "Presenting the assets and liabilities of a disposal group net, as one figure."
],
quiz: [
 {q:"An asset classified as held for sale has a carrying amount of 500, fair value of 560 and costs to sell of 20. Measurement:",
  opts:["560","540","500","480"],
  a:2, e:"The lower of carrying amount 500 and (560 − 20) = 540, so 500. IFRS 5 does not permit writing the asset up to fair value; any gain arises only on actual sale."},
 {q:"An entity decides to sell one of its 40 identical stores. Is that a discontinued operation?",
  opts:["Yes, any disposal of a component","No — it is not a separate major line of business or geographical area","Yes, if the store's revenue is material","Only if the store is loss-making"],
  a:1, e:"One store out of forty is not a separate major line of business or geographical area. Its assets may well be classified as held for sale under IFRS 5, but the result stays inside continuing operations."},
 {q:"An asset was classified as held for sale in October and the plan was abandoned in February of the following year. How is it measured at the date of abandonment?",
  a:"At the lower of the carrying amount it would have had without classification (with depreciation caught up) and its recoverable amount",
  e:"The asset must be put back as though it had never been classified: depreciation for October to February is caught up and any impairment considered. If recoverable amount at the date of abandonment is lower than that figure, recoverable amount is used. The adjustment is recognised in the same line of profit or loss used for the original classification effects."}
]
},

{
code: "IFRS 16", slug: "ifrs16", topic: "oblig",
title: "Leases",
titleEn: "Аренда",
tags: ["lease", "right-of-use asset", "lease liability", "discounting", "sale and leaseback"],
one: "Almost every lease goes on the lessee's balance sheet: a right-of-use asset and a liability for the future payments.",
why: [
 {p:"Before IFRS 16 companies kept billions of obligations off balance sheet by calling leases operating. An airline could show no aircraft and look debt-free. The standard closed the gap: for a lessee, the operating/finance split is **gone**."},
 {p:"A side effect worth understanding: lessees' EBITDA jumped, because a single rental expense was replaced by depreciation and interest, both of which sit below EBITDA."}
],
rules: [
 {h:"What a lease is", p:"A contract conveying the **right to control the use of an identified asset** for a period in exchange for consideration. Control = the right to obtain substantially all the benefits + the right to direct how the asset is used."},
 {h:"Lessee accounting", p:"The liability is the present value of future lease payments at the rate implicit in the lease, or the incremental borrowing rate. The asset is the liability + prepayments + initial direct costs + dismantling costs − lease incentives received."},
 {h:"Two exemptions", p:"Short-term leases (12 months or less with no purchase option) and leases of **low-value assets** (a guide of around $5,000 when new: laptops, furniture). Payments are then expensed on a straight-line basis."},
 {h:"Lease term", p:"The non-cancellable period + option periods where the entity is **reasonably certain** to extend + periods covered by a termination option it is reasonably certain not to exercise."},
 {h:"Variable payments", p:"Those depending on an index or rate are included at the current index level. Those depending on sales or usage are **excluded** and expensed as incurred."},
 {h:"Lessor accounting", p:"The split survives. A **finance lease** transfers substantially all the risks and rewards; the asset is replaced by a receivable for the net investment. An **operating lease** keeps the asset with the lessor and income is recognised on a straight-line basis."},
 {h:"Sale and leaseback", p:"First test under IFRS 15 whether a sale occurred. If it did, the seller-lessee recognises a gain only on the **rights transferred to the buyer** and retains an asset for the right of use retained. If no sale occurred, the transaction is a financing arrangement."}
],
example: [
 {h:"The lessee's calculation"},
 {p:"A four-year equipment lease, $300k payable at the end of each year, incremental borrowing rate 8%. Initial direct costs of the lessee are $20k."},
 {table:{head:["Step","Calculation","$k"],rows:[
  ["Annuity factor, 4 years, 8%","—","3.3121"],
  ["Liability at recognition","300 × 3.3121","993.6"],
  ["Right-of-use asset","993.6 + 20","1,013.6"],
  ["Annual depreciation","1,013.6 / 4","253.4"]
 ],note:"Depreciate over the shorter of the lease term and the useful life; if ownership is reasonably certain to transfer, use the useful life."}},
 {h:"The liability table"},
 {table:{head:["Year","Opening","Interest at 8%","Payment","Closing"],rows:[
  ["1","993.6","79.5","(300)","773.1"],
  ["2","773.1","61.8","(300)","534.9"],
  ["3","534.9","42.8","(300)","277.7"],
  ["4","277.7","22.3","(300)","0.0"]
 ],note:"At the end of year 1 the split is: non-current 534.9 (the closing balance of year 2) and current 773.1 − 534.9 = 238.2."}},
 {h:"Why the expense profile changes"},
 {table:{head:["Year","Depreciation","Interest","Total expense","Straight-line rental would be"],rows:[
  ["1","253.4","79.5","**332.9**","300"],
  ["2","253.4","61.8","315.2","300"],
  ["3","253.4","42.8","296.2","300"],
  ["4","253.4","22.3","**275.7**","300"]
 ],note:"The four-year total is the same (1,220), but the expense is front-loaded. Worth remembering in analysis: profit is lower in the first year of a lease."}},
 {h:"The exemption"},
 {p:"The same entity leases 50 laptops for $30k a year each over three years. Each laptop is worth about $800 new — a low-value asset. The test is applied **asset by asset**, not to the contract total, so the exemption applies: $1.5m of expense a year and nothing on the balance sheet."}
],
pitfalls: [
 "Testing the low-value exemption against the total contract value instead of the value of an individual asset.",
 "Excluding an extension option from the lease term when the entity is reasonably certain to exercise it.",
 "Including sales-based variable payments in the liability. They are expensed as incurred.",
 "Depreciating the right-of-use asset over the asset's useful life when ownership will not pass: the lease term is shorter and governs.",
 "Forgetting to split the liability. The current portion is the difference between the present balance and the balance a year later, not the next payment."
],
quiz: [
 {q:"A five-year lease, 200 payable at each year end, rate 10%, annuity factor 3.7908. What is the lease liability on initial recognition?",
  a:"758.2",
  e:"200 × 3.7908 = 758.2. That is the liability; the right-of-use asset equals it plus any prepayments, initial direct costs and dismantling costs, less lease incentives received."},
 {q:"Which payment is NOT included in the measurement of the lease liability?",
  opts:["A fixed monthly payment","A payment linked to the consumer price index","A payment of 2% of the store's revenue","The exercise price of a purchase option the entity is reasonably certain to exercise"],
  a:2, e:"Variable payments based on sales or usage do not meet the definition of a liability at commencement — the entity can avoid them by not trading. They are expensed as incurred. Index-linked payments are included at the index level at the measurement date."},
 {q:"An office lease has a five-year non-cancellable term plus a five-year extension option. The entity spent $200m on non-removable leasehold improvements and there are no alternative premises in the city. What is the lease term under IFRS 16?",
  a:"Ten years",
  e:"Significant leasehold improvements and the absence of alternatives are classic economic incentives that make extension reasonably certain. The lease term is therefore ten years: both the liability and the right-of-use asset are measured over ten years of payments, materially more than a naive five-year calculation."}
]
},
