one: "Two different worlds: lose control and you recognise a gain in profit or loss; keep control and it is only a movement within equity.",
why: [
 {p:"Selling shares in a subsidiary looks like one transaction, but IFRS treats it in two entirely different ways depending on whether control survives. Get that fork wrong and the error usually runs to hundreds of millions."},
 {p:"There is also a second trap: the gain in the **parent's own** accounts and the gain in the **consolidated** accounts are different numbers, because the group has been consolidating the subsidiary's profits and goodwill all along."}
],
rules: [
 {h:"The fork", p:"**Control lost** → derecognise everything, recognise a gain or loss in profit or loss. **Control retained** → a transaction with owners: adjust the NCI and the parent's equity, with no gain or loss."},
 {h:"Gain on loss of control (consolidated)", p:"Fair value of consideration received + fair value of any retained interest − (net assets of the subsidiary at the date of disposal + remaining goodwill − NCI at the date of disposal) ± reserves recycled from OCI."},
 {h:"Retained interest", p:"Remeasured to **fair value** at the date control is lost. That fair value becomes the cost of the new associate (IAS 28) or financial asset (IFRS 9), and the remeasurement is part of the gain."},
 {h:"Recycling from OCI", p:"On loss of control, reclassifiable reserves relating to that subsidiary — chiefly the foreign currency translation reserve — are transferred to profit or loss. A revaluation surplus is instead transferred to retained earnings."},
 {h:"Gain in the parent's separate statements", p:"Proceeds − the carrying amount of the investment in the parent's own books (usually cost). This figure is almost always different from the group gain and is **not** what appears in the consolidated statements."},
 {h:"Results up to the date of disposal", p:"The subsidiary is consolidated line by line up to the date control is lost, then removed. If it is a separate major line of business, IFRS 5 requires its results and the disposal gain to be presented as a **discontinued operation**."},
 {h:"Deemed disposal", p:"A parent's interest can fall without it selling anything — for example when the subsidiary issues shares to others. The same two-way test applies: if control survives, it is an equity movement; if not, it is a disposal."},
 {h:"Partial disposal retaining control", p:"Adjustment to the parent's equity = proceeds − the change in the NCI (share of net assets, including goodwill under the full goodwill method). Nothing goes through profit or loss."}
],
example: [
 {h:"Full disposal with loss of control"},
 {p:"P sold its entire 80% holding in S for $1,400m. At the date of disposal S's net assets were $1,200m, unimpaired goodwill was $150m, and the NCI stood at $240m. A foreign currency translation reserve of $60m (a gain) relates to S. P's cost of investment in its own books was $900m."},
 {table:{head:["Consolidated gain","$m"],rows:[
  ["Fair value of consideration received","1,400"],
  ["Less net assets disposed of","(1,200)"],
  ["Less remaining goodwill","(150)"],
  ["Add back NCI derecognised","240"],
  ["Add translation reserve recycled","60"],
  ["**Gain in the consolidated statement**","**350**"]
 ]}},
 {table:{head:["Gain in P's separate statements","$m"],rows:[
  ["Proceeds","1,400"],
  ["Cost of the investment","(900)"],
  ["**Gain in P's own accounts**","**500**"]
 ],note:"Two correct answers to two different questions. The group figure is lower because the group has already recognised S's post-acquisition profits year by year; P's own accounts recognise all of it at once."}},
 {h:"Disposal with a retained interest"},
 {p:"P sold 50 of its 80 percentage points for $900m, retaining 30% — significant influence, so an associate. The fair value of the retained 30% at that date is $520m. Net assets $1,200m, goodwill $150m, NCI $240m, no OCI reserves."},
 {table:{head:["Calculation","$m"],rows:[
  ["Consideration received","900"],
  ["Fair value of the retained 30%","520"],
  ["Less net assets disposed of","(1,200)"],
  ["Less goodwill","(150)"],
  ["Add back NCI","240"],
  ["**Gain in profit or loss**","**310**"]
 ],note:"The retained interest enters the associate at $520m — its fair value, not 30% of its old carrying amount. From that date the equity method applies."}},
 {h:"Partial disposal retaining control"},
 {p:"P sold 15 percentage points for $300m, going from 90% to 75%. Net assets plus goodwill at that date are $1,600m."},
 {table:{head:["Calculation","$m"],rows:[
  ["Proceeds","300"],
  ["Increase in NCI: 1,600 × 15%","(240)"],
  ["**Credit to the parent's equity**","**60**"]
 ],note:"No gain in profit or loss, no remeasurement, no recycling. IFRS 10 treats this as a transaction between owners, and the $60m sits in a separate reserve or retained earnings."}}
],
pitfalls: [
 "Recognising a gain in profit or loss on a partial disposal where control is retained.",
 "Reporting the parent's own gain (proceeds less cost) in the consolidated statements.",
 "Leaving the retained interest at a proportion of its old carrying amount instead of remeasuring it to fair value.",
 "Forgetting to recycle the foreign currency translation reserve relating to the subsidiary.",
 "Forgetting to add back the NCI when computing the gain — it is derecognised along with the net assets.",
 "Consolidating the subsidiary for the whole year rather than only up to the date control was lost."
],
quiz: [
 {q:"P disposes of its 60% holding. Proceeds 800, net assets at disposal 900, goodwill 120, NCI 360, no OCI reserves. What is the consolidated gain or loss?",
  a:"A gain of 140",
  e:"800 − 900 − 120 + 360 = 140. Adding back the NCI is the step most often missed: the group derecognises 100% of the net assets, but 360 of them never belonged to the parent's owners in the first place."},
 {q:"P reduces its holding from 80% to 60% and retains control. How is the difference between the proceeds and the change in NCI treated?",
  opts:["A gain in profit or loss","A gain in other comprehensive income","An adjustment to the parent's equity","An adjustment to goodwill"],
  a:2, e:"With control retained, IFRS 10 treats the transaction as one between owners. Nothing passes through profit or loss and goodwill is not touched; only the split of equity between the parent's owners and the NCI changes."},
 {q:"On losing control, P retains a 25% interest previously carried within the consolidation. At what amount does the retained interest enter the accounts?",
  a:"At its fair value on the date control was lost",
  e:"IFRS 10 requires the retained interest to be remeasured to fair value at that date, with the remeasurement forming part of the gain or loss on disposal. That fair value then becomes the deemed cost of the associate under IAS 28 or of the financial asset under IFRS 9, and the equity method or IFRS 9 applies from that point on."}
]
},

{
code: "IAS 28", slug: "ias28", topic: "group",
title: "Investments in Associates and Joint Ventures",
titleEn: "Инвестиции в ассоциированные организации и совместные предприятия",
tags: ["significant influence", "equity method", "associate", "20%", "one-line consolidation"],
one: "Where there is significant influence (the 20% guide), the investment is carried on one line that grows with the investor's share of profits.",
why: [
 {p:"Between 'just some shares' and 'a subsidiary' lies a middle case: you can influence but you cannot direct. Consolidation is wrong (there is no control), but carrying the investment at cost is wrong too — the investee is earning."},
 {p:"The equity method is the compromise: **one line in the balance sheet** and **one line in profit or loss**. It is sometimes called one-line consolidation."}
],
rules: [
 {h:"Significant influence", p:"The power to participate in financial and operating policy decisions, without control. Presumption: **20% or more** of the votes means influence; below 20% it does not. Both presumptions are rebuttable."},
 {h:"Indicators below 20%", p:"Board representation, participation in policy-making, material transactions between the parties, interchange of management personnel, provision of essential technical information."},
 {h:"The equity method", p:"Initially at cost; thereafter the carrying amount is **increased by the share of profit** (and of OCI) and **reduced by dividends received**."},
 {h:"In profit or loss", p:"A single line — 'share of profit of associates' — **after tax**, presented before profit for the period. The associate's revenue and expenses are not added to the investor's."},
 {h:"Adjustments", p:"The share is taken from profit after adjusting for extra depreciation on acquisition-date fair values and for unrealised profit on transactions between investor and investee (to the extent of the investor's interest)."},
 {h:"Losses", p:"Recognised until the carrying amount reaches **zero** (including long-term interests that are in substance part of the investment). Beyond that, only if there is an obligation to fund losses."},
 {h:"Impairment", p:"The whole investment — including the goodwill inside it — is tested as a **single asset** under IAS 36. The goodwill component is neither shown separately nor tested separately."},
 {h:"Joint ventures", p:"Under IFRS 11 a joint venture is equity accounted in the same way. Proportionate consolidation is prohibited."},
 {h:"Exemptions", p:"The method need not be applied where the investment is classified as held for sale under IFRS 5, or where the investor is a venture capital organisation measuring it at FVTPL."}
],
example: [
 {h:"Movement in the carrying amount"},
 {p:"On 1 January 2025, 30% of Agate was acquired for $400m. Agate's 2025 profit was $200m, its OCI was $30m, and it paid dividends of $50m."},
 {table:{head:["Component","Calculation","$m"],rows:[
  ["Cost of the investment","","400"],
  ["Share of profit","200 × 30%","+60"],
  ["Share of OCI","30 × 30%","+9"],
  ["Dividends received","50 × 30%","(15)"],
  ["**Carrying amount at 31 December 2025**","","**454**"]
 ],note:"Group profit or loss shows 'share of profit of associates — 60'; OCI shows 9. Dividends are NOT income — they reduce the investment, otherwise the profit would be counted twice."}},
 {h:"Adjusting for fair values"},
 {p:"On acquisition it emerged that Agate's buildings were undervalued by $120m with a remaining life of 20 years."},
 {table:{head:["Measure","Calculation","Amount"],rows:[
  ["Agate's reported profit","","200"],
  ["Extra depreciation","120 / 20","(6)"],
  ["Adjusted profit","","194"],
  ["**Investor's share**","194 × 30%","**58.2**"]
 ]}},
 {h:"Unrealised profit"},
 {p:"The investor sold goods to Agate for $100m at a profit of $25m, all still in Agate's inventory. The **investor's share** is eliminated: 25 × 30% = $7.5m, reducing both the share of profit and the carrying amount of the investment."},
 {h:"Three regimes side by side"},
 {table:{head:["Influence","Holding (guide)","Accounting","Line in profit or loss"],rows:[
  ["Control","> 50%","Line-by-line consolidation","All income and expenses + NCI"],
  ["Significant influence","20–50%","Equity method","One line, post-tax"],
  ["Joint control (JV)","Per the agreement","Equity method","One line, post-tax"],
  ["Joint operation","Per the agreement","Own share of assets, liabilities, income, expenses","Line by line, at the entity's share"],
  ["No influence","< 20%","IFRS 9: FVTPL or FVOCI","Dividends and remeasurement"]
 ]}}
],
pitfalls: [
 "Recognising dividends received as income — they are a return of part of the investment.",
 "Adding the associate's revenue to your own. There is no line-by-line consolidation.",
 "Presenting the share of profit before tax. The line is always after the investee's tax.",
 "Testing the goodwill inside the investment separately — the whole investment is tested as one asset.",
 "Continuing to recognise losses once the carrying amount has reached zero.",
 "Applying proportionate consolidation to a joint venture — prohibited since IFRS 11."
],
quiz: [
 {q:"An investor holds 25%; the investee made a loss of $400m. The carrying amount of the investment is $80m and there are no other interests. What loss is recognised?",
  a:"$80m",
  e:"The share of the loss is 400 × 25% = $100m, but recognition is limited to the $80m carrying amount. The unrecognised $20m is remembered: if the investee returns to profit, the investor resumes recognising its share only once those unrecognised losses have been covered."},
 {q:"An entity holds 15% of the shares and has two of the seven board seats, actively shaping dividend policy. How should it account for the holding?",
  opts:["As a financial asset under IFRS 9","Using the equity method as an associate","Consolidate it","At cost"],
  a:1, e:"The 'below 20% means no influence' presumption is rebuttable. Board representation and participation in policy-making are indicators of significant influence named in IAS 28. Substance beats the 15%."},
 {q:"How do dividends received from an associate affect the consolidated statement of profit or loss?",
  a:"Not at all",
  e:"The investee's profit was already recognised through the share of profit when it was earned. A dividend distributes profit that has been recognised, so it merely reduces the carrying amount of the investment. Recognising it as income too would double count. In the statement of cash flows, however, it appears as a genuine cash inflow."}
]
},

{
code: "IFRS 11", slug: "ifrs11", topic: "group",
title: "Joint Arrangements",
titleEn: "Совместное предпринимательство",
tags: ["joint control", "joint operation", "joint venture", "unanimous consent"],
one: "Splits joint arrangements in two: in a joint operation you account for your share of the assets line by line, in a joint venture on one line.",
why: [
 {p:"Two partners set up a project. Sometimes they share specific assets — a well, a pipeline; sometimes they share only the net result of a separate legal entity. IFRS 11 says the accounting must reflect what you actually hold: rights to assets, or a right to net assets."},
 {p:"The standard abolished proportionate consolidation of joint ventures, which had allowed entities to inflate revenue and assets."}
],
rules: [
 {h:"Joint control", p:"The contractually agreed sharing of control, where decisions about the relevant activities require the **unanimous consent** of the parties sharing control. Without unanimity there is no joint control."},
 {h:"Joint operation", p:"The parties have **rights to the assets and obligations for the liabilities**. Each recognises its own assets, its share of joint assets, its own liabilities, its share of joint liabilities, its revenue and its expenses — **line by line**."},
 {h:"Joint venture", p:"The parties have rights to the **net assets** of the arrangement. Accounted for by the **equity method** under IAS 28. Proportionate consolidation is prohibited."},
 {h:"How to tell them apart", p:"In order: (1) is there a **separate vehicle**? If not, it is always a joint operation; (2) the legal form of that vehicle; (3) the terms of the contract; (4) other facts — for instance an obligation on the parties to buy the entire output."},
 {h:"The party's own statements", p:"An interest in a joint operation is accounted for the same way. An interest in a joint venture is carried at cost, under IFRS 9, or by the equity method."}
],
example: [
 {h:"One project, two answers"},
 {table:{head:["Terms","Classification","Accounting at a 50% party"],rows:[
  ["Two entities jointly operate a pipeline with no separate entity","Joint operation","50% of the pipeline's assets and 50% of the costs, line by line"],
  ["A company is formed; the partners share only dividends","Joint venture","One investment line and a share of profit"],
  ["A company is formed, but each partner must buy 50% of output and is liable for the debts","**Joint operation**","Line by line, despite the separate entity"]
 ],note:"The third row matters most. A separate vehicle creates a presumption of a joint venture, but the contractual terms can rebut it."}},
 {h:"The difference in numbers"},
 {p:"The project has assets of 800, liabilities of 300, revenue of 600, expenses of 500 and profit of 100. The party's share is 50%."},
 {table:{head:["In the party's statements","Joint operation","Joint venture"],rows:[
  ["Assets","+400","+ an investment (one line)"],
  ["Liabilities","+150","0"],
  ["Revenue","+300","0"],
  ["Expenses","(250)","0"],
  ["Profit","+50","+50 (on one line)"],
  ["**Balance sheet total**","**Up by 400**","Up by the investment"]
 ],note:"Profit is identical, but revenue and the balance sheet total are radically different — and every ratio built on them changes: return on assets, asset turnover, gearing."}}
],
pitfalls: [
 "Treating an arrangement where decisions are taken by majority as joint control: without unanimity it is not.",
 "Applying proportionate consolidation to a joint venture — prohibited.",
 "Assuming any jointly formed legal entity is automatically a joint venture, without reading the contractual terms.",
 "Confusing joint control (unanimity among those sharing control) with significant influence under IAS 28."
],
quiz: [
 {q:"Three entities each hold 33.3% of a project; decisions require two votes out of three, and the contract does not specify which two parties must act together. Is there joint control?",
  opts:["Yes, for all three","No — the combination of parties acting together is not specified","Yes, for any two of them","Yes, but only with a written agreement"],
  a:1, e:"If the contract does not identify which combination of parties must agree unanimously, no party has joint control. Each will most likely account for its interest under IAS 28 (significant influence) or IFRS 9."},
 {q:"A party with a 40% interest in a joint operation reports:",
  opts:["The investment on one line","40% of assets, liabilities, income and expenses, line by line","100% of assets with a 60% NCI","Only dividends received"],
  a:1, e:"A joint operation means direct rights to the assets and obligations for the liabilities. The party recognises its share line by line, including its share of revenue and expenses — the one place in IFRS where the proportionate approach survives."},
 {q:"What is the fundamental difference between a joint operation and a joint venture?",
  a:"The rights held: to specific assets and obligations for liabilities, versus a right to net assets",
  e:"It is the nature of the rights that drives the accounting, not the size of the interest or the industry. Rights to the assets themselves, with responsibility for the liabilities, give a joint operation accounted for line by line. A right limited to a share of the net assets of a separate vehicle gives a joint venture accounted for by the equity method."}
]
},

/* ─────────────── FOUNDATIONS: TWO MORE ─────────────── */
{
code: "Regulatory framework", short: "Regulation", slug: "regulatory", topic: "basis",
title: "The Regulatory Framework",
titleEn: "Регулирование: кто пишет стандарты",
tags: ["IFRS Foundation", "IASB", "due process", "IFRIC", "principles-based", "standard setting"],
one: "Who actually writes IFRS, how a standard is made, and why a principles-based system beats a rulebook.",
why: [
 {p:"Standards do not appear from nowhere. Knowing who issues them, through what process and under what pressures explains a great deal about why they say what they say — and why some of them changed."},
 {p:"It also answers the awkward question of authority. The IASB is a private body with no power to compel anyone. IFRS becomes mandatory only because national regulators and stock exchanges adopt it — which is why 'IFRS as adopted by the EU' exists as a separate phrase."}
],
rules: [
 {h:"IFRS Foundation", p:"The parent body. It oversees the whole structure, appoints members and raises funding. Governed by **Trustees**, who are themselves accountable to a Monitoring Board of public authorities — the answer to 'who watches the watchmen'."},
 {h:"IASB", p:"The **International Accounting Standards Board** writes and issues the standards. Members are appointed for professional competence and practical experience, with a balance of geography and background."},
 {h:"IFRS Interpretations Committee", p:"Deals with points where a standard is unclear or is being applied inconsistently. It issues **IFRIC Interpretations**, which are as authoritative as the standards themselves."},
 {h:"IFRS Advisory Council", p:"A forum for organisations and individuals with an interest in reporting to advise the Board on agenda and priorities. It advises; it does not vote."},
 {h:"ISSB", p:"The **International Sustainability Standards Board**, created in 2021 under the same Foundation, issues IFRS Sustainability Disclosure Standards alongside the accounting standards."},
 {h:"Due process", p:"Agenda decision → research → **discussion paper** → **exposure draft** with public comment → analysis of responses → issue of the standard with a basis for conclusions. Each stage is public, and the comment letters are published."},
 {h:"Principles-based", p:"IFRS states a principle and requires judgement. A rules-based system (historically US GAAP) prescribes detailed tests. Principles are harder to game but demand more of the preparer — and more disclosure of judgements."},
 {h:"Why a conceptual framework helps", p:"It gives consistency across standards, a way to deal with new transactions, a defence against political lobbying, and a reference for anyone applying IAS 8 when no standard fits."}
],
example: [
 {h:"From problem to standard: the leases story"},
 {table:{head:["Stage","What happened"],rows:[
  ["Problem identified","Analysts routinely added operating lease commitments from the notes back onto the balance sheet — a sign the accounting did not work"],
  ["Discussion paper","Proposals for a single lessee model published for comment"],
  ["Exposure draft","Two drafts were issued; hundreds of comment letters argued over cost and the effect on covenants"],
  ["Redeliberation","The Board added the short-term and low-value exemptions in response"],
  ["Standard","IFRS 16 issued, effective 2019, with a basis for conclusions explaining each decision"]
 ],note:"The exemptions did not come from theory. They came from preparers demonstrating that the cost of full application to a warehouse full of laptops exceeded the benefit."}},
 {h:"Principles versus rules in one example"},
 {table:{head:["Question","Rules-based approach","IFRS approach"],rows:[
  ["Is this lease on balance sheet?","Four bright-line tests, e.g. the present value of payments is 90% or more of fair value","Does the contract convey the right to control the use of an identified asset?"],
  ["Consequence","Structure the deal to land at 89%","No line to aim at; judgement must be explained and disclosed"],
  ["Weakness","Form can be engineered around the test","Two entities can reach different answers on similar facts"]
 ]}},
 {h:"Why 'IFRS as adopted by the EU' is different"},
 {p:"The IASB issues a standard; the European Union then endorses it through its own process before it becomes law for EU listed companies. Endorsement can lag, and in rare cases parts are carved out. So an entity may state compliance with 'IFRS as adopted by the EU' rather than with IFRS as issued by the IASB — a distinction auditors take seriously."}
],
pitfalls: [
 "Believing the IASB can enforce anything. Enforcement is national: regulators, exchanges and auditors.",
 "Treating IFRIC Interpretations as optional guidance. They carry the same authority as standards.",
 "Assuming a principles-based system means there are no rules — it means fewer bright lines and far more required disclosure of judgements.",
 "Confusing the IFRS Advisory Council (advice) with the Interpretations Committee (authoritative interpretations).",
 "Assuming that every standard applies everywhere on the same date. Adoption and effective dates vary by jurisdiction."
],
quiz: [
 {q:"Which body issues authoritative interpretations where a standard is being applied inconsistently?",
  opts:["The IFRS Advisory Council","The IFRS Interpretations Committee","The Monitoring Board","The Trustees of the IFRS Foundation"],
  a:1, e:"The IFRS Interpretations Committee issues IFRIC Interpretations, which have the same authority as the standards. The Advisory Council advises on priorities, the Trustees govern and appoint, and the Monitoring Board provides public accountability."},
 {q:"Which document in the due process is published specifically to gather public comment on proposed requirements?",
  opts:["The basis for conclusions","The exposure draft","The practice statement","The annual improvements cycle"],
  a:1, e:"An exposure draft sets out the proposed wording and invites comment letters, which are published. A discussion paper may precede it at the research stage; the basis for conclusions accompanies the final standard and explains why the Board decided as it did."},
 {q:"Give one advantage and one drawback of a principles-based system compared with a rules-based one.",
  a:"Harder to engineer around; but similar facts can produce different answers",
  e:"A principle stated in terms of substance cannot be sidestepped by designing a transaction to fall one percentage point short of a bright line — the central weakness of rules. The cost is comparability: two entities exercising judgement on similar facts may reach different conclusions, which is why IFRS pairs its principles with extensive disclosure of the judgements made."}
]
},

{
code: "Measurement", short: "Measurement", slug: "measurement", topic: "basis",
title: "Measurement in the Conceptual Framework",
titleEn: "Оценка в Концептуальных основах",
tags: ["historical cost", "current value", "value in use", "fulfilment value", "capital maintenance", "derecognition"],
one: "Two families of measurement basis — historical cost and current value — and the reasoning the Board uses to choose between them.",
why: [
 {p:"Recognition asks whether an item belongs in the statements. Measurement asks at what number. The Framework does not name a single basis: it sets out the options and the factors that make one more useful than another."},
 {p:"That is why IFRS is a patchwork by design. Inventory at the lower of cost and NRV, investment property at fair value, receivables at amortised cost, biological assets at fair value less costs to sell — each choice traces back to these factors."}
],
rules: [
 {h:"Historical cost", p:"The value of the costs incurred in acquiring the asset, updated only for consumption (depreciation), impairment and collection. It is verifiable and cheap, but becomes stale and says nothing about current values."},
 {h:"Current value — fair value", p:"The price to sell in an orderly transaction between market participants (IFRS 13). A **market participant** perspective, independent of the entity."},
 {h:"Current value — value in use and fulfilment value", p:"The present value of the cash flows the **entity** expects from using an asset (value in use) or from settling a liability (fulfilment value). An **entity-specific** perspective."},
 {h:"Current value — current cost", p:"The cost of an equivalent asset at the measurement date, including the consideration that would be paid today. Rarely used in practice."},
 {h:"Factors in choosing", p:"**Relevance**: how the asset contributes to cash flows (used in combination, or sold on its own) and the sensitivity of its value to market factors. **Faithful representation**: whether measurement uncertainty is so high that the number stops being useful."},
 {h:"Cost constraint", p:"The cost of producing and verifying a measure is weighed against the benefit. It is a major reason why historical cost survives for so much of the balance sheet."},
 {h:"Recognition and derecognition", p:"An item is recognised if doing so provides relevant information whose benefits exceed the cost. Derecognition normally occurs when control of an asset is lost, or when a liability no longer exists — and should faithfully represent both the part retained and the part gone."},
 {h:"Capital maintenance", p:"**Financial capital maintenance**: profit is earned once the money amount of net assets exceeds the opening amount. **Physical capital maintenance**: profit arises only once the entity can maintain its operating capacity, so holding gains are treated as capital adjustments, not profit."}
],
example: [
 {h:"Why different assets get different bases"},
 {table:{head:["Asset","Basis used","The reasoning"],rows:[
  ["A factory machine","Historical cost less depreciation","Cash flows come from using it with other assets, not from selling it alone"],
  ["Investment property","Fair value (IAS 40 option)","It is held for its value; a market price is directly relevant to the investor"],
  ["Quoted shares held for trading","Fair value through profit or loss","Highly sensitive to market factors; a reliable price exists"],
  ["Trade receivables","Amortised cost less ECL","Cash flows are contractual; measurement uncertainty is low"],
  ["A dismantling provision","Fulfilment value (discounted)","No market exists; what matters is what this entity must spend"]
 ],note:"No basis is 'better'. Each is chosen where it best describes how that item generates or consumes cash."}},
 {h:"The same asset on three bases"},
 {p:"A machine bought five years ago for $500k, with an eight-year life. A comparable new machine now costs $700k. It could be sold today for $260k net. Its discounted future cash flows are $340k."},
 {table:{head:["Basis","Calculation","Amount"],rows:[
  ["Historical cost less depreciation","500 − (500/8 × 5)","$187.5k"],
  ["Fair value less costs of disposal","market exit price","$260k"],
  ["Value in use","PV of the entity's own cash flows","$340k"],
  ["Current cost","700 × 3/8 remaining","$262.5k"]
 ],note:"Four defensible numbers for one machine, ranging from 187.5 to 340. This is exactly why the choice of basis is a substantive accounting decision rather than a technicality."}},
 {h:"Capital maintenance in action"},
 {p:"An entity begins the year with inventory that cost $100 and sells it for $140. By the sale date, replacing that inventory costs $120."},
 {table:{head:["Concept","Profit","Reasoning"],rows:[
  ["Financial capital maintenance","**$40**","Money in is 140, money out was 100"],
  ["Physical capital maintenance","**$20**","$20 must be kept back to replace the item and stay the same size; only the remainder is distributable"]
 ],note:"IFRS uses financial capital maintenance in nominal terms. But the physical concept explains why a business reporting profit in a high-inflation period can still be shrinking."}}
],
pitfalls: [
 "Treating fair value and value in use as synonyms. Fair value is the market's view; value in use is this entity's.",
 "Assuming the Framework mandates fair value. It sets out options and selection factors; individual standards make the choice.",
 "Forgetting the cost constraint when arguing that everything should be at current value.",
 "Confusing measurement uncertainty with unreliability: a range of estimates can still be faithfully represented if it is properly disclosed.",
 "Ignoring capital maintenance when analysing an inflationary environment — nominal profit can mask an eroding business."
],
quiz: [
 {q:"Which measurement basis reflects an entity-specific rather than a market-participant perspective?",
  opts:["Fair value","Value in use","Current cost","Historical cost"],
  a:1, e:"Value in use (and fulfilment value for liabilities) discounts the cash flows this particular entity expects. Fair value deliberately excludes entity-specific intentions and uses the assumptions of market participants."},
 {q:"An entity starts the year with $100 of inventory, sells it for $140, and replacement cost at the date of sale is $120. What is profit under physical capital maintenance?",
  a:"$20",
  e:"Under physical capital maintenance, the entity must first be able to replace what it sold and remain the same operating size. $120 of the $140 is needed for that, so only $20 is profit. The other $20 is a capital maintenance adjustment. Under financial capital maintenance — the concept IFRS uses — profit would be $40."},
 {q:"Why does IFRS not prescribe a single measurement basis for all assets?",
  a:"Because relevance depends on how the asset contributes to cash flows, and faithful representation depends on measurement uncertainty",
  e:"An asset used in combination with others to produce goods is best described by what it cost, since its value is not realised by sale. An asset held for its market value is best described by that value. Add the cost constraint — some current values are expensive to produce and verify — and a mixed model is the deliberate outcome, not an inconsistency."}
]
},

/* ─────────────────────── REPORTING ─────────────────────── */
{
code: "IAS 33", slug: "ias33", topic: "report",
title: "Earnings per Share",
titleEn: "Прибыль на акцию",
tags: ["EPS", "basic", "diluted", "bonus issue", "rights issue", "TERP"],
one: "The most quoted figure in the accounts: earnings for ordinary shareholders divided by the weighted average number of shares.",
why: [
 {p:"Absolute profit tells an investor nothing: $10bn earned by a company with a million shares and one with a billion shares are different things. EPS reduces profit to a per-share basis and makes periods comparable."},
 {p:"All the difficulty is in the denominator. The share count changes during the year, and some issues (bonus, rights) require **prior periods to be restated** so the series stays comparable."}
],
rules: [
 {h:"Basic EPS", p:"Profit attributable to **ordinary shareholders of the parent** (after tax, after NCI, **less dividends on preference shares** classified as equity) divided by the weighted average number of ordinary shares."},
 {h:"Issue at full market price", p:"Weighted **by time**: shares issued on 1 October count for 3/12 of the year. Prior periods are not restated — the entity received resources and must earn on them."},
 {h:"Bonus issue (capitalisation)", p:"No resources are received. Treated as if the shares had **always** existed: applied to all periods, including **comparatives**."},
 {h:"Rights issue", p:"A hybrid: partly at market price, partly a bonus. A **adjustment factor** is applied = cum-rights price ÷ theoretical ex-rights price (TERP). It multiplies the share count for all periods before the issue."},
 {h:"Diluted EPS", p:"Includes potential ordinary shares: convertible bonds, options, warrants. It shows the worst case for the existing shareholder."},
 {h:"Convertible bonds", p:"Numerator: profit **plus** the post-tax interest saved (the interest will no longer be paid). Denominator: plus the maximum number of shares on conversion."},
 {h:"Options and warrants", p:"The numerator is unchanged. The denominator adds only the 'free' shares = number of options × (1 − exercise price ÷ average market price)."},
 {h:"Anti-dilution", p:"An instrument is included only if it **reduces** EPS. Instruments that increase EPS are ignored."}
],
example: [
 {h:"Weighted average number of shares"},
 {p:"2,000,000 shares at 1 January. 600,000 issued at market price on 1 May. A 1-for-5 bonus issue on 1 November."},
 {table:{head:["Period","Shares","Fraction of year","Bonus factor","Weighted"],rows:[
  ["1 Jan – 30 Apr","2,000,000","4/12","6/5","800,000"],
  ["1 May – 31 Oct","2,600,000","6/12","6/5","1,560,000"],
  ["1 Nov – 31 Dec","3,120,000","2/12","—","520,000"],
  ["**Weighted average**","","","","**2,880,000**"]
 ],note:"The 6/5 factor applies to every period BEFORE the bonus issue — including the comparative year, whose EPS is restated by multiplying by 5/6."}},
 {h:"A rights issue: computing TERP"},
 {p:"A company with 4,000,000 shares makes a 1-for-4 rights issue at $150. The cum-rights market price is $200."},
 {table:{head:["TERP calculation","Shares","Price","Value"],rows:[
  ["Existing shares","4","200","800"],
  ["New shares under the rights","1","150","150"],
  ["**Total**","**5**","","**950**"],
  ["**TERP** = 950 ÷ 5","","","**$190**"],
  ["**Adjustment factor** = 200 ÷ 190","","","**1.0526**"]
 ],note:"The factor is applied to the share count in every period before the rights issue, and the comparative EPS is restated by dividing by it."}},
 {h:"Diluted EPS"},
 {p:"Earnings for ordinary shareholders are $480m on a weighted average of 200m shares. There are $300m of 8% convertible bonds convertible into 30m shares. The tax rate is 20%."},
 {table:{head:["Measure","Basic","Diluted"],rows:[
  ["Earnings","480","480 + 300×8%×(1−20%) = **499.2**"],
  ["Shares (m)","200","200 + 30 = **230**"],
  ["**EPS**","**$2.40**","**$2.17**"]
 ],note:"Anti-dilution check: 2.17 < 2.40, so the instrument is dilutive and is included. Had the result exceeded 2.40, the bonds would be excluded."}},
 {h:"Options"},
 {p:"1,000,000 options at an exercise price of $120 with an average market price of $160 for the year. Free shares: 1,000,000 × (1 − 120/160) = **250,000**. Only those enter the denominator; the other 750,000 are treated as issued at fair value."}
],
pitfalls: [
 "Failing to deduct preference dividends (where the shares are classified as equity) from the numerator.",
 "Time-weighting a bonus issue — it is applied retrospectively to all periods.",
 "Forgetting to restate the comparative EPS after a bonus or rights issue.",

 {q:"Profit for the year is $900m, of which $60m is attributable to the non-controlling interest. Preference dividends (equity-classified) are $40m. There are 300m shares. Basic EPS:",

  e:"Numerator = 900 − 60 (NCI) − 40 (preference dividends) = $800m. EPS = 800/300 = $2.67. Both deductions are essential: the measure is for the ordinary shareholders of the parent specifically."},

{
code: "IFRS 8", slug: "ifrs8", topic: "report",
title: "Operating Segments",
titleEn: "Операционные сегменты",
tags: ["segments", "management approach", "10% threshold", "75% test", "CODM", "major customers"],
one: "An entity discloses its business the way its own management sees it — through the eyes of whoever allocates the resources.",
why: [
 {p:"Consolidated figures average everything: a loss-making division hides behind a profitable one. Segment information restores the detail and shows where the profit actually comes from."},
 {p:"IFRS 8 adopted the **management approach**: disclose exactly what the chief operating decision maker reviews regularly, measured the way they measure it — even if that is not IFRS. The price is limited comparability between entities."}
],
rules: [
 {h:"Operating segment", p:"A component that: engages in activities earning revenues and incurring expenses; whose results are **regularly reviewed** by the chief operating decision maker; and for which discrete financial information is available."},
 {h:"Who the CODM is", p:"A function, not a job title: whoever allocates resources and assesses performance. It may be the CEO, the board, or a group of directors."},
 {h:"Reportable segments — the 10% test", p:"A segment is reported if its revenue, **or** the absolute amount of its profit or loss, **or** its assets is 10% or more of the relevant combined total."},
 {h:"The 75% rule", p:"If the identified segments account for less than 75% of the entity's revenue, further segments are added until the threshold is met."},
 {h:"Aggregation", p:"Segments may be combined where they have similar economic characteristics and are similar in five respects: nature of products, nature of production processes, type of customer, distribution methods, regulatory environment."},
 {h:"Measurement", p:"Disclose the amount reported to the CODM even where it departs from IFRS. A **reconciliation** to the entity's reported totals is mandatory."},
 {h:"Entity-wide disclosures", p:"Regardless of segments: revenue by product and service, by geography (country of domicile and material countries), and information about **major customers** accounting for 10% or more of revenue."},
 {h:"Scope", p:"Only entities whose equity or debt is publicly traded, or that are in the process of listing."}
],
example: [
 {h:"The 10% test across three criteria"},
 {table:{head:["Segment","Revenue","% rev","Profit","% profit","Assets","% assets","Reportable?"],rows:[
  ["Retail","4,200","52.5%","380","47.5%","3,100","44.3%","Yes"],
  ["Wholesale","2,400","30.0%","260","32.5%","1,900","27.1%","Yes"],
  ["Logistics","900","11.3%","(90)","11.3%","1,400","20.0%","**Yes** — on all three"],
  ["Consulting","320","4.0%","150","18.8%","300","4.3%","**Yes** — on profit"],
  ["Other","180","2.3%","(20)","2.5%","300","4.3%","No"],
  ["Total","8,000","","680","","7,000","",""]
 ],note:"Note Logistics: the loss is taken at its absolute amount, so the sign is irrelevant. Consulting qualifies on profit alone — one criterion out of three is enough. The reported segments give 97.8% of revenue, so the 75% rule is satisfied."}},
 {h:"A reconciliation"},
 {table:{head:["Reconciliation of segment profit to profit before tax","$m"],rows:[
  ["Total profit of reportable segments","700"],
  ["Profit of other segments","(20)"],
  ["Unallocated corporate expenses","(110)"],
  ["Elimination of inter-segment transactions","(35)"],
  ["Finance costs","(95)"],
  ["**Profit before tax per the statement of profit or loss**","**440**"]
 ],note:"The reconciliation is mandatory precisely because segment figures may follow internal rules that differ from IFRS."}}
],
pitfalls: [
 "Identifying segments on the basis of what would be most helpful to a reader rather than how management actually reports.",
 "Ignoring a segment with a large loss: the 10% test uses the absolute amount of the result.",
 "Passing the 10% test but forgetting the overall 75% rule.",
 "Omitting major customer disclosure — often the most valuable information about concentration risk.",
 "Restating segment data onto an IFRS basis when management does not view it that way. The standard requires the opposite, with disclosure and a reconciliation."
],
quiz: [
 {q:"A segment has 6% of total revenue, a loss equal to 14% of the combined absolute segment results, and 4% of assets. Is it reportable?",
  a:"Yes",
  e:"Exceeding 10% on any one of the three criteria is enough. The result is measured as an absolute amount, so a large loss makes a segment reportable just as a large profit would — and that is exactly what an investor wants to see."},
 {q:"An entity earns 35% of its revenue from a single customer. What does IFRS 8 require?",
  opts:["Present that customer as a separate segment","Disclose the reliance, the amount of revenue and the segments it relates to","Nothing, unless the customer is a related party","Disclose the customer's name"],
  a:1, e:"Major customer disclosure (10% or more of revenue) is mandatory: the fact of reliance, the amount, and which segments the revenue sits in. The standard does not require the customer to be named — the concentration itself is the point."},
 {q:"Management measures segment profit before allocating corporate costs and on a cash basis. How should it be disclosed?",
  a:"As it is, with a description of the basis and a mandatory reconciliation to IFRS",
  e:"The management approach is the heart of IFRS 8: disclose the measure the chief operating decision maker regularly reviews. Converting it to IFRS would misrepresent how the business is actually run. In exchange, the standard requires the basis of measurement to be explained and segment totals reconciled to the corresponding IFRS amounts."}
]

{
code: "IAS 24", slug: "ias24", topic: "report",
title: "Related Party Disclosures",
titleEn: "Раскрытие информации о связанных сторонах",
tags: ["related parties", "key management personnel", "disclosure", "remuneration", "control"],
one: "Forces the entity to show its dealings with insiders — because the terms may not be arm's length even when the amounts look ordinary.",
why: [
 {p:"An entity can sell an asset to its shareholder at half price, or take an interest-free loan from a director. In the accounts that looks like an ordinary transaction, but the economics are quite different and the entity's future may depend on those relationships continuing."},
 {p:"IAS 24 measures and recognises nothing — it is purely a **disclosure** standard. Its force lies in requiring disclosure even where the transaction was on market terms."}
],
rules: [
 {h:"Who is related", p:"Parents, subsidiaries, associates and joint ventures; fellow members of the same group; **key management personnel** and their close family; entities controlled or significantly influenced by those people; post-employment benefit plans."},
 {h:"Who is NOT related", p:"Ordinary suppliers and customers, however large; banks, trade unions and utilities in the course of normal dealings; two entities merely because they share a board member."},
 {h:"Key management personnel", p:"Those with authority and responsibility for planning, directing and controlling the activities of the entity, including directors, executive and non-executive."},
 {h:"Parent–subsidiary relationships", p:"Disclosed **whether or not there have been transactions**. The parent must be named, and the ultimate controlling party too if different."},
 {h:"Transaction disclosures", p:"The nature of the relationship, the amount of the transactions, outstanding balances at the reporting date (including commitments and guarantees), terms and conditions, allowances for doubtful related party debts and the expense recognised on them."},
 {h:"Key management remuneration", p:"Disclosed in categories: short-term benefits, post-employment benefits, other long-term benefits, termination benefits and share-based payment."},
 {h:"Government-related exemption", p:"Entities related through a government are exempt from full disclosure of transactions with each other, but must disclose the nature of the government relationship and significant transactions."},
 {h:"No unsupported arm's-length claims", p:"A statement that transactions were on terms equivalent to arm's length is permitted **only if that can be substantiated**."}
],
example: [
 {h:"Related or not?"},
 {table:{head:["Situation","Related party?","Why"],rows:[
  ["A subsidiary in the group","Yes","Control"],
  ["An associate","Yes","Significant influence"],
  ["A company owned by the finance director's spouse","Yes","Close family member of key management personnel"],
  ["A supplier accounting for 60% of purchases","**No**","Economic dependence alone does not create a relationship"],
  ["A lending bank holding 30% of the entity's debt","**No**","Normal dealings with a lender"],
  ["Two entities sharing one non-executive director","**No**","A common director alone does not make them related"],
  ["The employees' pension plan","Yes","Specifically named in the standard"]
 ]}},
 {h:"What gets disclosed"},
 {table:{head:["Disclosure","$m"],rows:[
  ["Sales of goods to an associate","340"],
  ["Purchases of services from a company controlled by a director","85"],
  ["Receivables from related parties at the reporting date","120"],
  ["Allowance against related party receivables","(18)"],
  ["Interest-free loan to key management personnel","25"],
  ["Key management remuneration: short-term","210"],
  ["Key management remuneration: share-based payment","64"]
 ],note:"The interest-free loan to a director is exactly why the standard exists: the amount is small, but the fact itself matters for assessing governance."}}
],
pitfalls: [
 "Treating a major customer or supplier as a related party because of economic dependence.",
 "Omitting the parent relationship because there were no transactions in the period.",
 "Disclosing transaction amounts but not outstanding balances and terms.",
 "Stating that transactions were at arm's length without being able to substantiate it.",
 "Overlooking close family members of key management personnel and the entities they control."
],
quiz: [
 {q:"Which of these is NOT a related party under IAS 24?",
  opts:["A joint venture of the group","The chief executive's son","An entity supplying 70% of the group's purchases","The employees' pension plan"],
  a:2, e:"Economic dependence on a supplier or customer, however severe, does not make the parties related. It may be an important concentration disclosure under IFRS 7 or IFRS 8, but not under IAS 24."},
 {q:"There were no transactions with the parent during the year. Is any disclosure required?",
  a:"Yes — the control relationship itself",
  e:"Parent–subsidiary relationships are disclosed regardless of whether transactions occurred. The reason is that control itself can influence the entity's decisions at any time, so readers must know who controls it and who the ultimate controlling party is."},
 {q:"An entity sold a building to its majority shareholder at a market price supported by an independent valuation. Is disclosure required?",
  opts:["No, the price was market","Yes — the nature of the relationship, the amount and the terms","Only if the amount exceeds 10% of assets","Only in the note on events after the reporting period"],
  a:1, e:"Market pricing does not remove the disclosure requirement. Users must judge the influence of the relationship for themselves rather than rely on the entity's assertion. Indeed the independent valuation is what would allow the entity to state that the terms were arm's length at all."}
]

{
code: "IAS 34", slug: "ias34", topic: "report",
title: "Interim Financial Reporting",
titleEn: "Промежуточная финансовая отчётность",
tags: ["interim", "half-year", "quarter", "discrete period", "materiality", "effective tax rate"],
one: "Condensed statements for part of a year on the same policies as the annual accounts — each period measured on its own.",
why: [
 {p:"Once a year is too infrequent for the market. But a full set of statements every quarter would be too costly, so IAS 34 sets a minimum condensed package."},
 {p:"The standard does **not** require anyone to publish interim reports — that is for the regulator or the exchange. It only says how to prepare them if you do."}
],
rules: [
 {h:"Minimum content", p:"Condensed: statement of financial position, statement of profit or loss and other comprehensive income, statement of changes in equity, statement of cash flows, and **selected** explanatory notes."},
 {h:"Comparative periods", p:"Statement of financial position: at the end of the interim period and at the end of the **preceding annual** period. Profit or loss: for the current period and cumulatively year to date, with the equivalent periods of the prior year. Cash flows and equity: cumulative, with comparatives."},
 {h:"Discrete approach", p:"The interim period is treated as a **separate reporting period**. Estimates are made at its end; costs may not simply be smoothed across the year."},
 {h:"Materiality", p:"Assessed against the **interim** data, not the annual figures. An amount immaterial to the year can be highly material to a quarter."},
 {h:"Same accounting policies", p:"Those of the annual statements, except for changes adopted since the last annual accounts that will apply in the next annual statements."},
 {h:"Income tax", p:"Recognised using the **estimated average annual effective tax rate** applied to the period's profit. This is one of the few departures from the discrete approach."},
 {h:"No smoothing", p:"Costs expected to be incurred unevenly across the year (a major overhaul, an annual bonus) may **not** be accrued early unless an obligation exists at the end of the interim period. An impairment recognised in Q1 cannot be reversed in Q3 merely because 'it will even out over the year'."},
 {h:"Notes", p:"Disclose the **events and transactions significant to understanding changes** since the last annual statements, rather than repeating all annual disclosures."}
],
example: [
 {h:"The discrete approach in practice"},
 {table:{head:["Situation","Wrong","Right"],rows:[
  ["An annual bonus of $120m paid in December, with the obligation arising on the full-year result","Accrue $30m each quarter for smoothness","Accrue only once the obligation arises, as the conditions are met"],
  ["A major overhaul of $80m planned for Q4","Provide $20m a quarter","Nothing: a future overhaul creates no obligation (IAS 37)"],
  ["Insurance of $48m paid in January for the year","Expense $48m in Q1","Expense $12m a quarter — a prepayment"],
  ["Inventory written down by $25m in Q1; prices recover in Q2","Do not recognise it — 'it evens out'","Recognise the write-down in Q1 and the reversal in Q2"]
 ]}},
 {h:"Tax at the average annual rate"},
 {p:"Profit for the first half is $600m. Expected annual profit is $1,500m and the expected annual tax charge $285m (relief applies to part of the income)."},
 {table:{head:["Calculation","Amount"],rows:[
  ["Estimated average annual effective tax rate","285 ÷ 1,500 = 19%"],
  ["Tax for the first half","600 × 19% = **$114m**"]
 ],note:"Using the headline 20% rate would give $120m, pushing the whole benefit of the relief into the second half and distorting the seasonal picture."}}
],
pitfalls: [
 "Spreading costs evenly across quarters when no obligation yet exists.",
 "Assessing materiality against annual rather than interim figures.",
 "Applying the headline tax rate instead of the estimated average annual effective rate.",
 "Repeating the full set of annual disclosures rather than explaining changes since the last annual statements.",
 "Assuming IAS 34 requires quarterly reporting — that obligation comes from the regulator."
],
quiz: [
 {q:"A $50m goodwill impairment was recognised in Q1. Circumstances improved in Q2. What should be done?",
  opts:["Reverse the $50m in Q2","Nothing — reversing goodwill impairment is prohibited","Reverse in proportion to the improvement","Treat it as a change in estimate"],
  a:1, e:"The IAS 36 prohibition on reversing goodwill impairment applies in interim reporting too. IAS 34 states expressly that an impairment of goodwill recognised in an interim period is not reversed in a later period — otherwise interim reporting would become a smoothing device."},
 {q:"An entity expects annual profit of $800m at an effective rate of 22%. Q1 profit is $300m. What tax charge is recognised for the quarter?",
  a:"$66m",
  e:"300 × 22% = $66m. The estimated average annual effective rate is used rather than a rate computed from the quarter's own figures. This is a deliberate departure from the discrete approach: tax is essentially an annual charge and should be spread in proportion to profit."},
 {q:"Materiality in interim financial statements is assessed by reference to:",
  opts:["Expected annual figures","The interim period data","Prior year figures","A threshold set by the auditor"],
  a:1, e:"Recognition, classification and disclosure decisions are made using the interim period's own data. Otherwise interim reporting would lose its purpose: a $30m item is trivial against a $2bn annual profit but decisive against a $100m quarterly profit."}
]
},

{
code: "IFRS 7", slug: "ifrs7", topic: "report",
title: "Financial Instruments: Disclosures",
titleEn: "Финансовые инструменты: раскрытие информации",
tags: ["disclosure", "credit risk", "liquidity risk", "market risk", "sensitivity analysis", "maturity analysis"],
one: "Requires the entity to explain what risks its financial instruments carry and how it manages them — in words and in numbers.",
why: [
 {p:"The balance sheet shows how large the financial assets are, not how risky. A portfolio of high-grade government bonds and a portfolio of loans to poor-quality borrowers can carry the same amount and mean entirely different things."},
 {p:"IFRS 7 splits its requirements in two: the **significance** of financial instruments for financial position and performance, and the **nature and extent of risks**."}
],
rules: [
 {h:"Significance", p:"Carrying amounts by IFRS 9 category; gains, losses, income and expenses by category; hedge accounting information; fair values with the IFRS 13 hierarchy level."},
 {h:"Credit risk", p:"The risk of counterparty default. Disclose the approach to management, maximum exposure, collateral, expected credit loss information and the movement in the allowance by stage, and concentrations of risk."},
 {h:"Liquidity risk", p:"The risk of being unable to meet obligations. A **maturity analysis** of financial liabilities on undiscounted contractual cash flows is mandatory."},
 {h:"Market risk", p:"Currency, interest rate and other price risk. A **sensitivity analysis** is required: the effect on profit and equity of a reasonably possible change in the risk variable."},
 {h:"Qualitative disclosures", p:"For each risk: the exposure and how it arises, the objectives and policies for managing it, and changes from the previous period."},
 {h:"Transfers of financial assets", p:"Specific disclosures where assets are transferred but not derecognised (factoring with recourse, repos) and where continuing involvement is retained."}
],
example: [
 {h:"Maturity analysis (liquidity risk)"},
 {table:{head:["Liability","< 3 months","3–12 months","1–5 years","Over 5 years","Total flows"],rows:[
  ["Trade payables","1,850","120","—","—","1,970"],
  ["Bank loans (including interest)","240","720","3,100","1,400","5,460"],
  ["Lease liabilities","95","285","1,020","640","2,040"],
  ["**Total**","**2,185**","**1,125**","**4,120**","**2,040**","**9,470**"]
 ],note:"The key detail: the amounts are undiscounted contractual flows, so they include future interest. That is why the total of 9,470 exceeds the carrying amount of the liabilities — as it should."}},
 {h:"Sensitivity analysis (currency risk)"},
 {table:{head:["Scenario","Effect on profit before tax","Effect on equity"],rows:[
  ["10% weakening of the functional currency against the dollar","($148m)","($148m)"],
  ["10% strengthening against the dollar","+$148m","+$148m"],
  ["100 bp rise in interest rates","($62m)","($62m)"]
 ],note:"The methodology is disclosed too: which balances were included and why the movement is considered reasonably possible."}},
 {h:"Concentration of credit risk"},
 {p:"'The five largest counterparties account for 46% of trade receivables (prior year: 31%). All operate in the same sector and the same region.' That single sentence tells an investor more than the whole allowance table: the risk has not only grown, it has become undiversifiable."}
],
pitfalls: [
 "Presenting discounted amounts in the maturity analysis instead of undiscounted contractual flows.",
 "Offering only boilerplate about 'managing risks' with no quantitative data.",
 "Omitting concentrations of risk — often the most valuable part of the disclosure.",

quiz: [

  opts:["Carrying amounts at amortised cost","Undiscounted contractual cash flows","Fair values at the reporting date","Principal only"],

 {q:"Does IFRS 7 apply to a manufacturer with no investments?",

{
code: "Interpretation", short: "Ratios", slug: "analysis", topic: "report",
title: "Interpretation of Financial Statements",
titleEn: "Анализ и интерпретация финансовой отчётности",
tags: ["ratios", "profitability", "liquidity", "working capital", "gearing", "ROCE"],
one: "Not a standard but a skill: turning the numbers into conclusions about profitability, liquidity and solvency — and knowing where they mislead.",
why: [
 {p:"Every standard exists so that someone can read the statements and make a decision. Ratios are the reading instrument: they remove the effect of scale and make entities comparable."},
 {p:"But a ratio on its own means nothing. Is an 8% margin good? It depends on the industry, last year, the competition and the accounting policies. Analysis is always comparative."}
],
rules: [
 {h:"Profitability", p:"**ROCE** = operating profit ÷ (equity + non-current liabilities) — the headline measure of how well capital is used. **Gross margin** = gross profit ÷ revenue. **Operating margin** = operating profit ÷ revenue."},
 {h:"Decomposing ROCE", p:"ROCE = operating margin × asset turnover (revenue ÷ capital employed). That immediately shows the **cause** of a movement: pricing and costs, or the intensity of asset use."},
 {h:"Liquidity", p:"**Current ratio** = current assets ÷ current liabilities. **Quick (acid test) ratio** = (current assets − inventory) ÷ current liabilities."},
 {h:"Working capital cycle", p:"Inventory days = inventory ÷ cost of sales × 365. Receivable days = receivables ÷ revenue × 365. Payable days = payables ÷ purchases × 365. **Operating cycle** = inventory + receivables − payables."},
 {h:"Solvency", p:"**Gearing** = debt ÷ (debt + equity), or debt ÷ equity. **Interest cover** = operating profit ÷ finance costs."},
 {h:"Investor ratios", p:"EPS (IAS 33), P/E = share price ÷ EPS, dividend yield, dividend cover = EPS ÷ dividend per share."},
 {h:"The central limitation", p:"Ratios are built from numbers that depend on accounting policy. The revaluation model raises equity and therefore **lowers** ROCE. IFRS 16 raises gearing and EBITDA. Different useful lives change profit."},
 {h:"What ratios cannot see", p:"Seasonality (a retailer's 31 December balance sheet is atypical), one-off events, customer quality, inflation, the management team, industry specifics."}
],
example: [
 {h:"Decomposing ROCE: two businesses"},
 {table:{head:["Measure","Supermarket","Jewellery boutique"],rows:[
  ["Revenue","10,000","1,000"],
  ["Operating profit","300","180"],
  ["Capital employed","1,500","900"],
  ["**Operating margin**","**3%**","**18%**"],
  ["**Asset turnover**","**6.7**","**1.1**"],
  ["**ROCE**","**20%**","**20%**"]
 ],note:"Identical ROCE from completely different business models: one earns through volume, the other through margin. Comparing their margins directly is meaningless."}},
 {h:"Why a falling ROCE is not always bad news"},
 {p:"An entity revalued its buildings: +$400m to assets and equity. Operating profit was unchanged at $250m; capital employed rose from $1,000m to $1,400m."},
 {table:{head:["","Before revaluation","After"],rows:[
  ["Operating profit","250","250 − 20 extra depreciation = 230"],
  ["Capital employed","1,000","1,400"],
  ["**ROCE**","**25.0%**","**16.4%**"]
 ],note:"The business is not one cent worse. Only the accounting policy changed. Without investigating the cause, 'efficiency fell by a third' would be flatly wrong."}},
 {h:"Diagnosing a liquidity deterioration"},
 {table:{head:["Measure","2024","2025","Reading"],rows:[
  ["Current ratio","1.8","1.2","Deterioration"],
  ["Quick ratio","1.1","0.4","**Severe** deterioration"],
  ["Inventory days","45","96","Goods are not selling"],
  ["Receivable days","38","41","Broadly unchanged"],
  ["Payable days","50","82","Suppliers are being paid late"]
 ],note:"The story assembles itself: stock is sitting, cash is locked in inventory, so the entity is stretching its suppliers. The gap between the current and quick ratios is the key clue. The next question for the accounts is whether the inventory needs writing down under IAS 2."}}
],
pitfalls: [
 "Comparing ratios across industries without adjusting for the business model.",
 "Drawing a conclusion from one ratio without corroborating it: rising profit with falling cash flow is a warning sign.",
 "Ignoring the effect of accounting policy — revaluation, useful lives, capitalised development all move the numbers.",
 "Using year-end figures for a seasonal business without saying so.",

],
quiz: [
 {q:"Operating profit $420m, equity $1,200m, non-current liabilities $600m, current liabilities $400m. What is ROCE?",
  a:"23.3%",
  e:"Capital employed = 1,200 + 600 = $1,800m; current liabilities are excluded. ROCE = 420/1,800 = 23.3%. Including current liabilities is the classic error and would understate the ratio at 19.1%."},
 {q:"An entity has a current ratio of 2.1 and a quick ratio of 0.5. What does that indicate?",
  opts:["Strong solvency","Almost all liquidity is tied up in inventory","Excessive receivables","No short-term debt"],
  a:1, e:"Inventory is what creates the gap between the two ratios. On paper liquidity looks fine, but the entity could only settle its current liabilities by selling down the warehouse — slowly, and possibly at a discount. The next step in the analysis is inventory turnover and the net realisable value test."},
 {q:"An entity moved from operating lease accounting (pre-IFRS 16) to recognising a right-of-use asset and a lease liability. What happens to gearing and EBITDA?",
  a:"Gearing rises and EBITDA rises",

]
}
